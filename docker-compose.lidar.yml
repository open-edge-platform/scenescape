# Override for V2X infrastructure LiDAR pipeline.
# Usage: docker compose -f docker-compose.yml -f docker-compose.v2x.yml up -d dlstreamer-pipeline-server
name: scenescape

services:
  dlstreamer-pipeline-server:
    environment:
      - PIPELINE_SERVER_CONFIG=/home/pipeline-server/lidar-intersection-config.json
    volumes:
      - /home/labrat/V2X-Seq-SPD-Example/infrastructure-side:/data:ro
      - /home/labrat/scenescape/dlstreamer-pipeline-server/models/public/pointpillars:/home/pipeline-server/models/public/pointpillars:ro
    configs:
      - source: lidar_pipeline_config
        target: /home/pipeline-server/lidar-intersection-config.json

configs:
  lidar_pipeline_config:
    file: ./dlstreamer-pipeline-server/lidar-intersection-config.json
