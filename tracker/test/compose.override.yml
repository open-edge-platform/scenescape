# Docker Compose override for load testing
# Use with: docker compose -f compose.yml -f compose.test.yml up

services:
  tracker:
    configs:
      - source: tracker_test_config
        target: /scenescape/config/config.json
      - source: tracker_test_scenes
        target: /scenescape/config/scenes.json

configs:
  tracker_test_config:
    file: ./test/config/tracker.json
  tracker_test_scenes:
    file: ./test/config/scenes.json
