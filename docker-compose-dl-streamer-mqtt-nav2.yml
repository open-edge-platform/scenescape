# prefix for volume and container names, override with the environment variable COMPOSE_PROJECT_NAME
name: scenescape

networks:
  scenescape:

# Profiles:
# - Default (no profile): Core services including autocalibration
# - experimental: All services including mapping and cluster-analytics
# - mapping: Core services + mapping only
# - cluster-analytics: Core services + cluster-analytics only
# - vdms: Enable the VDMS service
# - mqtt_client: Enable MQTT to ROS 2 bridge for Nav2 integration

services:
  broker:
    image: eclipse-mosquitto:2.0.22
    ports:
      - "1883:1883"
    configs:
      - source: mosquitto-unsecure
        target: /mosquitto/config/mosquitto.conf
    networks:
      scenescape:
        aliases:
          - broker.scenescape.intel.com
    user: "${UID:-1000}:${GID:-1000}"
    restart: always
    pids_limit: 1000

  mqtt_client_bridge:
    build:
      context: ./mqtt_client_bridge
      args:
        http_proxy: http://proxy-dmz.intel.com:911
        https_proxy: http://proxy-dmz.intel.com:912
    image: mqtt_client_bridge:${VERSION:-latest}
    container_name: mqtt_client_bridge
    network_mode: host
    depends_on:
      broker:
        condition: service_started
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-4}
      - NAV2_ACTION_PREFIX=/j100_1234/
    restart: always
    pids_limit: 1000

configs:
  mosquitto-unsecure:
    file: ./dlstreamer-pipeline-server/mosquitto/mosquitto.conf
