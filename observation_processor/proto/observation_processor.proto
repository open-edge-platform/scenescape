syntax = "proto3";

// Probabilistic camera projection: the frustum Gaussian + amodal reasoner stage of the
// Scene Controller observation pipeline, extracted as a standalone service (ADR 13,
// Spatial Transform & Projection Service).
//
// Compatibility: the package version is the wire compatibility boundary. Within v1 only
// additive changes are allowed; field numbers and the semantics of existing fields are never
// changed or reused. Incompatible changes require a new package version.
package scenescape.observation_processor.v1;

import "google/protobuf/timestamp.proto";

// Converts one camera frame of 2D detections into world-space measurements that are assigned
// directly to robot-vision tracker inputs (rv::tracking::TrackedObject).
//
// Static data is resolved by the service from the SceneScape database and is not part of this
// contract:
//   - camera_id -> camera intrinsics, distortion, image size and pose (extrinsics);
//   - scene_id  -> scene mesh and mesh pose (mesh_translation / mesh_rotation / mesh_scale);
//   - category  -> object-library asset: size prior and project_to_map default.
//
// Errors are reported with gRPC status codes and apply to the whole frame:
//   INVALID_ARGUMENT     missing scene_id, camera_id or timestamp; a detection without category
//                        or bounding_box_px; non-finite box values or a negative box size;
//                        or more detections than the configured per-request limit.
//   NOT_FOUND            unknown scene_id or camera_id, or the camera is not in the scene.
//   FAILED_PRECONDITION  the camera is not calibrated; camera resolution exceeds the amodal
//                        bake limit; the scene mesh exceeds the size limit; a requested
//                        category's asset has non-finite or non-positive dimensions; or the
//                        mode is CONDITIONING_MODE_FULL and the scene has no usable mesh
//                        (use CONDITIONING_MODE_AUTO for frustum-only fallback).
//   UNAVAILABLE          the static data store is unreachable; retryable.
//   INTERNAL             projection or conditioning failed.
// On an error the client keeps its legacy projection for the frame, as the in-process
// observation pipeline does today. Liveness and readiness use the standard
// grpc.health.v1.Health service.
service ObservationProcessorService {
  rpc ProcessDetections(ProcessDetectionsRequest) returns (ProcessDetectionsResponse);
}

message ProcessDetectionsRequest {
  // Manager scene UID. Selects the scene mesh used by the amodal reasoner and project_to_map.
  string scene_id = 1;
  // SceneScape camera ID: the detector message `id`, as in the MQTT topic
  // scenescape/data/camera/{camera_id}. Selects the camera calibration.
  string camera_id = 2;
  // Frame acquisition time (the detector message `timestamp`). The service projects with the
  // camera pose valid at this time (the static calibration today) and echoes it back.
  google.protobuf.Timestamp timestamp = 3;
  ConditioningMode mode = 4;
  // Detections from this frame. Categories may be mixed. An empty list is valid and returns
  // no measurements.
  repeated CameraDetection detections = 5;
  // true: every DetectionMeasurement also carries the diagnostics `frustum` and `amodal`.
  // Default false: they are omitted, which keeps the response small for tracking clients.
  bool include_diagnostics = 6;
}

// One 2D camera detection: the per-detection input of the frustum Gaussian library
// (frustum_gaussian.from_scenescape_detections) plus the per-object pipeline options.
// The size prior always comes from the object-library asset of `category`. `axis_aware_sizing`
// defaults to false; `project_to_map` defaults to the asset flag. Set either field to override
// its default for this detection only.
message CameraDetection {
  // Field 4 was a per-detection size prior override; the asset is the only source.
  reserved 4;
  reserved "shape_prior";

  // Client correlation key (for example the MovingObject uuid). Echoed unchanged and not
  // interpreted by the service.
  string detection_id = 1;
  // Object-library category: the key of the detector message `objects` map, for example
  // "person". Required. Categories without an asset use the pedestrian prior
  // (mu 0.55 x 0.55 x 1.70 m, sigma 0.10 / 0.10 / 0.15 m).
  string category = 2;
  // Required.
  BoundingBoxPx bounding_box_px = 3;
  // true: box width is matched to mu_x and box height to mu_z (axis-aware sizing).
  // false: both box axes are matched to the orientation-averaged size.
  // When unset: false.
  optional bool axis_aware_sizing = 5;
  // true: place the object on the scene mesh under the box (DEPTH_SOURCE_MESH_FOOT) when the
  // mesh is hit. When unset: the asset flag, else false.
  optional bool project_to_map = 6;
}

// Axis-aligned box in raw image pixels of the camera stream, as in the detector schema
// `bounding_box_px`: top-left corner and size. The service owns undistortion and projection
// with the camera calibration.
message BoundingBoxPx {
  double x = 1;
  double y = 2;
  // >= 0
  double width = 3;
  // >= 0
  double height = 4;
}

enum ConditioningMode {
  // CONDITIONING_MODE_FULL when a usable GLB mesh is available; otherwise
  // CONDITIONING_MODE_FRUSTUM_ONLY (including when a declared mesh is missing,
  // unreadable, or too large).
  CONDITIONING_MODE_AUTO = 0;
  // Frustum Gaussian, then amodal reasoner conditioning against the scene mesh.
  CONDITIONING_MODE_FULL = 1;
  // Frustum Gaussian only; the amodal reasoner is skipped. project_to_map still uses the
  // scene mesh when a usable mesh is available.
  CONDITIONING_MODE_FRUSTUM_ONLY = 2;
}

message ProcessDetectionsResponse {
  string scene_id = 1;
  string camera_id = 2;
  google.protobuf.Timestamp timestamp = 3;
  // Mode applied; never CONDITIONING_MODE_AUTO.
  ConditioningMode mode = 4;
  // One entry per request detection, in request order.
  repeated DetectionMeasurement measurements = 5;
}

message DetectionMeasurement {
  string detection_id = 1;
  MeasurementStatus status = 2;
  // Set when status is MEASUREMENT_STATUS_OK.
  Measurement measurement = 3;
  // How the depth of `measurement` was obtained. Set when status is MEASUREMENT_STATUS_OK.
  DepthSource depth_source = 4;
  // Frustum Gaussian library output (diagnostics). Set when the request has
  // include_diagnostics.
  FrustumGaussian frustum = 5;
  // Amodal reasoner output (diagnostics). Set when the request has include_diagnostics, the
  // status is MEASUREMENT_STATUS_OK and the mode is CONDITIONING_MODE_FULL.
  AmodalConditioning amodal = 6;
}

enum MeasurementStatus {
  MEASUREMENT_STATUS_UNSPECIFIED = 0;
  MEASUREMENT_STATUS_OK = 1;
  // The box subtends too small an angle on both image axes to estimate depth (for example a
  // zero-size box). No measurement; the client keeps its legacy projection or drops it.
  MEASUREMENT_STATUS_DEPTH_UNOBSERVABLE = 2;
}

enum DepthSource {
  DEPTH_SOURCE_UNSPECIFIED = 0;
  // Frustum depth and variance (depth_est, depth_sigma^2); CONDITIONING_MODE_FRUSTUM_ONLY.
  DEPTH_SOURCE_FRUSTUM = 1;
  // Amodal-conditioned depth and variance; CONDITIONING_MODE_FULL.
  DEPTH_SOURCE_AMODAL = 2;
  // project_to_map: the ray through the box bottom-centre hits the scene mesh (foot), lifted by
  // half the object height (mu_z / 2) along world up. Along-ray variance is the frustum or
  // amodal variance capped at 0.05^2 m^2.
  DEPTH_SOURCE_MESH_FOOT = 3;
}

// World-space measurement in robot-vision layout, assigned directly to
// rv::tracking::TrackedObject. Scene frame, metres, z up. Index layout is
// rv::tracking::MeasurementIndex:
//   [0] x   [1] y   [2] z   [3] length (along x)   [4] width (along y)   [5] height (along z)
//   [6] yaw (radians)
message Measurement {
  // Exactly 7 values. x, y, z: object centre. length, width, height: the size prior means
  // mu_x, mu_y, mu_z. yaw: 0, not observed (see has_orientation).
  repeated double mean = 1;
  // Measurement noise R: exactly 49 values, 7x7 row-major, symmetric positive definite.
  // Maps to TrackedObject::measurementNoiseCov (Python: measurement_noise_covariance).
  //   x, y, z block: the frustum covariance with its along-ray variance replaced by the
  //     variance of `depth_source`, floored at 1e-4 m^2, so that R describes `mean`.
  //   length, width, height, yaw diagonal: 0.2 (the IntelLabsTracking default measurement
  //     noise).
  //   All other entries are 0.
  repeated double noise_covariance = 2;
  // Maps to TrackedObject::zMeasured. Always true for this service.
  bool z_measured = 3;
  // false: yaw is not observed. The client must not set the `has_orientation` attribute, so
  // the tracker ignores the yaw component.
  bool has_orientation = 4;
}

// Frustum Gaussian library output for one detection (frustum_gaussian.transform_to_world_batch),
// in the scene frame. Pinhole projection through the bounding-box centre.
message FrustumGaussian {
  // Camera centre; the origin of `ray` (amodal reasoner input `mu`).
  Vector3 ray_origin = 1;
  // Unit direction from the camera centre through the box centre.
  Vector3 ray = 2;
  // Monocular centroid: ray_origin + depth_est * ray.
  Vector3 mean = 3;
  // Exactly 9 values, 3x3 row-major, m^2. Ray-elongated ellipsoid: depth_sigma^2 along `ray`
  // and the lateral variances across it.
  repeated double covariance = 4;
  // Along-ray distance to the centroid (m): the width- and height-derived depths fused by
  // inverse variance.
  double depth_est = 5;
  // Standard deviation of depth_est (m).
  double depth_sigma = 6;
  // Depth bounds (m) from the size prior +/- sigma. depth_lo is 0 on a clipped axis.
  double depth_lo = 7;
  double depth_hi = 8;
  // Depth confidence in (0, 1]: 30^2 / (30^2 + depth_sigma^2).
  double score = 9;
  // Bitwise OR of ImageEdge values for the box edges that are not clipped by the image border
  // (3 px margin).
  uint32 edge_valid_mask = 10;
}

// Bit values of FrustumGaussian.edge_valid_mask.
enum ImageEdge {
  IMAGE_EDGE_UNSPECIFIED = 0;
  IMAGE_EDGE_LEFT = 1;
  IMAGE_EDGE_RIGHT = 2;
  IMAGE_EDGE_TOP = 4;
  IMAGE_EDGE_BOTTOM = 8;
}

// Amodal reasoner output (observation_conditioning.AmodalReasoner.generate) for one detection:
// the frustum depth Gaussian conditioned on the scene mesh. An occluder in front of the object
// truncates it from below, a wall behind it from above; objects in free space are unchanged.
message AmodalConditioning {
  // Conditioned along-ray depth (m).
  double depth = 1;
  // Conditioned along-ray variance (m^2).
  double depth_variance = 2;
}

message Vector3 {
  double x = 1;
  double y = 2;
  double z = 3;
}
