components:
  securitySchemes:
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization

  schemas:
    CreateSceneRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: "Scene name. Must be unique."
          x-restler-fuzzable-uuid: true # <-- ensures uniqueness for POST
        mesh_rotation:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: number
        mesh_scale:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: number

    UpdateSceneRequest:
      type: object
      properties:
        name:
          type: string
          description: "Updated scene name. Unique."
          x-restler-fuzzable-uuid: true # <-- ensures PUT never collides
        mesh_rotation:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: number
        mesh_scale:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: number

    Scene:
      type: object
      properties:
        uid:
          type: string
          readOnly: true # <-- RESTler stores this and reuses for GET/PUT/DELETE
        name:
          type: string
        mesh_rotation:
          type: array
          items:
            type: number
        mesh_scale:
          type: array
          items:
            type: number

    CreateAssetRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          x-restler-fuzzable-uuid: true
        file:
          type: string
          description: "Asset reference or URI"

    UpdateAssetRequest:
      type: object
      properties:
        name:
          type: string
          x-restler-fuzzable-uuid: true
        file:
          type: string

    Asset:
      type: object
      properties:
        uid:
          type: string
          readOnly: true
        name:
          type: string
        file:
          type: string

    CreateSensorRequest:
      type: object
      required:
        - name
        - scene
        - singleton_type
      properties:
        name:
          type: string
          x-restler-fuzzable-uuid: true
        scene:
          type: string
          format: uuid
        sensor_id:
          type: string
        singleton_type:
          type: string
          enum:
            - environmental
            - attribute

    UpdateSensorRequest:
      type: object
      properties:
        name:
          type: string
          x-restler-fuzzable-uuid: true
        singleton_type:
          type: string
          enum:
