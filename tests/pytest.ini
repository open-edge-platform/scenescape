[pytest]
testpaths =
    functional
    ui
    security/system
    system/stability
    system/metric
    sscape_tests
    kubernetes

addopts = -v --tb=short -s

# Live logging — shows setup/teardown progress in terminal and VS Code
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s %(levelname)s %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Per-test file handler format (used by utils/log.py)
log_file_level = DEBUG
log_file_format = %(asctime)s %(name)s %(levelname)s %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

filterwarnings =
    ignore::pytest.PytestCollectionWarning

markers =
    test_name(name): sets the XML test name attribute
    kubernetes_only: test only runs with --backend=kubernetes or --backend=all
    basic_acceptance: test is in a basic acceptance suite
