[pytest]
testpaths =
    functional
    ui
    security/system
    system/stability
    system/metric
    sscape_tests
    kubernetes

# --durations / --durations-min surface the slowest tests on every run so test
# suite performance is tracked and regressions are visible in CI logs/artifacts.
addopts = -v --tb=short -s --durations=25 --durations-min=0.05

# Live logging — shows setup/teardown progress in terminal and VS Code
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s %(levelname)s %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Per-test file handler format (used by utils/log.py)
log_file_level = DEBUG
log_file_format = %(asctime)s %(name)s %(levelname)s %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

filterwarnings =
    ignore::pytest.PytestCollectionWarning

markers =
    test_name(name): sets the XML test name attribute
    preserve_db: skip post-test DB restore so the next test can verify persistence
    kubernetes_only: test only runs with --backend=kubernetes or --backend=all
    basic_acceptance: test is in a basic acceptance suite
    flaky: known-unstable test; pytest-rerunfailures retries it (e.g. @pytest.mark.flaky(reruns=3, reruns_delay=5))
