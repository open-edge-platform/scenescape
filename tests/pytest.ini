[pytest]
# Only collect orchestration tests; functional/sscape_tests run inside containers
testpaths = test_functional.py test_unit.py test_ui.py

addopts = -v --tb=short -s

# Disable pytest's built-in live log — our utils/log.py manages console and
# per-test file handlers directly so we control exactly what appears on the
# terminal vs what goes into the log file (teardown is file-only).
log_cli = false

# Fallback format used when --log-file=<path> is passed manually
log_file_level = DEBUG
log_file_format = %(asctime)s %(name)s %(levelname)s %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

markers =
  skip_init: skip init-sample-data step
