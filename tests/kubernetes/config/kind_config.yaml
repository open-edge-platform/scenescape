kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: pytest-test-cluster
nodes:
- role: control-plane
  image: kindest/node:v1.35.0
  kubeadmConfigPatches:
  - |
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "ingress-ready=true"
  extraMounts:
  - hostPath: /dev/dri
    containerPath: /dev/dri
