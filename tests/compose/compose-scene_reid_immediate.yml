networks:
  scenescape-test:

secrets:
  root-cert:
    file: ${SECRETSDIR}/certs/scenescape-ca.pem
  reid-client-cert:
    file: ${SECRETSDIR}/certs/scenescape-reid.crt
  reid-client-key:
    file: ${SECRETSDIR}/certs/scenescape-reid.key
  django:
    file: ${SECRETSDIR}/django
  controller.auth:
    environment: CONTROLLER_AUTH

services:
  scene:
    image: intel/scenescape-controller
    init: true
    networks:
      scenescape-test:
    depends_on:
      web:
        condition: service_healthy
      broker:
        condition: service_started
      ntpserv:
        condition: service_started
      vdms:
        condition: service_started
    command: >
      --restauth /run/secrets/controller.auth
      --brokerauth /run/secrets/controller.auth
      --broker broker.scenescape.intel.com
      --ntp ntpserv
    volumes:
      - ./:/workspace
      - ./${DBROOT}/media:/workspace/media
      - ./controller/config/tracker-config-immediate.json:/home/scenescape/Scenescape/tracker-config.json
      - ${REID_CONFIG_FILE:-./controller/config/reid-config.json}:/home/scenescape/Scenescape/reid-config.json
    secrets:
      - source: root-cert
        target: certs/scenescape-ca.pem
      - source: reid-client-key
        target: certs/scenescape-reid.key
      - source: reid-client-cert
        target: certs/scenescape-reid.crt
      - django
      - controller.auth
    restart: on-failure
