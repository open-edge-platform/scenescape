networks:
  scenescape-test:

services:
  parent-analytics:
    image: intel/scenescape-analytics:${VERSION:-latest}
    init: true
    networks:
      scenescape-test:
    depends_on:
      parent-web:
        condition: service_healthy
      parent-broker:
        condition: service_started
      parent-ntpserv:
        condition: service_started
    environment:
      VISIBILITY_TOPIC: regulated
    command: >
      --restauth /run/secrets/controller.auth
      --resturl https://parent-web.scenescape.intel.com/api/v1
      --brokerauth /run/secrets/controller.auth
      --broker parent-broker.scenescape.intel.com
      --visibility_topic regulated
    secrets:
      - source: root-cert
        target: certs/scenescape-ca.pem
      - django
      - controller.auth
    restart: on-failure
