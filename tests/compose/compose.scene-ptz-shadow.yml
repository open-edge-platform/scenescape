# Scene Controller observing PTZ PoseContexts in shadow mode. Layer after compose.scene.yml.
services:
  scene:
    environment:
      CONTROLLER_PTZ_SHADOW_MODE: "true"
    volumes:
      - ./tests/compose/ptz/ptz-consumer-config-shadow.json:/home/scenescape/Scenescape/ptz-consumer-config.json:ro
      - ./tests/compose/positioning-assignments.json:/home/scenescape/Scenescape/positioning-assignments.json:ro
