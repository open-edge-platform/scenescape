networks:
  scenescape-test:

services:
  pgserver:
    image: postgres:18.6
    environment:
      POSTGRES_USER: scenescape
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: scenescape
    networks:
      - scenescape-test
    volumes:
      - vol-db:/var/lib/postgresql/data

volumes:
  vol-db:
