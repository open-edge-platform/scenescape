# Two extra controllers beside `scene` from compose.scene-reid.yml. All three
# share one broker, web, scene configuration and VDMS endpoint.
networks:
  scenescape-test:

x-scene-peer: &scene-peer
  image: intel/scenescape-controller
  init: true
  networks:
    scenescape-test:
  depends_on:
    web:
      condition: service_healthy
    broker:
      condition: service_started
    ntpserv:
      condition: service_started
    vdms:
      condition: service_started
  command: >
    --restauth /run/secrets/controller.auth
    --brokerauth /run/secrets/controller.auth
    --broker broker.scenescape.intel.com
    --ntp ntpserv
  volumes:
    - ./:/workspace
    - ${DBROOT}/media:/workspace/media
    - ./controller/config/tracker-config-persist-attr.json:/home/scenescape/Scenescape/tracker-config.json
    - ${REID_CONFIG_FILE:-./controller/config/reid-config.json}:/home/scenescape/Scenescape/reid-config.json
  secrets:
    - source: root-cert
      target: certs/scenescape-ca.pem
    - source: reid-client-key
      target: certs/scenescape-reid.key
    - source: reid-client-cert
      target: certs/scenescape-reid.crt
    - django
    - controller.auth
  environment:
    - REID_DESCRIPTOR_TTL_SECS=300
    - REID_PURGE_INTERVAL_SECS=300
  restart: on-failure

services:
  scene-b:
    <<: *scene-peer
  scene-c:
    <<: *scene-peer
