networks:
  scenescape-test:

secrets:
  root-cert:
    file: ${SECRETSDIR}/certs/scenescape-ca.pem
  positioning.auth:
    file: ${SECRETSDIR}/positioning.auth

services:
  positioning:
    image: intel/scenescape-positioning:${VERSION:-latest}
    networks:
      scenescape-test:
        aliases:
          - positioning.scenescape.intel.com
    depends_on:
      broker:
        condition: service_started
    command:
      - --broker
      - broker.scenescape.intel.com
      - --brokerauth
      - /run/secrets/positioning.auth
      - --rootcert
      - /run/secrets/certs/scenescape-ca.pem
      - --assignments
      - /app/deployment/positioning-assignments.json
    volumes:
      - ./tests/compose/positioning-assignments.json:/app/deployment/positioning-assignments.json:ro
    secrets:
      - source: root-cert
        target: certs/scenescape-ca.pem
      - positioning.auth
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import os,sys; sys.exit(0 if os.path.exists('/tmp/positioning-ready') else 1)"
      interval: 10s
      timeout: 3s
      retries: 3
    restart: on-failure
