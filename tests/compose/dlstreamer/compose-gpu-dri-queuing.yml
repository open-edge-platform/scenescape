# Optional GPU device mount for the queuing-video DLStreamer service.
# Included by resolve_compose_files() only when /dev/dri exists on the host.

networks:
  scenescape-test:

services:
  queuing-video:
    devices:
      - "/dev/dri:/dev/dri"
