networks:
  scenescape-test:

secrets:
  root-cert:
    file: ${SECRETSDIR}/certs/scenescape-ca.pem
  django:
    file: ${SECRETSDIR}/django
  controller.auth:
    file: ${SECRETSDIR}/controller.auth

volumes:
  scenescape_vol-media:
    external: true

services:
  scene:
    image: scenescape-controller:${VERSION:-latest}
    init: true
    networks:
      scenescape-test:
    depends_on:
     - broker
     - web
     - ntpserv
    environment:
      - "DBROOT"
    command: controller --broker broker.scenescape.intel.com --ntp ntpserv --maxlag 2
    volumes:
     - ./:/workspace
     - ${DBROOT}/media:/workspace/media
     - ./controller/config/tracker-config.json:/home/scenescape/SceneScape/tracker-config.json
    secrets:
     - source: root-cert
       target: certs/scenescape-ca.pem
     - django
     - controller.auth
    restart: on-failure
