networks:
  scenescape-test:

secrets:
  root-cert:
    file: ${SECRETSDIR}/certs/scenescape-ca.pem
  reid-server-cert:
    file: ${SECRETSDIR}/certs/scenescape-reid-s.crt
  reid-server-key:
    file: ${SECRETSDIR}/certs/scenescape-reid-s.key

services:
  vdms:
    image: intellabs/vdms:v2.12.0
    init: true
    ports:
      - "55555:55555"
    networks:
      scenescape-test:
        aliases:
          - reid.scenescape.intel.com
    environment:
      - OVERRIDE_ca_file=/run/secrets/certs/scenescape-ca.pem
      - OVERRIDE_cert_file=/run/secrets/certs/scenescape-vdms-s.crt
      - OVERRIDE_key_file=/run/secrets/certs/scenescape-vdms-s.key
      - OVERRIDE_autodelete_interval_s=300
    secrets:
      - source: root-cert
        target: certs/scenescape-ca.pem
      - source: reid-server-cert
        target: certs/scenescape-reid-s.crt
      - source: reid-server-key
        target: certs/scenescape-reid-s.key
    restart: always
    pids_limit: 1000
