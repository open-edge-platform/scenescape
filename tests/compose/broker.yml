networks:
  scenescape-test:

secrets:
  scenescape-broker.key:
    file: ${SECRETSDIR}/certs/scenescape-broker.key
  scenescape-broker.crt:
    file: ${SECRETSDIR}/certs/scenescape-broker.crt
  mosquitto:
    file: ${SECRETSDIR}/mosquitto

services:
  broker:
    image: scenescape-broker
    networks:
      scenescape-test:
        aliases:
          - broker.scenescape.intel.com
    secrets:
      - scenescape-broker.key
      - scenescape-broker.crt
    restart: always
