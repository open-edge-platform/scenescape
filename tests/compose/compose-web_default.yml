networks:
  scenescape-test:

secrets:
  root-cert:
    file: ${SECRETSDIR}/certs/scenescape-ca.pem
  web-cert:
    file: ${SECRETSDIR}/certs/scenescape-web.crt
  web-key:
    file: ${SECRETSDIR}/certs/scenescape-web.key
  django:
    file: ${SECRETSDIR}/django
  controller.auth:
    environment: CONTROLLER_AUTH
  browser.auth:
    file: ${SECRETSDIR}/browser.auth
  calibration.auth:
    file: ${SECRETSDIR}/calibration.auth

services:
  web:
    image: intel/scenescape-manager:${VERSION:-latest}
    init: true
    networks:
      scenescape-test:
        aliases:
          - web.scenescape.intel.com
    depends_on:
      - pgserver
    ports:
      - "443:443"
    command: >
      webserver
      --broker broker.scenescape.intel.com
      --brokerauth /run/secrets/browser.auth
      --brokerrootcert /run/secrets/certs/scenescape-ca.pem
    healthcheck:
      test: "curl --insecure -X GET https://web.scenescape.intel.com:443/api/v1/database-ready | grep 'true'"
      interval: 5s
      timeout: 60s
      retries: 10
      start_period: 120s
    environment:
      - "EXAMPLEDB=/home/scenescape/Scenescape/sample_data/exampledb.tar.bz2"
      - "DBHOST=pgserver"
      - "DBPORT=5432"
      - "DBTYPE=postgres"
      - "DBROOT"
      - "SUPASS"
      - "http_proxy=${http_proxy}"
      - "https_proxy=${https_proxy}"
      - "no_proxy=127.0.0.1,localhost,${no_proxy},.scenescape.intel.com"
      - "HTTP_PROXY=${HTTP_PROXY}"
      - "HTTPS_PROXY=${HTTPS_PROXY}"
      - "NO_PROXY=127.0.0.1,localhost,${NO_PROXY},.scenescape.intel.com"
    # web interface needs access to the media files
    volumes:
      - vol-media:/workspace/media
      - ./sample_data/exampledb.tar.bz2:/home/scenescape/Scenescape/sample_data/exampledb.tar.bz2
      - vol-migrations:/workspace/migrations
    secrets:
      - source: root-cert
        target: certs/scenescape-ca.pem
      - source: web-cert
        target: certs/scenescape-web.crt
      - source: web-key
        target: certs/scenescape-web.key
      - django
      - controller.auth
      - browser.auth
      - calibration.auth
    restart: on-failure

volumes:
  vol-media:
  vol-migrations:
