networks:
  scenescape-test:

secrets:
  root-cert:
    file: ${SECRETSDIR}/certs/scenescape-ca.pem
  django:
    file: ${SECRETSDIR}/django
  controller.auth:
    file: ${SECRETSDIR}/controller.auth

services:
  scene:
    image: scenescape-controller
    init: true
    networks:
      scenescape-test:
    depends_on:
      - broker
      - web
    command: controller --broker broker.scenescape.intel.com
    volumes:
      - ./media:/home/scenescape/SceneScape/media
    secrets:
      - source: root-cert
        target: certs/scenescape-ca.pem
      - django
      - controller.auth
    restart: on-failure
