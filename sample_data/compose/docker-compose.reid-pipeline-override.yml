# Replace the default DLStreamer Pipeline Server configs with the ReID-enabled
# versions. These configs are defined by each scene's own video-source stack,
# so this file overrides those stacks instead of the main docker-compose.yml.
# `make demo-reid` and `make demo-all` include this automatically. To run it
# manually:
#   docker compose -f docker-compose.yml -f sample_data/compose/docker-compose.vdms-override.yml --profile controller up -d
#   docker compose --project-directory . -f sample_data/demo_scenes/Retail/retail-video-compose.yaml \
#     -f sample_data/demo_scenes/Queuing/queuing-video-compose.yaml \
#     -f sample_data/compose/docker-compose.reid-pipeline-override.yml up -d

configs:
  retail-config:
    file: ./sample_data/demo_scenes/Retail/retail-config-reid.json
  queuing-config:
    file: ./sample_data/demo_scenes/Queuing/queuing-config-reid.json
