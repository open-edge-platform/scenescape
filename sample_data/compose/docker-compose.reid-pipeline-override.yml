# Swap the DLStreamer Pipeline Server configs for the ReID-enabled variants.
# retail-config/queuing-config are declared in the video-source stack, so this
# overrides that file, not docker-compose.yml. `make demo-reid`/`demo-all` wire
# this in automatically; combine manually with:
#   docker compose -f docker-compose.yml -f sample_data/compose/docker-compose.vdms-override.yml --profile controller up -d
#   docker compose --project-directory . -f sample_data/demo_scenes/docker-compose.video-source.yml \
#     -f sample_data/compose/docker-compose.reid-pipeline-override.yml up -d

configs:
  retail-config:
    file: ./dlstreamer-pipeline-server/retail-config-reid.json
  queuing-config:
    file: ./dlstreamer-pipeline-server/queuing-config-reid.json
