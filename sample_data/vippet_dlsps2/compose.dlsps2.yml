# ViPPET + DL Streamer Pipeline Server 2.0 demo: DLSPS 2.0 that runs the camera
# pipelines Manager starts. Started by `make demo-vippet-dlsps2` together with
# ../demo_scenes/Queuing/compose.queuing-video.yml; paths are relative to the
# repository root (--project-directory .). See README.md.
#
# It joins the Scenescape network, so pipelines reach rtsp://mediaserver:8554,
# ntpserv and broker.scenescape.intel.com, and Manager reaches it as
# http://dlsps.scenescape.intel.com:8080. ViPPET's shared models folder is
# mounted at the same path as in ViPPET (/models) so the model paths embedded
# in ViPPET pipeline strings resolve here too.

name: scenescape

networks:
  scenescape:
    external: true
    name: ${SCENESCAPE_NETWORK:-scenescape_scenescape}

secrets:
  root-cert:
    file: ${SECRETSDIR}/certs/scenescape-ca.pem

services:
  dlstreamer-pipeline-server:
    image: ${DLSPS2_IMAGE:-intel/dlstreamer-pipeline-server:2026.3.0-ubuntu24-2.0-rc1}
    hostname: dlstreamer-pipeline-server
    container_name: dlsps2-pipeline-server
    security_opt:
      - no-new-privileges
    privileged: false
    tty: true
    entrypoint: ["./run.sh"]
    ports:
      - "${DLSPS2_REST_SERVER_PORT:-8080}:8080"
    networks:
      scenescape:
        aliases:
          - dlsps.scenescape.intel.com
    environment:
      - REST_SERVER_PORT=8080
      - GST_DEBUG=1
      # Scenescape GStreamer elements (sscape_timestamp_capture,
      # sscape_post_inference_data_publish) are loaded from /home/sscape/python.
      - ADDITIONAL_GST_PLUGIN_PATH=/home/sscape
      - MQTT_HOST=${MQTT_HOST:-broker.scenescape.intel.com}
      - MQTT_PORT=${MQTT_PORT:-1883}
      - http_proxy=${http_proxy:-}
      - https_proxy=${https_proxy:-}
      - no_proxy=${no_proxy:-},localhost,127.0.0.1,mediaserver,ntpserv,.scenescape.intel.com
      # NPU related environment variable
      - ZE_ENABLE_ALT_DRIVERS=libze_intel_npu.so
    volumes:
      - ./dlstreamer-pipeline-server/user_scripts/gstplugins:/home/sscape/python:ro
      - ${VIPPET_SHARED_DIR:?set VIPPET_SHARED_DIR to ViPPET's shared directory}/models:/models:ro
      - "/run/udev:/run/udev:ro"
      - "/dev:/dev"
    secrets:
      # The Scenescape MQTT broker only accepts TLS; the publisher trusts this CA.
      - source: root-cert
        target: certs/scenescape-ca.pem
    # Writable scratch space (root filesystem stays clean; add read_only: true
    # above once all writable paths are covered by tmpfs mounts).
    tmpfs:
      - /tmp
      - /var/tmp
    group_add:
      - "109"
      - "110"
      - "992"
    device_cgroup_rules:
      - "c 189:* rmw"
      - "c 209:* rmw"
      - "a 189:* rwm"
    devices:
      # GPU (dri) / NPU (accel) / USB cameras. Selective mounts are preferred
      # over mounting all of /dev in production deployments.
      - "/dev:/dev"
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request as r; r.build_opener(r.ProxyHandler({})).open('http://127.0.0.1:8080/pipelines/status', timeout=5)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    pids_limit: 1000
