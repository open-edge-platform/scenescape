# Self-contained video source for the Basketball demo scene: its own mediamtx +
# ffmpeg loopers publish cam1/cam2 over RTSP, and DL Streamer Pipeline Server
# runs YOLO-World (person + basketball) on GPU via gvadetect and publishes
# detections over MQTT. Both cameras share model-instance-id so inference stays
# rate-aligned (no CPU sidecar).
# Run alongside the main Scenescape stack (same COMPOSE_PROJECT_NAME so the
# "scenescape" Docker network and vol-models volume are shared), e.g.:
#   make demo-basketball
# or:
#   make basketball-video-source-up
#
# Do not combine with Retail/Queuing/Stairs video compose files for this workflow
# (they publish a "mediaserver" on the same host port).

name: scenescape

networks:
  scenescape:
    external: true
    name: ${SCENESCAPE_NETWORK:-scenescape_scenescape}

secrets:
  root-cert:
    file: ${SECRETSDIR}/certs/scenescape-ca.pem

configs:
  basketball-config:
    file: ./sample_data/demo_scenes/Basketball/basketball-config.json

services:
  mediaserver:
    image: bluenviron/mediamtx:1.21.1
    networks:
      scenescape:
        aliases:
          - mediaserver
    ports:
      - "${VIDEOSOURCE_PORT:-8554}:8554"
    restart: always
    pids_limit: 1000

  basketball-cams:
    image: linuxserver/ffmpeg:version-9.0-cli
    command: -nostdin -re -stream_loop -1 -i /workspace/media/cam1.ts -re -stream_loop -1 -i /workspace/media/cam2.ts -map 0:v -c copy -f rtsp -rtsp_transport tcp rtsp://mediaserver:8554/bball-cam1 -map 1:v -c copy -f rtsp -rtsp_transport tcp rtsp://mediaserver:8554/bball-cam2
    volumes:
      - ./sample_data/demo_scenes/Basketball/video:/workspace/media:ro
    networks:
      scenescape:
    depends_on:
      - mediaserver
    restart: always
    pids_limit: 1000

  basketball-video:
    image: docker.io/intel/dlstreamer-pipeline-server:2026.3.0-20261020-weekly-ubuntu24
    networks:
      scenescape:
    tty: true
    entrypoint: ["./run.sh"]
    devices:
      - "/dev/dri:/dev/dri"
    # Host GIDs: video=44, render=992 (required for renderD* access)
    group_add:
      - "44"
      - "992"
    device_cgroup_rules:
      - "c 226:* rmw"   # DRM (/dev/dri)
      - "c 189:* rmw"
      - "c 209:* rmw"
      - "a 189:* rwm"
    depends_on:
      basketball-cams:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-I", "-s", "http://localhost:8080/pipelines"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      - RUN_MODE=EVA
      - GENICAM=Balluff
      - GST_DEBUG=1,gencamsrc:2
      - ADDITIONAL_GST_PLUGIN_PATH=/home/sscape
      - ADD_UTCTIME_TO_METADATA=true
      - APPEND_PIPELINE_NAME_TO_PUBLISHER_TOPIC=false
      - MQTT_HOST=broker.scenescape.intel.com
      - MQTT_PORT=1883
      - REST_SERVER_PORT=8080
      - HTTPS_PROXY=${HTTPS_PROXY}
      - https_proxy=${https_proxy}
      - HTTP_PROXY=${HTTP_PROXY}
      - http_proxy=${http_proxy}
      - NO_PROXY=mediaserver,broker.scenescape.intel.com,${NO_PROXY}
      - no_proxy=mediaserver,broker.scenescape.intel.com,${no_proxy}
    configs:
      - source: basketball-config
        target: /home/pipeline-server/config.json
    volumes:
      - ./dlstreamer-pipeline-server/user_scripts/gstplugins:/home/sscape/python:ro
      - vol-dlstreamer-pipeline-server-pipeline-root-basketball:/var/cache/pipeline_root:uid=1999,gid=1999
      - vol-models:/home/pipeline-server/models
      # OpenVINO FP16 YOLO-World IR (person + basketball) for gvadetect on GPU
      - ./sample_data/demo_scenes/Basketball/models/yolov8s-worldv2-person-basketball:/home/pipeline-server/models/public/yolov8s-worldv2-person-basketball:ro
    secrets:
      - source: root-cert
        target: certs/scenescape-ca.pem
    restart: always
    pids_limit: 1000

volumes:
  vol-models:
  vol-dlstreamer-pipeline-server-pipeline-root-basketball:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
