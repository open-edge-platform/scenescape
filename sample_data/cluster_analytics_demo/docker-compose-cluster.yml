# Minimal Docker Compose for Cluster Analytics Testing
# This composition includes only the essential services needed for cluster analytics testing
# without retail/queuing video processing components

name: scenescape-cluster

networks:
  scenescape:

secrets:
  root-cert:
    file: ${SECRETSDIR}/certs/scenescape-ca.pem
  web-cert:
    file: ${SECRETSDIR}/certs/scenescape-web.crt
  web-key:
    file: ${SECRETSDIR}/certs/scenescape-web.key
  django:
    file: ${SECRETSDIR}/django
  controller.auth:
    environment: CONTROLLER_AUTH
  browser.auth:
    file: ${SECRETSDIR}/browser.auth

services:
  # NTP service for time synchronization
  ntpserv:
    image: dockurr/chrony
    networks:
      scenescape:
    restart: on-failure
    pids_limit: 1000

  # MQTT Broker for message communication
  broker:
    image: eclipse-mosquitto
    ports:
      - "1883:1883"
    configs:
      - source: mosquitto-secure
        target: /mosquitto/config/mosquitto.conf
    volumes:
      - ${SECRETSDIR}:/mosquitto/secrets
    networks:
      scenescape:
        aliases:
          - broker.scenescape.intel.com
    user: "${UID:-1000}:${GID:-1000}"
    pids_limit: 1000

  # PostgreSQL Database
  pgserver:
    image: postgres:17.6
    environment:
      POSTGRES_USER: scenescape
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: scenescape
    networks:
      - scenescape
    volumes:
      - vol-db:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # Web Manager Service
  web:
    image: scenescape-manager:${VERSION:-latest}
    init: true
    networks:
      scenescape:
        aliases:
          - web.scenescape.intel.com
    depends_on:
      - pgserver
    ports:
      - "443:443"
    command: >
      webserver
      --dbhost pgserver
      --dbtype postgres
      --dbport 5432
      --broker broker.scenescape.intel.com
      --brokerauth /run/secrets/browser.auth
      --brokerrootcert /run/secrets/certs/scenescape-ca.pem
    healthcheck:
      test: "curl --insecure -X GET https://web.scenescape.intel.com:443/api/v1/database-ready | grep 'true'"
      interval: 10s
      timeout: 120s
      retries: 10
      start_period: 10s
    environment:
      - EXAMPLEDB=/home/scenescape/SceneScape/sample_data/exampledb.tar.bz2
      - SUPASS
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse
    security_opt:
      - apparmor:unconfined
    volumes:
      - vol-media:/workspace/media
      - vol-sample-data:/home/scenescape/SceneScape/sample_data
      - vol-migrations:/workspace/migrations
    secrets:
      - source: root-cert
        target: certs/scenescape-ca.pem
      - source: web-cert
        target: certs/scenescape-web.crt
      - source: web-key
        target: certs/scenescape-web.key
      - django
      - controller.auth
      - browser.auth
    restart: always
    pids_limit: 1000

  # Scene Controller Service
  scene:
    image: scenescape-controller:${VERSION:-latest}
    init: true
    networks:
      scenescape:
    depends_on:
      web:
        condition: service_healthy
      broker:
        condition: service_started
      ntpserv:
        condition: service_started
    environment:
      - CONTROLLER_ENABLE_METRICS
      - CONTROLLER_METRICS_ENDPOINT
      - CONTROLLER_METRICS_EXPORT_INTERVAL_S
      - CONTROLLER_ENABLE_TRACING
      - CONTROLLER_TRACING_ENDPOINT
      - CONTROLLER_TRACING_SAMPLE_RATIO
    command: >
      --restauth /run/secrets/controller.auth
      --brokerauth /run/secrets/controller.auth
      --broker broker.scenescape.intel.com
      --ntp ntpserv
    configs:
      - source: tracker-config
        target: /home/scenescape/SceneScape/tracker-config.json
    volumes:
      - vol-media:/home/scenescape/SceneScape/media
      - vol-sample-data:/home/scenescape/SceneScape/sample_data
    secrets:
      - source: root-cert
        target: certs/scenescape-ca.pem
      - django
      - controller.auth
    restart: always
    pids_limit: 1000

  # Cluster Analytics Service - The main service for testing
  cluster-analytics:
    image: scenescape-cluster-analytics:${VERSION:-latest}
    init: true
    networks:
      scenescape:
    command: >
      --broker broker.scenescape.intel.com
      --resturl https://web.scenescape.intel.com:443/api/v1
      --restauth /run/secrets/controller.auth
      --brokerauth /run/secrets/controller.auth
    depends_on:
      web:
        condition: service_healthy
      broker:
        condition: service_started
      scene:
        condition: service_started
    secrets:
      - source: root-cert
        target: certs/scenescape-ca.pem
      - controller.auth
    restart: always
    pids_limit: 1000

configs:
  mosquitto-secure:
    file: ../../dlstreamer-pipeline-server/mosquitto/mosquitto-secure.conf
  tracker-config:
    file: ../../controller/config/tracker-config.json

volumes:
  vol-db:
  vol-media:
  vol-migrations:
  vol-sample-data:
