# Radar-intersection fusion demo (opt-in, dedicated target). Run with:
#
#   SUPASS=<password> make demo-radar
#   SUPASS=<password> RADAR_PERCEPTION=roadside make demo-radar
#   SUPASS=<password> RADAR_PERCEPTION=radarpillars make demo-radar
#
# RADAR_PERCEPTION (all via g3dinference → gvametaconvert → MQTT):
#   classical    — model-type=classical, frames_bin 5-float (default)
#   roadside     — model-type=roadside, OpenVINO PointNetSeg + host instances
#   radarpillars — model-type=radarpillars, VoD 7-float pcd_bin
#
# Requires: make build-dlsps-g3d (classical/roadside/radarpillars share the plugin).
# See docs/user-guide/how-to-guides/run-radar-intersection-demo.md.

services:
  radar-scene-init:
    image: alpine:3.23
    networks:
      scenescape:
    depends_on:
      web:
        condition: service_healthy
    environment:
      - SUPASS=${SUPASS}
      - HTTPS_PROXY=${HTTPS_PROXY}
      - https_proxy=${https_proxy}
      - NO_PROXY=${NO_PROXY},.scenescape.intel.com
      - no_proxy=${no_proxy},.scenescape.intel.com
    volumes:
      - ./sample_data/radar_intersection/RadarIntersection-scene-import.zip:/scene-import/RadarIntersection-scene-import.zip:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        apk add --no-cache curl >/dev/null
        # --data-urlencode: SUPASS may contain +/=/& which break raw -d forms.
        TOKEN=$$(curl -sk -X POST \
          --data-urlencode "username=admin" \
          --data-urlencode "password=${SUPASS}" \
          https://web.scenescape.intel.com/api/v1/auth \
          | sed -n 's/.*"token"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
        if [ -z "$$TOKEN" ]; then
          echo "radar-scene-init: failed to authenticate to the Scenescape API"
          exit 1
        fi
        if curl -sk -H "Authorization: Token $$TOKEN" https://web.scenescape.intel.com/api/v1/scenes \
          | grep -Eq '"name"[[:space:]]*:[[:space:]]*"Radar Intersection"'; then
          echo "radar-scene-init: 'Radar Intersection' scene already exists, skipping import"
          exit 0
        fi
        echo "radar-scene-init: importing 'Radar Intersection' scene..."
        HTTP=$$(curl -sk -o /tmp/import-out -w '%{http_code}' -X POST \
          -H "Authorization: Token $$TOKEN" \
          -F "zipFile=@/scene-import/RadarIntersection-scene-import.zip" \
          https://web.scenescape.intel.com/api/v1/import-scene/)
        if [ "$$HTTP" != "200" ] && [ "$$HTTP" != "201" ]; then
          echo "radar-scene-init: import-scene failed HTTP $$HTTP"
          head -c 2000 /tmp/import-out || true
          echo
          exit 1
        fi
        echo "radar-scene-init: done (HTTP $$HTTP)"
    restart: "no"
    pids_limit: 1000

  # Prefer real VIDETEC-2 frames/pcd_bin when RADAR_RAW_DATASET_DIR is populated
  # (see run-radar-intersection-demo.md). Fall back to synthetic frames for CI
  # hosts without the Zenodo archive. Optional camera JPEGs from V2X-Seq.
  radar-data-init:
    image: python:3.11-slim
    environment:
      - HTTPS_PROXY=${HTTPS_PROXY}
      - https_proxy=${https_proxy}
      - NO_PROXY=${NO_PROXY},.scenescape.intel.com
      - no_proxy=${no_proxy},.scenescape.intel.com
      - JPEG_SRC_DIR=/src/image
      - JPEG_DST_DIR=/dst/radar_intersection/images
      - JPEG_QUALITY=${JPEG_QUALITY:-50}
      - RADAR_NUM_FRAMES=${RADAR_NUM_FRAMES:-60}
      - RADAR_MAX_FRAMES=${RADAR_MAX_FRAMES:-}
      - RADAR_REQUIRE_REAL=${RADAR_REQUIRE_REAL:-false}
      # Subdir under RADAR_RAW_DATASET_DIR for 7-float bins (e.g. pcd_bin_acc5).
      - RADAR_PCD_SUBDIR=${RADAR_PCD_SUBDIR:-pcd_bin}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        pip install --no-cache-dir --quiet numpy pillow h5py
        mkdir -p /dst/radar_intersection/frames /dst/radar_intersection/pcd_bin /dst/radar_intersection/images
        PREPARE_ARGS="-o /dst/radar_intersection -n $${RADAR_NUM_FRAMES}"
        if [ -n "$${RADAR_MAX_FRAMES}" ]; then
          PREPARE_ARGS="$${PREPARE_ARGS} --max-frames $${RADAR_MAX_FRAMES}"
        fi
        if [ "$${RADAR_REQUIRE_REAL}" = "true" ]; then
          PREPARE_ARGS="$${PREPARE_ARGS} --require-real"
        fi
        PCD_SUB="$${RADAR_PCD_SUBDIR:-pcd_bin}"
        # Prefer host-converted frames, then prebuilt pcd bins, then HDF5.
        if [ -d /src/radar/frames ] && ls /src/radar/frames/*.npy >/dev/null 2>&1; then
          PREPARE_ARGS="$${PREPARE_ARGS} --frames-dir /src/radar/frames"
          if [ -d "/src/radar/$${PCD_SUB}" ] && ls "/src/radar/$${PCD_SUB}"/*.bin >/dev/null 2>&1; then
            PREPARE_ARGS="$${PREPARE_ARGS} --pcd-bin-dir /src/radar/$${PCD_SUB}"
          fi
          echo "radar-data-init: using real frames under /src/radar/frames (pcd=$${PCD_SUB})"
        elif [ -d "/src/radar/$${PCD_SUB}" ] && ls "/src/radar/$${PCD_SUB}"/*.bin >/dev/null 2>&1; then
          PREPARE_ARGS="$${PREPARE_ARGS} --pcd-bin-dir /src/radar/$${PCD_SUB}"
          echo "radar-data-init: using real pcd under /src/radar/$${PCD_SUB}"
        elif ls /src/radar/*.h5 >/dev/null 2>&1 || ls /src/radar/*.hdf5 >/dev/null 2>&1; then
          HDF5=$$(ls /src/radar/*.h5 /src/radar/*.hdf5 2>/dev/null | head -1)
          PREPARE_ARGS="$${PREPARE_ARGS} --hdf5 $${HDF5}"
          echo "radar-data-init: converting HDF5 $${HDF5}"
        else
          echo "radar-data-init: no real VIDETEC under /src/radar — synthetic fallback"
        fi
        python3 /prepare_radar_demo_data.py $${PREPARE_ARGS}
        if [ -d /src/image ] && ls /src/image/*.jpg >/dev/null 2>&1; then
          python3 /reencode_jpegs.py
        else
          echo 'radar-data-init: no camera JPEGs under /src/image — camera branch needs RADAR_CAM_DATASET_DIR'
        fi
        echo 'radar_intersection data ready'
    volumes:
      - ${RADAR_RAW_DATASET_DIR:-./sample_data/radar_intersection/VIDETEC-2/converted}:/src/radar:ro
      - ${RADAR_CAM_DATASET_DIR:-./sample_data/lidar_intersection/V2X-Seq-SPD-Example}/infrastructure-side/image:/src/image:ro
      - ./sample_data/radar_intersection/prepare_radar_demo_data.py:/prepare_radar_demo_data.py:ro
      - ./sample_data/radar_intersection/generate_synthetic_radar_frames.py:/generate_synthetic_radar_frames.py:ro
      - ./sample_data/radar_intersection/videtec_to_pcd.py:/videtec_to_pcd.py:ro
      - ./radar/videtec_hdf5_to_frames.py:/videtec_hdf5_to_frames.py:ro
      - ./sample_data/lidar_intersection/reencode_jpegs.py:/reencode_jpegs.py:ro
      - vol-sample-data:/dst
    restart: "no"
    pids_limit: 1000

  radar-model-init:
    image: docker.io/intel/dlstreamer-pipeline-server:2026.2.0-ubuntu24-rc2
    user: root
    entrypoint: ["/bin/bash", "/model_installer/install-radar-perception"]
    environment:
      - MODELS_PATH=/home/pipeline-server/models
      - RADAR_PERCEPTION=${RADAR_PERCEPTION:-classical}
      - RADAR_IR_DIR=${RADAR_IR_DIR:-}
      - HTTPS_PROXY=${HTTPS_PROXY}
      - https_proxy=${https_proxy}
      - NO_PROXY=${NO_PROXY},.scenescape.intel.com
      - no_proxy=${no_proxy},.scenescape.intel.com
    volumes:
      - ./sample_data/radar_intersection/model_installer:/model_installer
      - vol-models:/home/pipeline-server/models
    restart: "no"
    pids_limit: 1000

  radar-stream:
    image: ${DLS_G3D_IMAGE:-intel/dlstreamer-pipeline-server:2026.2.0-ubuntu24-rc2-g3d}
    networks:
      scenescape:
    tty: true
    entrypoint:
      ["python3", "/home/pipeline-server/user_scripts/radar_publisher.py"]
    depends_on:
      broker:
        condition: service_started
      ntpserv:
        condition: service_started
      radar-scene-init:
        condition: service_completed_successfully
      radar-data-init:
        condition: service_completed_successfully
      radar-model-init:
        condition: service_completed_successfully
    environment:
      - MQTT_HOST=broker.scenescape.intel.com
      - MQTT_PORT=1883
      - RADAR_PERCEPTION=${RADAR_PERCEPTION:-classical}
      - RADAR_SENSOR_ID=intersection-radar1
      - RADAR_DEVICE=${RADAR_DEVICE:-CPU}
      - RADAR_FRAME_RATE=${RADAR_FRAME_RATE:-10}
      - RADAR_SCORE_THRESHOLD=${RADAR_SCORE_THRESHOLD:-}
      - RADAR_MUTE=${RADAR_MUTE:-false}
      - RADAR_DATA_PATH=${RADAR_DATA_PATH:-}
      - RADAR_MODEL_CONFIG=${RADAR_MODEL_CONFIG:-}
      - RADAR_START_INDEX=${RADAR_START_INDEX:-0}
      - RADAR_STOP_INDEX=${RADAR_STOP_INDEX:-}
      - CAM_SENSOR_ID=radar-cam1
      - CAM_DEVICE=${CAM_DEVICE:-CPU}
      - CAM_SCORE_THRESHOLD=${CAM_SCORE_THRESHOLD:-0.5}
      - CAM_MUTE=${CAM_MUTE:-false}
      - CAM_START_INDEX=${CAM_START_INDEX:-010699}
      - CAM_STOP_INDEX=${CAM_STOP_INDEX:-010949}
      - CAM_DATA_PATH=/home/pipeline-server/videos/radar_intersection/images/%06d.jpg
    volumes:
      - ./sample_data/radar_intersection/radar_publisher.py:/home/pipeline-server/user_scripts/radar_publisher.py:ro
      - ./sample_data/radar_intersection/radar_file_playback.py:/home/pipeline-server/user_scripts/radar_file_playback.py:ro
      - ./sample_data/radar_intersection/radar_sensor_contract.py:/home/pipeline-server/user_scripts/radar_sensor_contract.py:ro
      - ./sample_data/radar_intersection/model-proc:/home/pipeline-server/videos/radar_intersection/model-proc:ro
      - vol-sample-data:/home/pipeline-server/videos
      - vol-models:/home/pipeline-server/models
    secrets:
      - source: root-cert
        target: certs/scenescape-ca.pem
    restart: always
    pids_limit: 1000
