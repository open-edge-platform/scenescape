# Radar-intersection fusion demo (opt-in, dedicated target). Run with:
#
#   SUPASS=<password> make demo-radar                          # radarpillars (default)
#   SUPASS=<password> RADAR_PERCEPTION=classical make demo-radar
#   SUPASS=<password> RADAR_PERCEPTION=roadside make demo-radar
#
# RADAR_PERCEPTION (all via g3dinference → gvametaconvert → MQTT):
#   radarpillars — model-type=radarpillars, VoD 7-float pcd_bin (default; persons)
#   classical    — model-type=classical, frames_bin 5-float
#   roadside     — model-type=roadside, OpenVINO PointNetSeg + host instances
#
# Requires: make build-dlsps-g3d (classical/roadside/radarpillars share the plugin).
# See docs/user-guide/how-to-guides/run-radar-intersection-demo.md.

services:
  # The base compose file also starts the retail/queuing sample scenes (an RTSP
  # server, two ffmpeg publishers and two DLStreamer pipeline servers). The radar
  # demo does not use them and they add several GB of RAM, so gate them behind a
  # profile this demo never enables. Opt back in with:
  #   docker compose ... --profile sample-scenes up -d
  # (the same profile also re-enables autocalibration, gated below)
  mediaserver:
    profiles: ["sample-scenes"]
  retail-cams:
    profiles: ["sample-scenes"]
  retail-video:
    profiles: ["sample-scenes"]
  queuing-cams:
    profiles: ["sample-scenes"]
  queuing-video:
    profiles: ["sample-scenes"]
  # Camera/radar poses come from RadarIntersection.json; the demo never uses
  # visual auto-calibration (the NetVLAD/torch image is a large RAM consumer).
  autocalibration-init:
    profiles: ["sample-scenes"]
  autocalibration:
    profiles: ["sample-scenes"]

  radar-scene-init:
    image: python:3.11-slim
    networks:
      scenescape:
    depends_on:
      web:
        condition: service_healthy
    environment:
      - SUPASS=${SUPASS}
      - RADAR_PRUNE_OTHER_SCENES=${RADAR_PRUNE_OTHER_SCENES:-true}
      - HTTPS_PROXY=${HTTPS_PROXY}
      - https_proxy=${https_proxy}
      - NO_PROXY=${NO_PROXY},.scenescape.intel.com
      - no_proxy=${no_proxy},.scenescape.intel.com
    volumes:
      - ./sample_data/radar_intersection/RadarIntersection-scene-import.zip:/scene-import/RadarIntersection-scene-import.zip:ro
      - ./sample_data/radar_intersection/RadarIntersection.json:/scene-import/RadarIntersection.json:ro
      - ./sample_data/radar_intersection/runtime/radar_scene_init.py:/radar_scene_init.py:ro
    entrypoint: ["python3", "/radar_scene_init.py"]
    restart: "no"
    pids_limit: 1000

  # Prefer real VIDETEC-2 frames/pcd_bin when RADAR_RAW_DATASET_DIR is populated
  # (see run-radar-intersection-demo.md). Fall back to synthetic frames for CI
  # hosts without the Zenodo archive. Optional camera JPEGs from V2X-Seq.
  radar-data-init:
    image: python:3.11-slim
    environment:
      - HTTPS_PROXY=${HTTPS_PROXY}
      - https_proxy=${https_proxy}
      - NO_PROXY=${NO_PROXY},.scenescape.intel.com
      - no_proxy=${no_proxy},.scenescape.intel.com
      - JPEG_SRC_DIR=/src/camera
      - JPEG_DST_DIR=/dst/radar_intersection/images
      - JPEG_QUALITY=${JPEG_QUALITY:-50}
      - RADAR_NUM_FRAMES=${RADAR_NUM_FRAMES:-60}
      - RADAR_MAX_FRAMES=${RADAR_MAX_FRAMES:-}
      - RADAR_REQUIRE_REAL=${RADAR_REQUIRE_REAL:-true}
      # Subdir under RADAR_RAW_DATASET_DIR for 7-float bins.
      # Prefer single-frame pcd_bin + RADAR_ACCUMULATE_PAST (causal) over pcd_bin_acc5.
      - RADAR_PCD_SUBDIR=${RADAR_PCD_SUBDIR:-pcd_bin}
      - RADAR2_PCD_SUBDIR=${RADAR2_PCD_SUBDIR:-pcd_bin}
      - CAM_SENSOR_IDS=${CAM_SENSOR_IDS:-radar-cam1,radar-cam-n,radar-cam-w,radar-cam-s}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        pip install --no-cache-dir --quiet numpy pillow h5py
        mkdir -p /dst/radar_intersection/frames /dst/radar_intersection/pcd_bin /dst/radar_intersection/images
        PREPARE_ARGS="-o /dst/radar_intersection -n $${RADAR_NUM_FRAMES}"
        if [ -n "$${RADAR_MAX_FRAMES}" ]; then
          PREPARE_ARGS="$${PREPARE_ARGS} --max-frames $${RADAR_MAX_FRAMES}"
        fi
        if [ "$${RADAR_REQUIRE_REAL}" = "true" ]; then
          PREPARE_ARGS="$${PREPARE_ARGS} --require-real"
        fi
        PCD_SUB="$${RADAR_PCD_SUBDIR:-pcd_bin}"
        # Prefer host-converted frames, then prebuilt pcd bins, then HDF5.
        if [ -d /src/radar/frames ] && ls /src/radar/frames/*.npy >/dev/null 2>&1; then
          PREPARE_ARGS="$${PREPARE_ARGS} --frames-dir /src/radar/frames"
          if [ -d "/src/radar/$${PCD_SUB}" ] && ls "/src/radar/$${PCD_SUB}"/*.bin >/dev/null 2>&1; then
            PREPARE_ARGS="$${PREPARE_ARGS} --pcd-bin-dir /src/radar/$${PCD_SUB}"
          fi
          echo "radar-data-init: using real frames under /src/radar/frames (pcd=$${PCD_SUB})"
        elif [ -d "/src/radar/$${PCD_SUB}" ] && ls "/src/radar/$${PCD_SUB}"/*.bin >/dev/null 2>&1; then
          PREPARE_ARGS="$${PREPARE_ARGS} --pcd-bin-dir /src/radar/$${PCD_SUB}"
          echo "radar-data-init: using real pcd under /src/radar/$${PCD_SUB}"
        elif ls /src/radar/*.h5 >/dev/null 2>&1 || ls /src/radar/*.hdf5 >/dev/null 2>&1; then
          HDF5=$$(ls /src/radar/*.h5 /src/radar/*.hdf5 2>/dev/null | head -1)
          PREPARE_ARGS="$${PREPARE_ARGS} --hdf5 $${HDF5}"
          echo "radar-data-init: converting HDF5 $${HDF5}"
        else
          echo "radar-data-init: no real VIDETEC under /src/radar — synthetic fallback"
        fi
        PYTHONPATH=/prepare python3 /prepare/prepare_radar_demo_data.py $${PREPARE_ARGS}
        # Second radar (dataset 52): stage frames_bin (classical/roadside) and
        # pcd bins (radarpillars). Publisher picks the subdir from RADAR_PERCEPTION.
        R2_STAGED=0
        if [ -d /src/radar2/frames_bin ] && ls /src/radar2/frames_bin/*.bin >/dev/null 2>&1; then
          mkdir -p /dst/radar_intersection/radar2/frames_bin
          rm -f /dst/radar_intersection/radar2/frames_bin/*.bin
          cp /src/radar2/frames_bin/*.bin /dst/radar_intersection/radar2/frames_bin/
          echo "radar-data-init: staged $$(ls /dst/radar_intersection/radar2/frames_bin/*.bin | wc -l) radar2 frames_bin"
          R2_STAGED=1
        fi
        R2_SUB="$${RADAR2_PCD_SUBDIR:-pcd_bin}"
        if [ -d "/src/radar2/$${R2_SUB}" ] && ls "/src/radar2/$${R2_SUB}"/*.bin >/dev/null 2>&1; then
          mkdir -p /dst/radar_intersection/radar2/pcd_bin
          rm -f /dst/radar_intersection/radar2/pcd_bin/*.bin
          cp "/src/radar2/$${R2_SUB}"/*.bin /dst/radar_intersection/radar2/pcd_bin/
          echo "radar-data-init: staged $$(ls /dst/radar_intersection/radar2/pcd_bin/*.bin | wc -l) radar2 pcd_bin from $${R2_SUB}"
          R2_STAGED=1
        elif [ -d /src/radar2/pcd_bin ] && ls /src/radar2/pcd_bin/*.bin >/dev/null 2>&1; then
          mkdir -p /dst/radar_intersection/radar2/pcd_bin
          rm -f /dst/radar_intersection/radar2/pcd_bin/*.bin
          cp /src/radar2/pcd_bin/*.bin /dst/radar_intersection/radar2/pcd_bin/
          echo "radar-data-init: staged $$(ls /dst/radar_intersection/radar2/pcd_bin/*.bin | wc -l) radar2 pcd_bin"
          R2_STAGED=1
        fi
        if [ "$${R2_STAGED}" = "0" ]; then
          echo "radar-data-init: no radar2 bins under /src/radar2 — second radar muted unless provided"
        fi
        # Stage per-camera JPEG dirs (+ optional fused MPEG-TS clips) for GST.
        python3 - <<'PY'
        import os, shutil
        from pathlib import Path
        src_root = Path("/src/camera")
        dst_root = Path("/dst/radar_intersection/images")
        ids = [s.strip() for s in os.environ.get("CAM_SENSOR_IDS", "radar-cam1").split(",") if s.strip()]
        dst_root.mkdir(parents=True, exist_ok=True)
        staged = 0
        for sid in ids:
          src = src_root / sid
          # Legacy single-cam layout
          if not src.is_dir() and sid == "radar-cam1":
            legacy = src_root / "infrastructure-side" / "image"
            if legacy.is_dir():
              src = legacy
          if not src.is_dir() or not any(src.glob("*.jpg")):
            print(f"radar-data-init: no JPEGs for {sid} under {src}")
            continue
          dst = dst_root / sid
          if dst.exists():
            shutil.rmtree(dst)
          shutil.copytree(src, dst, symlinks=False)
          n = sum(1 for _ in dst.glob("*.jpg"))
          n_ts = sum(1 for _ in dst.glob("*.ts"))
          print(f"radar-data-init: staged {n} JPEGs + {n_ts} clips → {dst}")
          staged += 1
        if staged == 0:
          print("radar-data-init: no camera JPEGs — set RADAR_CAM_DATASET_DIR / prepare-radar-camera")
        PY
        echo 'radar_intersection data ready'
    volumes:
      - ${RADAR_RAW_DATASET_DIR:-./sample_data/radar_intersection/VIDETEC-2/converted}:/src/radar:ro
      - ${RADAR2_RAW_DATASET_DIR:-./sample_data/radar_intersection/VIDETEC-2/converted_r52}:/src/radar2:ro
      # Default: gitignored VIDETEC camera_demo/ (make prepare-radar-camera).
      - ${RADAR_CAM_DATASET_DIR:-./sample_data/radar_intersection/camera_demo}:/src/camera:ro
      - ./sample_data/radar_intersection/prepare:/prepare:ro
      - ./radar/videtec_hdf5_to_frames.py:/videtec_hdf5_to_frames.py:ro
      - ./sample_data/lidar_intersection/reencode_jpegs.py:/reencode_jpegs.py:ro
      - vol-sample-data:/dst
    restart: "no"
    pids_limit: 1000

  radar-model-init:
    image: docker.io/intel/dlstreamer-pipeline-server:2026.2.0-ubuntu24-rc2
    user: root
    entrypoint: ["/bin/bash", "/model_installer/install-radar-perception"]
    environment:
      - MODELS_PATH=/home/pipeline-server/models
      - RADAR_PERCEPTION=${RADAR_PERCEPTION:-radarpillars}
      - RADAR_IR_DIR=${RADAR_IR_DIR:-}
      - HTTPS_PROXY=${HTTPS_PROXY}
      - https_proxy=${https_proxy}
      - NO_PROXY=${NO_PROXY},.scenescape.intel.com
      - no_proxy=${no_proxy},.scenescape.intel.com
      - HTTP_PROXY=${HTTP_PROXY}
      - http_proxy=${http_proxy}
    volumes:
      - ./sample_data/radar_intersection/model_installer:/model_installer
      - vol-models:/home/pipeline-server/models
    restart: "no"
    pids_limit: 1000

  radar-stream:
    image: ${DLS_G3D_IMAGE:-intel/dlstreamer-pipeline-server:2026.2.0-ubuntu24-rc2-g3d}
    networks:
      scenescape:
    tty: true
    entrypoint:
      ["python3", "/home/pipeline-server/user_scripts/radar_publisher.py"]
    # Optional GPU for radarpillars / roadside (RADAR_DEVICE=GPU). Requires
    # host /dev/dri + Intel GPU driver. Safe no-op when dri nodes are absent
    # if compose still starts; set RADAR_DEVICE=CPU on CPU-only hosts.
    devices:
      - "/dev/dri:/dev/dri"
    group_add:
      - "992"
    device_cgroup_rules:
      - "c 226:* rmw"
    depends_on:
      broker:
        condition: service_started
      ntpserv:
        condition: service_started
      radar-scene-init:
        condition: service_completed_successfully
      radar-data-init:
        condition: service_completed_successfully
      radar-model-init:
        condition: service_completed_successfully
    environment:
      - MQTT_HOST=broker.scenescape.intel.com
      - MQTT_PORT=1883
      - RADAR_PERCEPTION=${RADAR_PERCEPTION:-radarpillars}
      - RADAR_SENSOR_ID=intersection-radar1
      - RADAR_SENSOR_IDS=${RADAR_SENSOR_IDS:-intersection-radar1}
      - RADAR_DEVICE=${RADAR_DEVICE:-CPU}
      - RADAR_FRAME_RATE=${RADAR_FRAME_RATE:-10}
      - RADAR_SCORE_THRESHOLD=${RADAR_SCORE_THRESHOLD:-}
      - RADAR_ACCUMULATE_PAST=${RADAR_ACCUMULATE_PAST:-0}
      - RADAR_MUTE=${RADAR_MUTE:-false}
      - RADAR_DATA_PATH=${RADAR_DATA_PATH:-}
      # Empty → radar_publisher mode defaults (frames_bin for classical/roadside,
      # pcd_bin for radarpillars). Optional radar2/<subdir> if a second id is set.
      - RADAR_DATA_PATHS=${RADAR_DATA_PATHS:-}
      - RADAR_INDEX_RANGES=${RADAR_INDEX_RANGES:-intersection-radar1:3270-4100}
      - RADAR_MODEL_CONFIG=${RADAR_MODEL_CONFIG:-}
      - RADAR_START_INDEX=${RADAR_START_INDEX:-3270}
      - RADAR_STOP_INDEX=${RADAR_STOP_INDEX:-4100}
      - CAM_SENSOR_IDS=${CAM_SENSOR_IDS:-radar-cam1,radar-cam-n,radar-cam-w,radar-cam-s}
      - CAM_DATA_ROOT=/home/pipeline-server/videos/radar_intersection/images
      - CAM_DEVICE=${CAM_DEVICE:-GPU}
      - CAM_SCORE_THRESHOLD=${CAM_SCORE_THRESHOLD:-0.6}
      - CAM_DETECTION_LABELS=${CAM_DETECTION_LABELS:-person,vehicle,cyclist}
      - CAM_MUTE=${CAM_MUTE:-false}
      - CAM_START_INDEX=${CAM_START_INDEX:-3270}
      - CAM_STOP_INDEX=${CAM_STOP_INDEX:-4100}
      - CAM_MODEL=${CAM_MODEL:-/home/pipeline-server/models/omz/person-vehicle-bike-detection-crossroad-1016/FP32/person-vehicle-bike-detection-crossroad-1016.xml}
      - CAM_MODEL_PROC=${CAM_MODEL_PROC:-/home/pipeline-server/videos/radar_intersection/model-proc/person-vehicle-bike-detection-crossroad-1016.json}
      - CAM_NTP_SERVER=${CAM_NTP_SERVER:-ntpserv}
      - ADDITIONAL_GST_PLUGIN_PATH=/home/sscape
      - ROOT_CA=/run/secrets/certs/scenescape-ca.pem
      - OMP_NUM_THREADS=${OMP_NUM_THREADS:-2}
      - OPENBLAS_NUM_THREADS=${OPENBLAS_NUM_THREADS:-2}
    volumes:
      - ./sample_data/radar_intersection/runtime/radar_publisher.py:/home/pipeline-server/user_scripts/radar_publisher.py:ro
      - ./sample_data/radar_intersection/runtime/radar_file_playback.py:/home/pipeline-server/user_scripts/radar_file_playback.py:ro
      - ./sample_data/radar_intersection/runtime/radar_sensor_contract.py:/home/pipeline-server/user_scripts/radar_sensor_contract.py:ro
      - ./sample_data/radar_intersection/model-proc:/home/pipeline-server/videos/radar_intersection/model-proc:ro
      # Established SceneScape camera plugins (same mount as retail/queuing).
      - ./dlstreamer-pipeline-server/user_scripts/gstplugins:/home/sscape/python:ro
      - vol-sample-data:/home/pipeline-server/videos
      - vol-models:/home/pipeline-server/models
    secrets:
      - source: root-cert
        target: certs/scenescape-ca.pem
    restart: always
    pids_limit: 1000
