# Self-contained video source for the simulated-drone external-source demo:
# an ffmpeg looper publishes the Queuing qcam1 recording over RTSP, and DL
# Streamer Pipeline Server consumes it through the drone motion simulation and
# publishes person detections on the drone platform topic (see README.md).
# Run alongside the main Scenescape stack (same COMPOSE_PROJECT_NAME so the
# "scenescape" Docker network and vol-models volume are shared):
#   docker compose --project-directory . -f sample_data/drone_sim/compose.drone-video.yml up -d
#
# Combine with Queuing/compose.queuing-video.yml (add another -f) to run the
# fixed-camera Queuing scene at the same time; Compose merges the two
# same-named "mediaserver" services into one shared instance.
#
# The Scene Controller only ingests the published messages when the binding
# environment variables are set (see "Set up the demo" in README.md):
#   CONTROLLER_EXTERNAL_SOURCE_BINDINGS=sim-drone-qcam1:<scene-uid>
#   CONTROLLER_TRUSTED_POSITIONING_SOURCES=sim-drone-qcam1

name: scenescape

networks:
  scenescape:
    external: true
    name: ${SCENESCAPE_NETWORK:-scenescape_scenescape}

secrets:
  root-cert:
    file: ${SECRETSDIR}/certs/scenescape-ca.pem

configs:
  drone-video-config:
    file: ./sample_data/drone_sim/drone-video-config.json

services:
  mediaserver:
    image: bluenviron/mediamtx:1.21.1
    networks:
      scenescape:
        aliases:
          - mediaserver
    ports:
      - "${VIDEOSOURCE_PORT:-8554}:8554"
    restart: always
    pids_limit: 1000

  drone-cam:
    image: linuxserver/ffmpeg:version-9.0-cli
    command: -nostdin -re -stream_loop -1 -i /workspace/media/qcam1.ts -map 0:v -c copy -f rtsp -rtsp_transport tcp rtsp://mediaserver:8554/drone-cam1
    volumes:
      - ./sample_data/videos:/workspace/media:ro
    networks:
      scenescape:
    depends_on:
      - mediaserver
    restart: always
    pids_limit: 1000

  drone-video:
    image: docker.io/intel/dlstreamer-pipeline-server:2026.3.0-20261020-weekly-ubuntu24
    networks:
      scenescape:
    tty: true
    entrypoint: ["./run.sh"]
    group_add:
      - "109"
      - "110"
      - "992"
    device_cgroup_rules:
      - "c 189:* rmw"
      - "c 209:* rmw"
      - "a 189:* rwm"
    depends_on:
      drone-cam:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-I", "-s", "http://localhost:8080/pipelines"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      - RUN_MODE=EVA
      - GENICAM=Balluff
      - GST_DEBUG=1,gencamsrc:2
      - ADDITIONAL_GST_PLUGIN_PATH=/home/dronesim
      - ADD_UTCTIME_TO_METADATA=true
      - APPEND_PIPELINE_NAME_TO_PUBLISHER_TOPIC=false
      - MQTT_HOST=broker.scenescape.intel.com
      - MQTT_PORT=1883
      - REST_SERVER_PORT=8080
      - HTTPS_PROXY=${HTTPS_PROXY}
      - https_proxy=${https_proxy}
      - HTTP_PROXY=${HTTP_PROXY}
      - http_proxy=${http_proxy}
      - NO_PROXY=mediaserver,broker.scenescape.intel.com,${NO_PROXY}
      - no_proxy=mediaserver,broker.scenescape.intel.com,${no_proxy}
    configs:
      - source: drone-video-config
        target: /home/pipeline-server/config.json
    volumes:
      - ./sample_data/drone_sim:/home/dronesim:ro
      - vol-dlstreamer-pipeline-server-pipeline-root-drone:/var/cache/pipeline_root:uid=1999,gid=1999
      - vol-models:/home/pipeline-server/models
    secrets:
      - source: root-cert
        target: certs/scenescape-ca.pem
    restart: always
    pids_limit: 1000

volumes:
  vol-models:
  vol-dlstreamer-pipeline-server-pipeline-root-drone:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
