# LiDAR-intersection fusion demo (opt-in). Enable with `LIDAR_DEMO=true`, e.g.:
#
#   SUPASS=<password> make demo LIDAR_DEMO=true
#
# Adds a recorded LiDAR (PointPillars) + camera image-sequence pipeline for
# the "Lidar Intersection" sample scene. All assets live under
# sample_data/lidar_intersection/ so they are fully separate from the
# default apriltag/queuing demo data. The scene, camera, and sensor are
# seeded automatically (idempotent - see lidar-scene-init below); see
# docs/user-guide/how-to-guides/run-lidar-intersection-demo.md for the full
# step-by-step guide.

services:
  # One-shot: seeds the "Lidar Intersection" scene, camera, and sensor via
  # Scenescape's existing Scene Import REST API (POST /api/v1/import-scene/)
  # so no Manager source or DB-fixture changes are needed. Skips the import
  # if a scene with this name already exists (e.g. on a restart without a
  # volume reset), so it's safe to run on every `make demo LIDAR_DEMO=true`.
  lidar-scene-init:
    image: alpine:3.23
    networks:
      scenescape:
    depends_on:
      web:
        condition: service_healthy
    environment:
      - SUPASS=${SUPASS}
      - HTTPS_PROXY=${HTTPS_PROXY}
      - https_proxy=${https_proxy}
      - NO_PROXY=${NO_PROXY},.scenescape.intel.com
      - no_proxy=${no_proxy},.scenescape.intel.com
    volumes:
      - ./sample_data/lidar_intersection/LidarIntersection-scene-import.zip:/scene-import/LidarIntersection-scene-import.zip:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        apk add --no-cache curl >/dev/null
        TOKEN=$$(curl -sk -X POST -d "username=admin&password=${SUPASS}" https://web.scenescape.intel.com/api/v1/auth \
          | sed -n 's/.*"token"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
        if [ -z "$$TOKEN" ]; then
          echo "lidar-scene-init: failed to authenticate to the Scenescape API"
          exit 1
        fi
        if curl -sk -H "Authorization: Token $$TOKEN" https://web.scenescape.intel.com/api/v1/scenes \
          | grep -Eq '"name"[[:space:]]*:[[:space:]]*"Lidar Intersection"'; then
          echo "lidar-scene-init: 'Lidar Intersection' scene already exists, skipping import"
          exit 0
        fi
        echo "lidar-scene-init: importing 'Lidar Intersection' scene..."
        curl -sk -X POST -H "Authorization: Token $$TOKEN" \
          -F "zipFile=@/scene-import/LidarIntersection-scene-import.zip" \
          https://web.scenescape.intel.com/api/v1/import-scene/
        echo "lidar-scene-init: done"
    restart: "no"
    pids_limit: 1000

  # Converts the manually-downloaded raw DAIR-V2X-Seq (V2X-Seq-SPD) dataset
  # (see the "Prerequisites" section of
  # docs/user-guide/how-to-guides/run-lidar-intersection-demo.md - too large
  # to commit to the repo, so it's NOT bind-mounted from anything checked
  # into git) into the shared sample-data volume: LiDAR `velodyne/*.pcd`
  # frames are converted to `velodyne_bin/*.bin` via convert_pcd_to_bin.py
  # (the format DLStreamer's g3dlidarparse expects), and camera `image/*.jpg`
  # frames are copied through unchanged (no conversion needed). Only the
  # `image/`/`velodyne/` subdirectories are mounted (not the full
  # `infrastructure-side/` tree) - `calib/`/`label/`/`data_info.json` aren't
  # needed by this demo.
  lidar-data-init:
    image: python:3.11-slim
    environment:
      - HTTPS_PROXY=${HTTPS_PROXY}
      - https_proxy=${https_proxy}
      - PCD_VELODYNE_DIR=/src/velodyne
      - PCD_BIN_DIR=/dst/lidar_intersection/velodyne_bin
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        pip install --no-cache-dir --quiet numpy pypcd4
        mkdir -p /dst/lidar_intersection/velodyne_bin /dst/lidar_intersection/images
        python3 /convert_pcd_to_bin.py
        cp /src/image/*.jpg /dst/lidar_intersection/images/
        echo 'lidar_intersection data ready'
    volumes:
      - ${LIDAR_RAW_DATASET_DIR:-./sample_data/lidar_intersection/V2X-Seq-SPD-Example}/infrastructure-side/image:/src/image:ro
      - ${LIDAR_RAW_DATASET_DIR:-./sample_data/lidar_intersection/V2X-Seq-SPD-Example}/infrastructure-side/velodyne:/src/velodyne:ro
      - ./sample_data/lidar_intersection/convert_pcd_to_bin.py:/convert_pcd_to_bin.py:ro
      - vol-sample-data:/dst
    restart: "no"
    pids_limit: 1000

  # One-shot: builds/installs the PointPillars OpenVINO model + GStreamer
  # inference extension into the shared models volume. Not part of the
  # generic model_download flow since PointPillars is built from source
  # (openvino_contrib), not downloaded from OMZ.
  lidar-model-init:
    image: docker.io/intel/dlstreamer-pipeline-server:2026.2.0-ubuntu24-rc2
    user: root
    entrypoint: ["/bin/bash", "/model_installer/install-pointpillars"]
    environment:
      - MODELS_PATH=/home/pipeline-server/models
      - POINTPILLARS_ROOT=${POINTPILLARS_ROOT:-}
      - OPENVINO_CONTRIB_DIR=${OPENVINO_CONTRIB_DIR:-}
      - HTTPS_PROXY=${HTTPS_PROXY}
      - https_proxy=${https_proxy}
    volumes:
      - ./sample_data/lidar_intersection/model_installer:/model_installer
      - vol-models:/home/pipeline-server/models
    restart: "no"
    pids_limit: 1000

  lidar-stream:
    image: docker.io/intel/dlstreamer-pipeline-server:2026.2.0-ubuntu24-rc2
    networks:
      scenescape:
    tty: true
    entrypoint:
      ["python3", "/home/pipeline-server/user_scripts/lidar_publisher.py"]
    # GPU acceleration for the LiDAR (PointPillars) branch (default) — requires
    # /dev/dri on the host and GPU drivers installed (see the note on
    # LIDAR_DEVICE below). Comment these out (and set LIDAR_DEVICE=CPU) to
    # run the LiDAR branch on CPU too; the camera branch defaults to CPU
    # already and doesn't need this.
    devices:
      - "/dev/dri:/dev/dri"
    group_add:
      - "992"
    device_cgroup_rules:
      - "c 226:* rmw"
    depends_on:
      broker:
        condition: service_started
      ntpserv:
        condition: service_started
      lidar-data-init:
        condition: service_completed_successfully
      lidar-model-init:
        condition: service_completed_successfully
    environment:
      - MQTT_HOST=broker.scenescape.intel.com
      - MQTT_PORT=1883
      # LiDAR branch — override as needed:
      # - LIDAR_SENSOR_ID=intersection-lidar1
      # - LIDAR_DATA_PATH=/home/pipeline-server/videos/lidar_intersection/velodyne_bin/%06d.bin
      # - LIDAR_START_INDEX=010699
      # - LIDAR_STOP_INDEX=010949
      # - LIDAR_LOOP=true
      # - LIDAR_FRAME_RATE=10
      # GPU is the default (see note above); CPU works but is noticeably
      # slower for PointPillars inference — set to CPU only as a fallback
      # when no GPU/drivers are available.
      - LIDAR_DEVICE=GPU
      - LIDAR_SCORE_THRESHOLD=0.70
      # - LIDAR_MODEL_CONFIG=/home/pipeline-server/models/public/pointpillars/FP16/pointpillars_ov_config.json
      - LIDAR_PUBLISH_RAW=false
      # Camera branch — override as needed:
      # - CAM_SENSOR_ID=intersection-cam1
      # - CAM_DATA_PATH=/home/pipeline-server/videos/lidar_intersection/images/%06d.jpg
      # - CAM_START_INDEX=010699
      # - CAM_STOP_INDEX=010949
      - CAM_DEVICE=CPU
      - CAM_SCORE_THRESHOLD=0.8
      # - CAM_DETECTION_LABELS=vehicle,cyclist
    volumes:
      - ./sample_data/lidar_intersection/lidar_publisher.py:/home/pipeline-server/user_scripts/lidar_publisher.py:ro
      - ./sample_data/lidar_intersection/model-proc:/home/pipeline-server/videos/lidar_intersection/model-proc:ro
      - vol-sample-data:/home/pipeline-server/videos
      - vol-models:/home/pipeline-server/models
    secrets:
      - source: root-cert
        target: certs/scenescape-ca.pem
    restart: always
    pids_limit: 1000
