logLevel: info
api: yes

# RTSP
rtsp: yes

# WebRTC
webrtc: yes
webrtcAddress: :8889
webrtcTrackGatherTimeout: 2s
webrtcLocalTCPAddress: :8189
webrtcICEServers2:
  - url: turn:coturn.scenescape.intel.com:3478
    username: user
    password: password
    clientOnly: true
webrtcAdditionalHosts:
  - mediamtx.scenescape.intel.com
  - mediamtx-proxy.scenescape.intel.com

paths:
  all_others:

# Turn off other protocols
rtmp: no
srt: no
hls: no
