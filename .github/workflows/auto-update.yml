name: "[CI/CD] Update All Pull Requests"
run-name: "[CI/CD] Update All Pull Requests"

on:
  workflow_call: {}
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  update-pull-requests:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: "Update pull requests"
        uses: open-edge-platform/orch-ci/.github/actions/pr_updater@af6d3ab68ed04ec1b3111392ec0844e8e1ac83a5
        with:
          github_token: ${{ secrets.GH_PAT }}
