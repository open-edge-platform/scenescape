name: "[CI/CD] Update All Pull Requests"
run-name: "[CI/CD] Update All Pull Requests"

on:
  workflow_call:
    secrets:
      GH_PAT:
        required: true
  workflow_dispatch: {}

concurrency:
  # Hardcoded prefix so this group is stable when called via workflow_call
  # (github.workflow evaluates to the caller's workflow name in reusable workflows).
  group: auto-update-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  update-pull-requests:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: "Update pull requests targeting ${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          BASE_BRANCH: ${{ github.ref_name }}
        run: |
          echo "Searching for open PRs targeting '${BASE_BRANCH}' with auto-merge enabled"

          # Scope strictly to PRs whose base is the branch that triggered this run,
          # so a push to one branch never force-updates PRs targeting another branch.
          if ! prs_output=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --base "$BASE_BRANCH" \
            --state open \
            --json number,author,autoMergeRequest \
            --jq '.[] | select(.author.login != "dependabot" and .autoMergeRequest != null) | .number'); then
            echo "ERROR: gh pr list failed — check API access and token permissions."
            exit 1
          fi

          mapfile -t prs <<< "$prs_output"
          if [[ ${#prs[@]} -eq 1 && -z "${prs[0]}" ]]; then
            prs=()
          fi

          if [[ ${#prs[@]} -eq 0 ]]; then
            echo "No open PRs with auto-merge enabled targeting '${BASE_BRANCH}' — nothing to do."
            exit 0
          fi

          for pr in "${prs[@]}"; do
            echo "Updating PR #${pr}"
            gh pr update-branch "$pr" --repo "$GITHUB_REPOSITORY" || echo "Failed to update PR #${pr}"
          done
