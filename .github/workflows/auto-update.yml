name: "[CI/CD] Auto-Update Pull Requests"
run-name: "[CI/CD] Auto-Update PRs based on ${{ github.ref_name }}"

on: # yamllint disable-line rule:truthy
  workflow_call:
    secrets:
      GH_PAT:
        required: true

concurrency:
  # Hardcoded prefix so this group is stable when called via workflow_call
  # (github.workflow evaluates to the caller's workflow name in reusable workflows).
  group: auto-update-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  update-pull-requests:
    name: "Update pull requests targeting this branch"
    if: github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: "Find and update pull requests"
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          BASE_BRANCH: ${{ github.ref_name }}
        run: |
          echo "Searching for open, ready-for-review PRs targeting '${BASE_BRANCH}' with auto-merge enabled"

          # Scope strictly to PRs whose base is the branch that triggered this run,
          # so a push to one branch never force-updates PRs targeting another branch.
          # Drafts can't have auto-merge enabled, so exclude them up front.
          if ! pr_list_output=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --base "$BASE_BRANCH" \
            --state open \
            --draft=false \
            --json number,author,autoMergeRequest,headRefName,title \
            --jq '.[] | select(.author.login != "dependabot[bot]") |
                select(.autoMergeRequest != null) |
                @json'); then
            echo "ERROR: gh pr list failed — check API access and token permissions."
            exit 1
          fi

          mapfile -t prs <<< "$pr_list_output"
          # When output is empty, mapfile produces one empty element — normalize it.
          if [[ ${#prs[@]} -eq 1 && -z "${prs[0]}" ]]; then
            prs=()
          fi

          if [[ ${#prs[@]} -eq 0 ]]; then
            echo "No open PRs with auto-merge enabled targeting '${BASE_BRANCH}' — nothing to do."
            exit 0
          fi

          echo "Found ${#prs[@]} candidate PR(s)."

          failed=0
          for pr_json in "${prs[@]}"; do
            pr_number=$(echo "$pr_json" | jq -r '.number')
            head_ref=$(echo  "$pr_json" | jq -r '.headRefName')
            title=$(echo     "$pr_json" | jq -r '.title')

            echo "→ PR #${pr_number}: '${title}' (head: ${head_ref})"

            if gh pr update-branch "$pr_number" --repo "$GITHUB_REPOSITORY"; then
              echo "  ✓ PR #${pr_number} updated successfully."
            else
              echo "  ✗ PR #${pr_number} could not be updated (may already be up to date or have a merge conflict)."
              failed=$((failed + 1))
            fi
          done

          echo "Done. Failed: ${failed}."
          if [[ $failed -gt 0 ]]; then
            echo "Warning: ${failed} PR(s) could not be updated — review the logs above."
          fi
