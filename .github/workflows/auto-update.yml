name: "[CI/CD] Update All Pull Requests"
run-name: "[CI/CD] Update All Pull Requests"

on:
  workflow_call:
    secrets:
      GH_PAT:
        required: true
  workflow_dispatch: {}

concurrency:
  # Hardcoded prefix so this group is stable when called via workflow_call
  # (github.workflow evaluates to the caller's workflow name in reusable workflows).
  group: auto-update-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  update-pull-requests:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Update pull requests"
        uses: open-edge-platform/orch-ci/.github/actions/pr_updater@99256d03ab0676a340065ca4203144008bb5587e
        with:
          github_token: ${{ secrets.GH_PAT }}
