name: "[Code Analysis] ClamAV Antivirus Scan"
run-name: "[Code Analysis] ClamAV Antivirus Scan"

on:
  workflow_call: {}
  workflow_dispatch: {}

# Only run at most 1 workflow concurrently per PR or per branch to keep costs down.
# Hardcoded prefix so this group is stable when called via workflow_call
# (github.workflow evaluates to the caller's workflow name in reusable workflows).
concurrency:
  group: clamav-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # needed for actions/checkout

jobs:
  clamav-antivirus-scan:
    name: "Run ClamAV Antivirus Scan"
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run ClamAV Scan
        uses: open-edge-platform/orch-ci/.github/actions/clamav@99256d03ab0676a340065ca4203144008bb5587e
        with:
          report-path: clamav_scan_report.txt
          project-folder: .
      - name: Upload ClamAV Scan Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.CLAMAV_ARTIFACT_NAME }}
          path: ${{ env.SANITIZED_CLAMAV_REPORT_PATH }}
