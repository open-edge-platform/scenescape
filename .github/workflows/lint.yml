name: "Lint code"

on:  # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - main
      - release-*
  workflow_dispatch:

permissions:
  contents: read          # needed for actions/checkout

jobs:
  filter:
   name: "Lint code"
   runs-on: ubuntu-latest
   steps:
    - name: Checkout code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      with:
        persist-credentials: false
    - name: Setup environment
      uses: open-edge-platform/orch-ci/.github/actions/bootstrap@d475e84f8b0b7bff118f0e8f56712390ef8d2828   # 0.1.26
      with:
        bootstrap_tools: "base,python,shellcheck,hadolint,"
    - name: Install pylint
      run: |
        pip install pylint[spelling]==3.3.7
    - name: Run python linter - pylint
      run: |
        make lint-python
    - name: Run shell linter - shellcheck
      run: |
        make lint-shell
