name: "[Build] Build Images And Publish To DockerHub"
run-name: "[Build] Build Images And Publish To DockerHub"

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish images to DockerHub"
        required: true
        default: false
        type: boolean
permissions: {}

jobs:
  build:
    name: "Build, Tag and Push Images"
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.determine-tag.outputs.image_tag }}
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        images:
          [
            scenescape-autocalibration,
            scenescape-controller,
            scenescape-manager,
            scenescape-tracker,
            scenescape-sources,
          ]
    steps:
      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: "Checkout code"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: "Build image scene_common"
        run: |
          if [[ "${{ matrix.images }}" != "scenescape-sources" && "${{ matrix.images }}" != "scenescape-tracker" ]]; then
            echo "Building scene_common"
            make -C scene_common
          fi

      - name: "Build image ${{ matrix.images }}"
        run: |
          if [[ "${{ matrix.images }}" == "scenescape-autocalibration" ]]; then
            echo "Building ${{ matrix.images }}"
            make -C autocalibration
          elif [[ "${{ matrix.images }}" == "scenescape-controller" ]]; then
            echo "Building ${{ matrix.images }}"
            make -C controller
          elif [[ "${{ matrix.images }}" == "scenescape-manager" ]]; then
            echo "Building ${{ matrix.images }}"
            make -C manager
          elif [[ "${{ matrix.images }}" == "scenescape-tracker" ]]; then
            echo "Building ${{ matrix.images }}"
            make -C tracker
          elif [[ "${{ matrix.images }}" == "scenescape-sources" ]]; then
            echo "Building ${{ matrix.images }}"
            make build-sources-image
          else
            echo "ERROR: Unexpected matrix.images value: '${{ matrix.images }}'"
            exit 1
          fi

      - name: "Determine Image Tag"
        id: determine-tag
        run: |
          if [ ! -f version.txt ]; then
            echo "version.txt not found."
            exit 1
          fi
          if grep -q "dev" version.txt; then
            echo "ERROR: version.txt contains 'dev' - publishing dev versions is not allowed."
            exit 1
          fi
          version=$(tr -d ' \n' < version.txt)
          echo "image_tag=$version" >> $GITHUB_OUTPUT
          # Mark as release (not RC) so the latest tag is also pushed
          if grep -q "rc" version.txt; then
            echo "is_release=false" >> $GITHUB_OUTPUT
          else
            echo "is_release=true" >> $GITHUB_OUTPUT
          fi

      - name: "Tag images"
        run: |
          docker tag ${{ matrix.images }}:${{ steps.determine-tag.outputs.image_tag }} intel/${{ matrix.images }}:${{ steps.determine-tag.outputs.image_tag }}
          echo "Tagged ${{ matrix.images }}:${{ steps.determine-tag.outputs.image_tag }} as intel/${{ matrix.images }}:${{ steps.determine-tag.outputs.image_tag }}"
          if [[ "${{ steps.determine-tag.outputs.is_release }}" == "true" ]]; then
            docker tag ${{ matrix.images }}:latest intel/${{ matrix.images }}:latest
            echo "Tagged ${{ matrix.images }}:latest as intel/${{ matrix.images }}:latest"
          fi

      - name: "Log in to DockerHub"
        if: ${{ github.event.inputs.publish == 'true' }}
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          username: scenescape
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: "Push images"
        if: ${{ github.event.inputs.publish == 'true' }}
        run: |
          docker push intel/${{ matrix.images }}:${{ steps.determine-tag.outputs.image_tag }}
          if [[ "${{ steps.determine-tag.outputs.is_release }}" == "true" ]]; then
            docker push intel/${{ matrix.images }}:latest
          fi

      - name: Install skopeo
        if: ${{ github.event.inputs.publish == 'true' }}
        run: sudo apt update && sudo apt install -y skopeo jq

      - name: "Get image digest"
        id: digest
        if: ${{ github.event.inputs.publish == 'true' }}
        env:
          IMAGE: intel/${{ matrix.images }}:${{ steps.determine-tag.outputs.image_tag }}
        run: |
          DIGEST=$(skopeo inspect docker://$IMAGE | jq -r '.Digest')
          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT

      - name: "Install Cosign"
        if: ${{ github.event.inputs.publish == 'true' }}
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1

      - name: "Sign Docker images using Cosign (keyless)"
        if: ${{ github.event.inputs.publish == 'true' }}
        run: |
          cosign sign --yes intel/${{ matrix.images }}@${{ steps.digest.outputs.digest }}
          echo "Signed intel/${{ matrix.images }}@${{ steps.digest.outputs.digest }}"

      - name: "Save ${{ matrix.images }} image info"
        id: save-image-info
        if: ${{ github.event.inputs.publish == 'true' }}
        run: |
          echo "image_name=intel/${{ matrix.images }}:${{ steps.determine-tag.outputs.image_tag }}" >> "$GITHUB_OUTPUT"
          echo "image_name=intel/${{ matrix.images }}:${{ steps.determine-tag.outputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "image_digest=${{ steps.digest.outputs.digest }}" >> "$GITHUB_OUTPUT"
          echo "image_digest=${{ steps.digest.outputs.digest }}" >> $GITHUB_STEP_SUMMARY

      - name: Clean up
        if: always()
        run: |
          docker system prune -a --volumes -f || true
