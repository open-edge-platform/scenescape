name: Pre-Merge Migration Tests Checking
on:
  # Allow manually triggering the workflow
  workflow_dispatch:
    inputs:
      run_type:
        description: 'Specify the type of run'
        required: true
        default: 'manual'
  schedule:
    # DAILY
    - cron: '55 15 * * *'

    # WEEKLY
    - cron: '00 16 * * *'

  # Trigger workflow when enqueued to a merge group
  merge_group:

# Only run at most 1 workflow concurrently per PR, unlimited for branches
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup environment
        shell: bash
        env:
          RUN_TYPE: ${{ github.event.inputs.run_type || '' }}
        run: |
          chmod +x .github/scripts/check_and_set-build-type.sh
          .github/scripts/check_and_set-build-type.sh
      # This job uses reusable scripts for Jenkinsfile linting and artifactory ops
      # Will be replaced by Github actions equivalents
      # - name: Checkout AutoLM scripts
      #   shell: bash
      #   run: |
      #     .github/scripts/checkout-autolm-scripts.sh
