name: "[Updates] Validate Renovate configuration"

on:
  workflow_call: {}

permissions: {} # No permissions by default

# Hardcoded prefix so this group is stable when called via workflow_call
# (github.workflow evaluates to the caller's workflow name in reusable workflows).
concurrency:
  group: renovate-config-validator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: "Checkout configuration"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: "Validate configuration"
        run: |
          # renovate: datasource=docker
          export RENOVATE_IMAGE=renovate/renovate:43.24
          docker run --rm --entrypoint "renovate-config-validator" \
          -v "${{ github.workspace }}/.github/renovate.json5":"/renovate.json5" \
          ${RENOVATE_IMAGE} "/renovate.json5"
