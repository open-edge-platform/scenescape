name: "[Update] DLStreamer Pipeline Server 2.0"
run-name: "[Update] DLStreamer Pipeline Server 2.0"

on:
  schedule:
    # Run every Thursday at 10:00 AM UTC
    - cron: "0 10 * * 4"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check-and-update:
    name: "Check and Update DLStreamer Pipeline Server 2.0 Version"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Get latest DLStreamer Pipeline Server 2.0 version from DockerHub"
        id: dockerhub
        run: |
          ALL_TAGS=$(curl -fsS "https://registry.hub.docker.com/v2/repositories/intel/dlstreamer-pipeline-server/tags?page_size=100")

          # Match ubuntu26 DLSPS 2.0 stable, weekly, and RC tags.
          LATEST_2=$(echo "$ALL_TAGS" | jq -r '.results[] | select(.name | test("^[0-9]{4}\\.[0-9]+\\.[0-9]+(-[0-9]{8}-weekly)?-ubuntu26-2\\.0(-rc[0-9]+(\\.[0-9]+)*)?$")) | "\(.last_updated)|\(.name)"' | sort -r | head -1)
          SELECTED_VERSION=$(echo "$LATEST_2" | cut -d'|' -f2)
          SELECTED_DATE=$(echo "$LATEST_2" | cut -d'|' -f1)

          if [[ -z "$SELECTED_VERSION" ]]; then
            echo "Error: No valid DLSPS 2.0 tag found on DockerHub; aborting update." >&2
            exit 1
          fi
          echo "latest_version=${SELECTED_VERSION}" >> $GITHUB_OUTPUT
          echo "published_date=${SELECTED_DATE}" >> $GITHUB_OUTPUT
          echo "Latest DLSPS 2.0 version: ${SELECTED_VERSION} (published: ${SELECTED_DATE})"

      - name: "Get current version from repository"
        id: current
        run: |
          # Get version from helm values.yaml
          CURRENT_VERSION=$(grep -A 2 "image: intel/dlstreamer-pipeline-server" kubernetes/scenescape-chart/values.yaml | grep "tag:" | head -1 | sed 's/.*tag: "\(.*\)"/\1/')
          echo "current_version=${CURRENT_VERSION}" >> $GITHUB_OUTPUT
          echo "Current version in repo: ${CURRENT_VERSION}"

      - name: "Compare versions"
        id: compare
        env:
          LATEST: ${{ steps.dockerhub.outputs.latest_version }}
          CURRENT: ${{ steps.current.outputs.current_version }}
        run: |
          CHART_DLSPS_VERSION=$LATEST
          echo "chart_dlsps_version=${CHART_DLSPS_VERSION}" >> $GITHUB_OUTPUT

          # Update every DLSPS image reference to the selected 2.0 tag.
          OUTDATED_FILES=$(find . -type f \( -name '*.yml' -o -name '*.yaml' -o -name '*.md' \) \( -regex '\./\.github/skills/.*' -o -not -path './.github/*' \) -print  2>/dev/null \
          | while IFS= read -r file; do
            outdated=false
            while IFS= read -r image; do
              version=${image##*:}
              if [ "$version" != "$LATEST" ]; then
                outdated=true
              fi
            done < <(grep -oE '(docker\.io/)?intel/dlstreamer-pipeline-server:[[:alnum:]_][[:alnum:]_.-]*' "$file" || true)
            if [ "$outdated" = true ]; then
              printf '%s\n' "$file"
            fi
          done)

          if [ "${CHART_DLSPS_VERSION}" != "${CURRENT}" ] || [ -n "${OUTDATED_FILES}" ]; then
            echo "update_needed=true" >> $GITHUB_OUTPUT
            echo "Update needed: all DLSPS images -> ${LATEST}; Helm chart DLSPS image tag: ${CURRENT} -> ${CHART_DLSPS_VERSION}"
            [ -n "${OUTDATED_FILES}" ] && echo "Files with non-latest versions:" && echo "${OUTDATED_FILES}"
            {
              echo "outdated_files<<EOF"
              echo "${OUTDATED_FILES}"
              echo "EOF"
            } >> $GITHUB_OUTPUT
          else
            echo "update_needed=false" >> $GITHUB_OUTPUT
            echo "No update needed. Already on latest version: ${CURRENT}"
          fi

      - name: "Update all files"
        id: update
        if: steps.compare.outputs.update_needed == 'true'
        env:
          OLD_VERSION: ${{ steps.current.outputs.current_version }}
          NEW_VERSION: ${{ steps.dockerhub.outputs.latest_version }}
          CHART_DLSPS_VERSION: ${{ steps.compare.outputs.chart_dlsps_version }}
          OUTDATED_FILES: ${{ steps.compare.outputs.outdated_files }}
        run: |
          echo "Updating all DLSPS images to ${NEW_VERSION}"

          printf '%s\n' "$OUTDATED_FILES" | while IFS= read -r file; do
            if [ -n "$file" ]; then
              echo "Updating $file"
              while IFS= read -r image; do
                version=${image##*:}
                escaped_version=${version//./\\.}
                sed -i -E "s#(intel/dlstreamer-pipeline-server:)${escaped_version}([^[:alnum:]_.-]|$)#\1${NEW_VERSION}\2#g" "$file"
              done < <(grep -oE '(docker\.io/)?intel/dlstreamer-pipeline-server:[[:alnum:]_][[:alnum:]_.-]*' "$file" | sort -u)
            fi
          done

          # Update the DLSPS image tag in the Helm chart.
          if [ "$OLD_VERSION" != "$CHART_DLSPS_VERSION" ]; then
            echo "Updating DLSPS image tag in kubernetes/scenescape-chart/values.yaml"
            escaped_version=${OLD_VERSION//./\\.}
            sed -i -E "/image: intel\/dlstreamer-pipeline-server/,+2 s#(tag: \")${escaped_version}(\")#\1${CHART_DLSPS_VERSION}\2#" kubernetes/scenescape-chart/values.yaml
          fi

          # Capture changed files once; derive count and markdown list from the same variable
          CHANGED_FILES_LIST=$(git diff --name-only)
          CHANGED_FILES=$(echo "${CHANGED_FILES_LIST}" | grep -c . || true)
          echo "changed_files=${CHANGED_FILES}" >> $GITHUB_OUTPUT
          echo "Files changed: ${CHANGED_FILES}"

          if [ "${CHANGED_FILES}" -gt 0 ]; then
            echo "success=true" >> $GITHUB_OUTPUT
            echo "Update successful: ${CHANGED_FILES} files modified"
            # Build markdown list of changed files for PR body
            {
              echo "changed_files_list<<EOF"
              echo "${CHANGED_FILES_LIST}" | sed 's|^|- `|' | sed 's|$|`|'
              echo "EOF"
            } >> $GITHUB_OUTPUT
          else
            echo "success=false" >> $GITHUB_OUTPUT
            echo "Warning: No files were changed"
            exit 1
          fi

      - name: "Create Pull Request"
        if: |
          steps.compare.outputs.update_needed == 'true' &&
          steps.update.outputs.success == 'true' &&
          steps.update.outputs.changed_files > 0
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GH_PAT }}
          commit-message: "DLStreamer 2.0: Update all images to ${{ steps.dockerhub.outputs.latest_version }}"
          title: "[DLStreamer 2.0] Update all images to ${{ steps.dockerhub.outputs.latest_version }}"
          body: |
            ## DLStreamer Pipeline Server Update

            This PR updates all DLStreamer Pipeline Server image references.

            ### Target Version
            - **DLSPS 2.0**: `${{ steps.dockerhub.outputs.latest_version }}` (published: `${{ steps.dockerhub.outputs.published_date }}`)
            ### Files Updated
            ${{ steps.update.outputs.changed_files_list }}

            ### DockerHub Reference
            - [Release Notes](https://hub.docker.com/r/intel/dlstreamer-pipeline-server/tags)
            - [Image: intel/dlstreamer-pipeline-server:${{ steps.dockerhub.outputs.latest_version }}](https://hub.docker.com/layers/intel/dlstreamer-pipeline-server/${{ steps.dockerhub.outputs.latest_version }}/images)

            ---
            *This PR was automatically created by the DLStreamer update workflow.*
          base: ${{ github.ref_name }}
          branch: dlstreamer-2.0-ubuntu26-update-${{ steps.dockerhub.outputs.latest_version }}
          delete-branch: true
          labels: |
            dlstreamer
            dependencies
          reviewers: |
            saratpoluri
            dmytroye
            tdorauintc
