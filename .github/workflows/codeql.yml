name: "[Code Analysis] CodeQL"
run-name: "[Code Analysis] CodeQL"
on:
  workflow_dispatch: {}
  pull_request:
    branches:
      - main
      - release-*
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main
      - release-*

permissions: {}

jobs:
  detect-languages:
    name: "Detect Changed Languages"
    runs-on: ubuntu-latest
    if: github.event_name != 'push' && github.event_name != 'workflow_dispatch'
    permissions:
      contents: read
    outputs:
      langs: ${{ steps.detect-langs.outputs.langs }}
    steps:
      - name: "Checkout code"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #7.0.0
        with:
          path: scenescape
          persist-credentials: false
          fetch-depth: 0

      - name: "Detect changed languages"
        working-directory: scenescape
        id: detect-langs
        run: |
          if [ "$(git rev-parse --abbrev-ref HEAD)" != "main" ]; then
            git fetch origin main:main
            echo "Fetched main branch"
          fi
          changed_files=$(git diff --name-only main...$GITHUB_SHA -- '*.yml' '*.yaml' '*.js' '*.ts' '*.h' '*.c' '*.hpp' '*.cpp' '*.py' || true)
          echo "Performed git diff"

          if [ -z "$changed_files" ]; then
            echo "No relevant changed files detected."
            echo "langs=[]" >> $GITHUB_OUTPUT
            exit 0
          fi
          declare -A langmap=( ["yaml"]=actions ["yml"]=actions ["js"]=javascript-typescript ["ts"]=javascript-typescript ["h"]=c-cpp ["c"]=c-cpp ["hpp"]=c-cpp ["cpp"]=c-cpp ["py"]=python )
          declare -A langs

          for file in $changed_files; do
            ext="${file##*.}"
            [[ ${langmap[$ext]} ]] && langs[${langmap[$ext]}]=1
          done

          langs_json=$(printf '%s\n' "${!langs[@]}" | sort | jq -R . | jq -s -c .)
          echo "Changed files:"
          echo "$changed_files"
          echo "Detected langs:"
          echo "$langs_json"
          echo "langs=$langs_json" >> $GITHUB_OUTPUT

  analyze-changed:
    name: "CodeQL Analysis on changed files"
    needs: detect-languages
    if: (github.event_name != 'push' && github.event_name != 'workflow_dispatch') && needs.detect-languages.outputs.langs != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJson(needs.detect-languages.outputs.langs) }}
    permissions:
      security-events: write
      actions: read
      contents: read
      packages: read

    steps:
      - name: "Checkout code"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #7.0.0
        with:
          persist-credentials: false

      - name: "Initialize CodeQL build mode"
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          source-root: .

      - name: "Perform CodeQL analysis"
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: "/language:${{matrix.language}}"
          output: results

      - name: "GitHub Upload SARIF report"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-report-${{ matrix.language }}
          path: results

  analyze-all:
    name: "Run CodeQL Analysis on whole codebase"
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language: [actions, javascript-typescript, python, c-cpp] # Add more languages as needed
    steps:
      - name: "Checkout code"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: "Initialize CodeQL"
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: ${{ matrix.language }}
          dependency-caching: true

      - name: "Autobuild"
        if: ${{ matrix.language != 'c-cpp' }}
        uses: github/codeql-action/autobuild@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6

      - name: Build C and C++ code
        if: ${{ matrix.language == 'c-cpp' }}
        working-directory: tracker
        run: |
          sudo make install-deps
          make install-tools
          # Ensure pipx-installed tools (conan, cmake, ninja) are on PATH
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          # Create default Conan profile (required before `conan install`)
          conan profile detect --force
          make build

      - name: "Perform CodeQL Analysis"
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: "/language:${{ matrix.language }}"
          output: results

      - name: "GitHub Upload SARIF report"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-report-${{ matrix.language }}
          path: results
