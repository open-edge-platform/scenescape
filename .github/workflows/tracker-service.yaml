name: "[CI] Tracker Service"
run-name: "[CI] Tracker Service"

on: # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - main
      - release-*
      - tracker-service-*
    paths:
      - "tracker/**"
      - ".github/workflows/tracker-service.yaml"
  push:
    branches:
      - main
    paths:
      - "tracker/**"
      - ".github/workflows/tracker-service.yaml"
  workflow_dispatch: {}

concurrency:
  group: tracker-service-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-format:
    name: "Lint and format check"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout code"
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: "Install clang-format"
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: "Check C++ formatting"
        run: make -C tracker format-check

  native-build-and-test:
    name: "Native build and unit tests"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout code"
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: "Install build tools"
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libopencv-dev \
            libeigen3-dev \
            libopenblas-dev
          pip install conan

      - name: "Configure Conan"
        run: |
          conan profile detect --force

      - name: "Cache Conan packages"
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ hashFiles('tracker/conanfile.py') }}
          restore-keys: |
            conan-${{ runner.os }}-

      - name: "Build release"
        run: make -C tracker build-release

      - name: "Build debug with tests"
        run: make -C tracker build-debug

      - name: "Run unit tests"
        run: make -C tracker test-unit

  docker-build:
    name: "Docker image build"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout code"
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: "Build Docker image"
        run: |
          make -C tracker build-image \
            CACHE_FROM="type=gha" \
            CACHE_TO="type=gha,mode=max"

  service-test:
    name: "Service integration test"
    runs-on: ubuntu-latest
    needs: docker-build
    env:
      PRESERVE_ON_FAILURE: "0"
    steps:
      - name: "Checkout code"
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: "Load Docker image from cache"
        run: |
          make -C tracker build-image \
            CACHE_FROM="type=gha"

      - name: "Install Python dependencies"
        run: |
          pip install -r tracker/test/service/requirements.txt

      - name: "Run service tests"
        run: make -C tracker test-service
