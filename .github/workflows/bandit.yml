name: "[Code Analysis] Bandit Security Scan"
run-name: "[Code Analysis] Bandit Security Scan"

on:
  workflow_call: {}
  workflow_dispatch: {}

# Only run at most 1 workflow concurrently per PR or per branch to keep costs down.
# Hardcoded prefix so this group is stable when called via workflow_call
# (github.workflow evaluates to the caller's workflow name in reusable workflows).
concurrency:
  group: bandit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # needed for actions/checkout

jobs:
  bandit:
    name: "Run Bandit Security Scan"
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Run Bandit scan
        if: github.event_name == 'pull_request'
        uses: open-edge-platform/orch-ci/.github/actions/security/bandit@af6d3ab68ed04ec1b3111392ec0844e8e1ac83a5
        with:
          scan-scope: "changed"
          severity-level: "HIGH"
          output-format: "txt"
          config_file: ".github/resources/bandit.config"
          fail-on-findings: "true"
      - name: Run Bandit scan
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        uses: open-edge-platform/orch-ci/.github/actions/security/bandit@af6d3ab68ed04ec1b3111392ec0844e8e1ac83a5
        with:
          scan-scope: "all"
          severity-level: "HIGH"
          output-format: "txt"
          config_file: ".github/resources/bandit.config"
          fail-on-findings: "true"
