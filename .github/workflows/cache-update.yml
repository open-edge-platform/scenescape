name: "[CI] Update Image Caches"
run-name: "[CI] Update Image Caches"

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  DOCKER_BUILDKIT: 1

permissions:
  contents: read

jobs:
  build-and-update:
    name: "Build Scenescape images and update caches"
    runs-on: [self-hosted]
    permissions:
      packages: write # For using GHCR as cache registry
    timeout-minutes: 60
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: "Remove all Docker images"
        uses: ./.github/actions/cleanup
        with:
          system-prune: "true"

      - name: "Log in to GHCR"
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Setup Cache Targets"
        id: setup-cache
        uses: ./.github/actions/setup-cache

      - name: "Build Images and Update Caches"
        env:
          WRITE_CACHE: true
          CACHE_REGISTRY: ${{ steps.setup-cache.outputs.cache_registry }}
          GHCR_CACHE: ${{ steps.setup-cache.outputs.ghcr_cache }}
        run: |
          make build-all
