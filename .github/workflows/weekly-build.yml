name: Weekly Build and Release

on:
  schedule:
    - cron: '0 0 * * 0' # Every Sunday at midnight
  push:
    tags:
      - 'v*' # On version tags

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout code"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ secrets.GH_USERNAME }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Get commit hash
        id: vars
        run: echo "commit_hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build all images
        run: make build-all

      - name: Push images (weekly or commit hash)
        if: github.event_name == 'schedule'
        run: |
          docker tag myimage:latest ghcr.io/${{ github.repository }}/myimage:weekly
          docker tag myimage:latest ghcr.io/${{ github.repository }}/myimage:${{ steps.vars.outputs.commit_hash }}
          docker push ghcr.io/${{ github.repository }}/myimage:weekly
          docker push ghcr.io/${{ github.repository }}/myimage:${{ steps.vars.outputs.commit_hash }}

      - name: Push images (release tag)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          RELEASE_TAG=${GITHUB_REF#refs/tags/}
          docker tag myimage:latest ghcr.io/${{ github.repository }}/myimage:${RELEASE_TAG}
          docker push ghcr.io/${{ github.repository }}/myimage:${RELEASE_TAG}
