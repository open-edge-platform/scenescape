name: "Weekly Build Images"
run-name: "Weekly Build Images"

on:
  schedule:
    - cron: '0 14 * * 2' # Each Tuesday at 14:00 UTC
  workflow_dispatch: {}
permissions: {}

jobs:
  build-and-push:
    name: "Build and Push Images"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
    steps:
      - name: "Set up Docker Buildx"
        id: setup-buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: "Log in to GHCR"
        id: login-ghcr
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Checkout code"
        id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false

      - name: "Get commit hash"
        id: vars
        needs: [checkout]
        run: echo "commit_hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: "Build images"
        id: build-images
        needs: [setup-buildx, login-ghcr]
        run: |
          for dir in scene_common autocalibration controller manager; do
            cd $dir
            make
            cd ..
          done

      - name: "Tag images"
        id: tag-images
        needs: [vars, build-images]
        run: |
          docker tag scenescape-camcalibration:latest ghcr.io/${{ github.repository }}/scenescape-camcalibration:${{ steps.vars.outputs.commit_hash }}
          docker tag scenescape-controller:latest ghcr.io/${{ github.repository }}/scenescape-controller:${{ steps.vars.outputs.commit_hash }}
          docker tag scenescape-manager:latest ghcr.io/${{ github.repository }}/scenescape-manager:${{ steps.vars.outputs.commit_hash }}

      - name: "Push images"
        needs: [vars, build-images, tag-images]
        run: |
          docker push ghcr.io/${{ github.repository }}/scenescape-camcalibration:${{ steps.vars.outputs.commit_hash }}
          docker push ghcr.io/${{ github.repository }}/scenescape-controller:${{ steps.vars.outputs.commit_hash }}
          docker push ghcr.io/${{ github.repository }}/scenescape-manager:${{ steps.vars.outputs.commit_hash }}

