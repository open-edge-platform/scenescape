name: "[Build] Build Images And Publish To DockerHub"
run-name: "[Build] Build Images And Publish To DockerHub"

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish images to DockerHub"
        required: true
        default: false
        type: boolean
permissions: {}

jobs:
  build:
    name: "Build, Tag and Push Images"
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.determine-tag.outputs.image_tag }}
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        images:
          [
            scenescape-autocalibration,
            scenescape-controller,
            scenescape-manager,
            scenescape-tracker,
            scenescape-sources,
            scenescape-mapping-mapanything,
            scenescape-mapping-vggt,
          ]
    steps:
      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: "Checkout code"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: "Build image scene_common"
        run: |
          if [[ "${{ matrix.images }}" != "scenescape-sources" && "${{ matrix.images }}" != "scenescape-tracker" ]]; then
            echo "Building scene_common"
            make -C scene_common
          fi

      - name: "Build image ${{ matrix.images }}"
        run: |
          if [[ "${{ matrix.images }}" == "scenescape-autocalibration" ]]; then
            echo "Building ${{ matrix.images }}"
            make -C autocalibration
          elif [[ "${{ matrix.images }}" == "scenescape-controller" ]]; then
            echo "Building ${{ matrix.images }}"
            make -C controller
          elif [[ "${{ matrix.images }}" == "scenescape-manager" ]]; then
            echo "Building ${{ matrix.images }}"
            make -C manager
          elif [[ "${{ matrix.images }}" == "scenescape-tracker" ]]; then
            echo "Building ${{ matrix.images }}"
            make -C tracker
          elif [[ "${{ matrix.images }}" == "scenescape-sources" ]]; then
            echo "Building ${{ matrix.images }}"
            make build-sources-image
          elif [[ "${{ matrix.images }}" == "scenescape-mapping-mapanything" ]]; then
            echo "Building ${{ matrix.images }}"
            make -C mapping build-mapanything
          elif [[ "${{ matrix.images }}" == "scenescape-mapping-vggt" ]]; then
            echo "Building ${{ matrix.images }}"
            make -C mapping build-vggt
          else
            echo "ERROR: Unexpected matrix.images value: '${{ matrix.images }}'"
            exit 1
          fi

      - name: "Determine Image Tag"
        id: determine-tag
        run: |
          version=""
          if [ -f version.txt ]; then
            version=v$(tr -d ' \n' < version.txt)
          else
            echo "version.txt not found."
            exit 1
          fi
          # If version.txt contains "rc", use its content as image tag
          if grep -q "rc" version.txt; then
            tag="$version"
          else
            if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
              # If version.txt contains "dev", add sha to image tag
              if grep -q "dev" version.txt; then
                commit_hash=$(git rev-parse --short HEAD)
                tag="${version:+$version-}$commit_hash"
              else
                echo "No 'dev' found in version.txt. Using version from version.txt as image tag."
                tag="$version"
              fi
            else
              date_tag=$(date -u +'%Y%m%d')
              tag="${version:+$version-}$date_tag"
            fi
          fi
          # Append model type suffix for mapping images
          if [[ "${{ matrix.images }}" == "scenescape-mapping-mapanything" ]]; then
            tag="${tag}-mapanything"
          elif [[ "${{ matrix.images }}" == "scenescape-mapping-vggt" ]]; then
            tag="${tag}-vggt"
          fi
          echo "image_tag=$tag" >> $GITHUB_OUTPUT

      - name: "Compute target DockerHub image"
        id: compute-target
        run: |
          if [[ "${{ matrix.images }}" == scenescape-mapping-* ]]; then
            echo "target_image=intel/scenescape-mapping" >> $GITHUB_OUTPUT
          else
            echo "target_image=intel/${{ matrix.images }}" >> $GITHUB_OUTPUT
          fi

      - name: "Tag images"
        run: |
          docker tag ${{ matrix.images }}:latest ${{ steps.compute-target.outputs.target_image }}:${{ steps.determine-tag.outputs.image_tag }}
          echo "Tagged ${{ matrix.images }}:latest as ${{ steps.compute-target.outputs.target_image }}:${{ steps.determine-tag.outputs.image_tag }}"

      - name: "Log in to DockerHub"
        if: ${{ github.event.inputs.publish == 'true' }}
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          username: scenescape
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: "Push images"
        if: ${{ github.event.inputs.publish == 'true' }}
        run: |
          docker push ${{ steps.compute-target.outputs.target_image }}:${{ steps.determine-tag.outputs.image_tag }}

      - name: Install skopeo
        if: ${{ github.event.inputs.publish == 'true' }}
        run: sudo apt update && sudo apt install -y skopeo jq

      - name: "Get image digest"
        id: digest
        if: ${{ github.event.inputs.publish == 'true' }}
        run: |
          IMAGE="${{ steps.compute-target.outputs.target_image }}:${{ steps.determine-tag.outputs.image_tag }}"
          DIGEST=$(skopeo inspect docker://$IMAGE | jq -r '.Digest')
          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT

      - name: "Install Cosign"
        if: ${{ github.event.inputs.publish == 'true' }}
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1

      - name: "Sign Docker images using Cosign (keyless)"
        if: ${{ github.event.inputs.publish == 'true' }}
        run: |
          cosign sign --yes ${{ steps.compute-target.outputs.target_image }}@${{ steps.digest.outputs.digest }}
          echo "Signed ${{ steps.compute-target.outputs.target_image }}@${{ steps.digest.outputs.digest }}"

      - name: "Save ${{ matrix.images }} image info"
        id: save-image-info
        if: ${{ github.event.inputs.publish == 'true' }}
        run: |
          echo "image_name=${{ steps.compute-target.outputs.target_image }}:${{ steps.determine-tag.outputs.image_tag }}" >> "$GITHUB_OUTPUT"
          echo "image_name=${{ steps.compute-target.outputs.target_image }}:${{ steps.determine-tag.outputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "image_digest=${{ steps.digest.outputs.digest }}" >> "$GITHUB_OUTPUT"
          echo "image_digest=${{ steps.digest.outputs.digest }}" >> $GITHUB_STEP_SUMMARY

      - name: Clean up
        if: always()
        run: |
          docker system prune -a --volumes -f || true
