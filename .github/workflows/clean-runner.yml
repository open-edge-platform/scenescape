name: "[CI] Clean self-hosted runner"
run-name: "[CI] Clean self-hosted runner"

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: "Label of the self-hosted runner to clean"
        required: false
        default: "to-be-cleaned"
        type: string

permissions:
  contents: read

jobs:
  clean-runner:
    name: "Clean self-hosted runner (${{ inputs.runner_label }})"
    runs-on: ${{ inputs.runner_label }}
    steps:
      - name: "Clean workdir before checkout"
        run: |
          sudo find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} + || true
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cleanup
        if: always()
        uses: ./.github/actions/cleanup
        with:
          system-prune: "true"
