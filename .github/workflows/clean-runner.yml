name: "[CI] Clean self-hosted runner"
run-name: "[CI] Clean self-hosted runner"

on:
  workflow_dispatch: {}

# Only run at most 1 workflow concurrently per PR or per branch to keep costs down
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  clean-runner:
    name: "Clean self-hosted runner"
    runs-on: [self-hosted]
    steps:
      - name: "Print docker daemon config"
        shell: bash
        run: |
          cat /etc/docker/daemon.json || echo "No docker daemon config found"
