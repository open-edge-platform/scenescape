name: "[CI] Clean self-hosted runner"
run-name: "[CI] Clean self-hosted runner"

on:
  # Manual only: add the "to-be-cleaned" label to the runner that needs cleanup,
  # run this workflow, then remove the label again.
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  clean-runner:
    name: "Clean self-hosted runner"
    runs-on: [to-be-cleaned]
    steps:
      - name: "Clean workdir before checkout"
        run: |
          sudo find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} + || true
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cleanup
        if: always()
        uses: ./.github/actions/cleanup
        with:
          system-prune: "true"
