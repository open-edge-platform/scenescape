name: "[CI] Pre-merge"
run-name: "[CI] Pre-merge"

on:
  pull_request:
    branches:
      - main
      - release-*
      - feature/*
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: pre-merge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # manager-api-spec-review:
  #   name: "Manager API Spec Review"
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: "Checkout PR head with history"
  #       uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
  #       with:
  #         ref: ${{ github.event.pull_request.head.sha }}
  #         fetch-depth: 0
  #         persist-credentials: false
  #     - name: "Remind authors to review Manager API spec"
  #       env:
  #         PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
  #         PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  #       run: make check-manager-api-spec-review

  detect-changes:
    name: "Detect Changed Paths"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      renovate_config: ${{ steps.filter.outputs.renovate_config }}
    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Filter paths"
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            renovate_config:
              - '.github/renovate.json5'

  bandit:
    name: "Bandit"
    uses: ./.github/workflows/bandit.yml
    permissions:
      contents: read

  cognitive-complexity:
    name: "Cognitive Complexity"
    uses: ./.github/workflows/cognitive-complexity.yml
    permissions:
      contents: read

  clamav:
    name: "ClamAV"
    uses: ./.github/workflows/clamav.yml
    permissions:
      contents: read

  codeql:
    name: "CodeQL"
    uses: ./.github/workflows/codeql.yml
    permissions:
      security-events: write
      actions: read
      contents: read
      packages: read

  gitleaks:
    name: "Gitleaks"
    uses: ./.github/workflows/gitleaks.yml
    permissions:
      contents: read

  license:
    name: "License"
    uses: ./.github/workflows/license.yml
    permissions:
      contents: read

  scorecard:
    name: "Scorecard"
    uses: ./.github/workflows/scorecard.yml
    permissions:
      contents: read
      security-events: write
      id-token: write
    secrets:
      SYS_EMF_GH_TOKEN: ${{ secrets.SYS_EMF_GH_TOKEN }}

  tests-bat:
    name: "BAT Tests"
    needs:
      - lint
      - bandit
      - cognitive-complexity
      - codeql
      - zizmor
      - license
    uses: ./.github/workflows/tests-bat.yml
    permissions:
      contents: read
      packages: write
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  tracker-service:
    name: "Tracker Service Tests"
    uses: ./.github/workflows/tracker-service.yml
    permissions:
      contents: read

  trivy:
    name: "Trivy"
    uses: ./.github/workflows/trivy.yml
    permissions:
      contents: read

  zizmor:
    name: "Zizmor"
    uses: ./.github/workflows/zizmor.yml
    permissions:
      contents: read
      security-events: write

  documentation-check:
    name: "Documentation"
    uses: ./.github/workflows/documentation-check.yml
    permissions:
      contents: read

  lint:
    name: "Lint"
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: read

  renovate-config-validator:
    name: "Renovate Config Validator"
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.renovate_config == 'true' }}
    uses: ./.github/workflows/renovate-config-validator.yml
    permissions:
      contents: read
