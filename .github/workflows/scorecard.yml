name: "[Code Analysis] OSSF Scorecard"
run-name: "[Code Analysis] OSSF Scorecard"

on:
  workflow_call:
    secrets:
      SYS_EMF_GH_TOKEN:
        required: true
  workflow_dispatch: {}

# Only run at most 1 workflow concurrently per PR or per branch to keep costs down.
# Hardcoded prefix so this group is stable when called via workflow_call
# (github.workflow evaluates to the caller's workflow name in reusable workflows).
concurrency:
  group: scorecard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scorecard:
    name: "Run OpenSSF Scorecard"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed to upload the results to code-scanning dashboard.
      security-events: write
      # Needed to publish results and get a badge (see publish_results below).
      id-token: write
    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Run OpenSSF Scorecard"
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          repo_token: ${{ secrets.SYS_EMF_GH_TOKEN }}
          publish_results: true
      - name: "Upload Scorecard Results"
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: scorecard-results.sarif
      - name: "Upload Scorecard Results"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: scorecard-results.sarif
