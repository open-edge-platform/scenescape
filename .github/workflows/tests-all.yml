# TEMPORARY: This workflow has been temporarily reduced to only run the
# performance degradation test for validation on the current branch. Restore
# the full job set (run_functional_tests, run_non_functional_tests,
# run_metric_tests, run_ui_tests, run_unit_tests) before merging.
name: "[Tests] Performance Test"
run-name: "[Tests] Performance Test"

on:
  workflow_dispatch:
    inputs:
      cleanup:
        description: "Cleanup before running ALL tests"
        required: false
        default: false
        type: boolean
      performance_hours:
        description: "Duration (hours) for the performance degradation test"
        required: false
        default: "2"
        type: string
  workflow_call:
    inputs:
      ref:
        description: "Scenescape ref to test against"
        required: false
        default: ""
        type: string
      save_artifacts:
        description: "Save artifacts from tests"
        required: false
        default: true
        type: boolean
      cleanup:
        description: "Cleanup before running ALL tests"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
      - release-*

# Only run at most 1 workflow concurrently per pushed commit
concurrency:
  group: ${{ github.workflow }}-${{ github.sha || github.ref }}-${{ inputs.ref || 'default' }}
  cancel-in-progress: true

env:
  DOCKER_BUILDKIT: 1
  SUPASS: demo

permissions:
  contents: read

jobs:
  compute_timeout:
    runs-on: ubuntu-latest
    name: "Compute Timeout"
    outputs:
      timeout_minutes: ${{ steps.compute.outputs.timeout_minutes }}
    steps:
      - name: Compute job timeout (performance_hours + 1 hour buffer)
        id: compute
        env:
          PERFORMANCE_HOURS: ${{ inputs.performance_hours || '2' }}
        run: |
          echo "timeout_minutes=$(( PERFORMANCE_HOURS * 60 + 60 ))" >> "$GITHUB_OUTPUT"

  run_performance_test:
    needs: compute_timeout
    runs-on: [all]
    name: "Performance Test"
    permissions:
      packages: write # For using GHCR as cache registry
    timeout-minutes: ${{ fromJSON(needs.compute_timeout.outputs.timeout_minutes) }}
    steps:
      - name: Remove test_data folder
        run: |
          sudo rm -rf test_data || true

      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.ref }}

      - name: "Remove all Docker images"
        if: ${{ github.event_name == 'push' || github.event.inputs.cleanup == 'true' }}
        uses: ./.github/actions/cleanup
        with:
          system-prune: "true"

      - name: Setup Tests Environment
        id: setup-test-env
        uses: ./.github/actions/setup-tests
        with:
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Performance Test
        env:
          PERFORMANCE_HOURS: ${{ inputs.performance_hours || '2' }}
        run: |
          source tests/.venv/bin/activate
          mkdir -p reports
          pytest tests/system/performance --junitxml=reports/performance_results.xml --log-level=ERROR

      - name: Upload Test Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: performance-report
          path: |
            **/reports/*.xml

      - name: Cleanup
        if: always()
        uses: ./.github/actions/cleanup

