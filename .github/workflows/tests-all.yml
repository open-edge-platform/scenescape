name: "[Tests] All Tests"
run-name: "[Tests] All Tests"

on:
  workflow_dispatch:
    inputs:
      cleanup:
        description: "Cleanup before running ALL tests"
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      ref:
        description: "Scenescape ref to test against"
        required: false
        default: ""
        type: string
      save_artifacts:
        description: "Save artifacts from tests"
        required: false
        default: true
        type: boolean
      cleanup:
        description: "Cleanup before running ALL tests"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
      - release-*

# Only run at most 1 workflow concurrently per pushed commit
concurrency:
  group: ${{ github.workflow }}-${{ github.sha || github.ref }}-${{ inputs.ref || 'default' }}
  cancel-in-progress: true

env:
  DOCKER_BUILDKIT: 1
  SUPASS: demo

permissions:
  contents: read

jobs:
  run_functional_tests:
    runs-on: [all]
    name: "Functional Tests"
    permissions:
      packages: write # For using GHCR as cache registry
    timeout-minutes: 300
    steps:
      - name: Remove test_data folder
        run: |
          sudo rm -rf test_data || true

      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.ref }}

      - name: "Remove all Docker images"
        if: ${{ github.event_name == 'push' || github.event.inputs.cleanup == 'true' }}
        uses: ./.github/actions/cleanup
        with:
          system-prune: "true"

      - name: Setup Tests Environment
        id: setup-test-env
        uses: ./.github/actions/setup-tests
        with:
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Functional Tests
        run: |
          source tests/.venv/bin/activate
          mkdir -p reports
          pytest tests/functional --junitxml=reports/functional_results.xml --log-level=ERROR

      - name: Upload Test Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: functional-report
          path: |
            **/reports/*.xml

      - name: Cleanup
        if: always()
        uses: ./.github/actions/cleanup

  run_non_functional_tests:
    runs-on: [all]
    name: "Non-Functional Tests"
    permissions:
      packages: write # For using GHCR as cache registry
    timeout-minutes: 60
    steps:
      - name: Remove test_data folder
        run: |
          sudo rm -rf test_data || true

      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.ref }}

      - name: "Log in to DockerHub"
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          username: scenescape
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Tests Environment
        id: setup-test-env
        uses: ./.github/actions/setup-tests
        with:
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Non Functional Tests
        run: |
          source tests/.venv/bin/activate
          mkdir -p reports
          pytest tests/non_functional --junitxml=reports/non_functional_results.xml --log-level=ERROR

      - name: Upload Test Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: non-functional-report
          path: |
            **/reports/*.xml

      - name: Cleanup
        if: always()
        uses: ./.github/actions/cleanup

  run_metric_tests:
    runs-on: [all]
    name: "Metric Tests"
    permissions:
      packages: write # For using GHCR as cache registry
    timeout-minutes: 90
    steps:
      - name: Remove test_data folder
        run: |
          sudo rm -rf test_data || true

      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.ref }}

      - name: "Remove all Docker images"
        if: ${{ github.event_name == 'push' || github.event.inputs.cleanup == 'true' }}
        uses: ./.github/actions/cleanup
        with:
          system-prune: "true"

      - name: Setup Tests Environment
        id: setup-test-env
        uses: ./.github/actions/setup-tests
        with:
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Metric Tests
        run: |
          source tests/.venv/bin/activate
          mkdir -p reports
          pytest tests/system/metric --junitxml=reports/metric_results.xml --log-level=ERROR

      - name: Upload Test Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: metric-report
          path: |
            **/reports/*.xml

      - name: Cleanup
        if: always()
        uses: ./.github/actions/cleanup

  run_ui_tests:
    runs-on: [all]
    name: "UI Tests"
    permissions:
      packages: write # For using GHCR as cache registry
    timeout-minutes: 300
    steps:
      - name: Remove test_data folder
        run: |
          sudo rm -rf test_data || true

      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.ref }}

      - name: "Remove all Docker images"
        if: ${{ github.event_name == 'push' || github.event.inputs.cleanup == 'true' }}
        uses: ./.github/actions/cleanup
        with:
          system-prune: "true"

      - name: Setup Tests Environment
        id: setup-test-env
        uses: ./.github/actions/setup-tests
        with:
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run UI Tests
        run: |
          source tests/.venv/bin/activate
          mkdir -p reports
          pytest tests/ui --junitxml=reports/ui_results.xml --log-level=ERROR

      - name: Upload Test Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ui-report
          path: |
            **/reports/*.xml

      - name: Cleanup
        if: always()
        uses: ./.github/actions/cleanup

  run_unit_tests:
    runs-on: [all]
    name: "Unit Tests"
    permissions:
      packages: write # For using GHCR as cache registry
    timeout-minutes: 70
    steps:
      - name: Remove test_data folder
        run: |
          sudo rm -rf test_data || true

      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.ref }}

      - name: "Remove all Docker images"
        if: ${{ github.event_name == 'push' || github.event.inputs.cleanup == 'true' }}
        uses: ./.github/actions/cleanup
        with:
          system-prune: "true"

      - name: Setup Tests Environment
        uses: ./.github/actions/setup-tests
        with:
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Run Unit Tests"
        run: |
          source tests/.venv/bin/activate
          mkdir -p reports
          pytest tests/sscape_tests --junitxml=reports/unit_results.xml --log-level=ERROR

      - name: Upload Test Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: unit-report
          path: |
            **/reports/*.xml

      - name: Cleanup
        if: always()
        uses: ./.github/actions/cleanup

  run_metric_tests:
    runs-on: [all]
    name: "Metric Tests"
    permissions:
      packages: write # For using GHCR as cache registry
    timeout-minutes: 60
    steps:
      - name: Remove test_data folder
        run: |
          sudo rm -rf test_data || true

      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.ref }}

      - name: "Log in to DockerHub"
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          username: scenescape
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Tests Environment
        id: setup-test-env
        uses: ./.github/actions/setup-tests
        with:
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Run Metric Tests"
        if: always() && steps.setup-test-env.outcome == 'success'
        run: |
          source tests/.venv/bin/activate
          mkdir -p reports
          pytest tests/system/metric --junitxml=reports/metric_results.xml --log-level=ERROR

      - name: Upload Test Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: metric-report
          path: |
            **/reports/*.xml

      - name: Cleanup
        if: always()
        uses: ./.github/actions/cleanup
