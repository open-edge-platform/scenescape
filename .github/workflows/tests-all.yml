# SPDX-License-Identifier: Apache-2.0

name: "[Tests] All Tests"
run-name: "[Tests] All Tests"

on:
  workflow_dispatch:
    inputs:
      cleanup:
        description: "Cleanup before running ALL tests"
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      ref:
        description: "SceneScape ref to test against"
        required: false
        default: ""
        type: string
      save_artifacts:
        description: "Save artifacts from tests"
        required: false
        default: true
        type: boolean
      cleanup:
        description: "Cleanup before running ALL tests"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
      - release-*
  pull_request:
    branches:
      - main
      - release-*

# Only run at most 1 workflow concurrently per pushed commit
concurrency:
  group: ${{ github.workflow }}-${{ github.sha || github.ref }}-${{ inputs.ref || 'default' }}
  cancel-in-progress: true

env:
  DOCKER_BUILDKIT: 1
  SUPASS: demo

permissions:
  contents: read

jobs:
  run_basic_acceptance_tests:
    runs-on: [all]
    name: "Basic Acceptance Tests"
    timeout-minutes: 45
    steps:
      - name: Remove test_data folder
        run: |
          sudo rm -rf test_data || true

      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.ref }}

      - name: "Remove all Docker images"
        if: ${{ github.event.inputs.cleanup == 'true' }}
        uses: ./.github/actions/cleanup
        with:
          system-prune: "true"

      - name: "Run Setup"
        uses: ./.github/actions/setup-env

      - name: Run Basic Acceptance Tests
        run: |
          make clean-all
          make run_basic_acceptance_tests > basic_acceptance_tests.log 2>&1

      - name: Upload Logs and Reports
        if: always() && (!contains(toJSON(inputs), 'save_artifacts') || inputs.save_artifacts)
        uses: ./.github/actions/upload-artifacts

      - name: Cleanup
        if: always()
        uses: ./.github/actions/cleanup

  run_functional_tests:
    runs-on: [all]
    name: "Functional Tests"
    timeout-minutes: 55
    steps:
      - name: Remove test_data folder
        run: |
          sudo rm -rf test_data || true

      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.ref }}

      - name: "Remove all Docker images"
        if: ${{ github.event.inputs.cleanup == 'true' }}
        uses: ./.github/actions/cleanup
        with:
          system-prune: "true"

      - name: "Run Setup"
        uses: ./.github/actions/setup-env

      - name: Run Functional Tests
        run: |
          make clean-all
          make run_functional_tests > functional_tests.log 2>&1

      - name: Upload Logs and Reports
        if: always() && (!contains(toJSON(inputs), 'save_artifacts') || inputs.save_artifacts)
        uses: ./.github/actions/upload-artifacts

      - name: Cleanup
        if: always()
        uses: ./.github/actions/cleanup

  run_non_functional_tests:
    runs-on: [all]
    name: "Non-Functional Tests"
    timeout-minutes: 20
    steps:
      - name: Remove test_data folder
        run: |
          sudo rm -rf test_data || true

      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.ref }}

      - name: "Remove all Docker images"
        if: ${{ github.event.inputs.cleanup == 'true' }}
        uses: ./.github/actions/cleanup
        with:
          system-prune: "true"

      - name: "Run Setup"
        uses: ./.github/actions/setup-env

      - name: Run Non-Functional Tests
        run: |
          make clean-all
          make run_non_functional_tests > non_functional.log 2>&1

      - name: Upload Logs and Reports
        if: always() && (!contains(toJSON(inputs), 'save_artifacts') || inputs.save_artifacts)
        uses: ./.github/actions/upload-artifacts

      - name: Cleanup
        if: always()
        uses: ./.github/actions/cleanup

  run_metric_tests:
    runs-on: [all]
    name: "Metric Tests"
    timeout-minutes: 20
    steps:
      - name: Remove test_data folder
        run: |
          sudo rm -rf test_data || true

      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.ref }}

      - name: "Remove all Docker images"
        if: ${{ github.event.inputs.cleanup == 'true' }}
        uses: ./.github/actions/cleanup
        with:
          system-prune: "true"

      - name: "Run Setup"
        uses: ./.github/actions/setup-env

      - name: Run Metric Tests
        run: |
          make clean-all
          make run_metric_tests > metrics.log 2>&1

      - name: Upload Logs and Reports
        if: always() && (!contains(toJSON(inputs), 'save_artifacts') || inputs.save_artifacts)
        uses: ./.github/actions/upload-artifacts

      - name: Cleanup
        if: always()
        uses: ./.github/actions/cleanup

  run_ui_tests:
    runs-on: [all]
    name: "UI Tests"
    timeout-minutes: 45
    steps:
      - name: Remove test_data folder
        run: |
          sudo rm -rf test_data || true

      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.ref }}

      - name: "Remove all Docker images"
        if: ${{ github.event.inputs.cleanup == 'true' }}
        uses: ./.github/actions/cleanup
        with:
          system-prune: "true"

      - name: "Run Setup"
        uses: ./.github/actions/setup-env

      - name: Run UI Tests
        run: |
          make clean-all
          make run_ui_tests > ui_tests.log 2>&1

      - name: Upload Logs and Reports
        if: always() && (!contains(toJSON(inputs), 'save_artifacts') || inputs.save_artifacts)
        uses: ./.github/actions/upload-artifacts

      - name: Cleanup
        if: always()
        uses: ./.github/actions/cleanup

  run_unit_tests:
    runs-on: [all]
    name: "Unit Tests"
    timeout-minutes: 20
    steps:
      - name: Remove test_data folder
        run: |
          sudo rm -rf test_data || true

      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.ref }}

      - name: "Remove all Docker images"
        if: ${{ github.event.inputs.cleanup == 'true' }}
        uses: ./.github/actions/cleanup
        with:
          system-prune: "true"

      - name: "Run Setup"
        uses: ./.github/actions/setup-env

      - name: Run Unit Tests
        run: |
          make clean-all
          make run_unit_tests > unit_tests.log 2>&1

      - name: Upload Logs and Reports
        if: always() && (!contains(toJSON(inputs), 'save_artifacts') || inputs.save_artifacts)
        uses: ./.github/actions/upload-artifacts

      - name: Cleanup
        if: always()
        uses: ./.github/actions/cleanup

    upload-results:
      needs: [run_basic_acceptance_tests, run_functional_tests, run_non_functional_tests, run_metric_tests, run_ui_tests, run_unit_tests]
      runs-on: ubuntu-latest
      name: "Upload Test Results"
      if: always()
      steps:
        - name: Checkout Repository
          uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
          with:
            fetch-depth: 0
            persist-credentials: false
            ref: ${{ inputs.ref }}
        - name: Download All Test Artifacts
          uses: actions/download-artifact@v5
        - name: Get all test cases from test files
          id: get_test_cases
          run: |
            grep -rh "# NEX-T" tests/ | sed -n 's/^\([^:]*\):.*# \(NEX-T[^ ]*\).*/\2 \1/p' | sort > all_test_cases.txt
        - name: Get Tests results
          id: get_test_results
          shell: bash
          run: |
            touch test_results_summary.txt
            log_files=("metrics.log" "non_functional.log" "functional_tests.log" "basic_acceptance_tests.log" "ui_tests.log" "unit_tests.log")
            for log_file in "${log_files[@]}"; do
              grep -Erh "NEX-T.*: (PASS|FAIL)" $log_file | sed 's/\(NEX-T[0-9]*\)[^:]*\(: .*\)/\1\2/' >> test_results_summary.txt
            done
            cat test_results_summary.txt | sort -u -o test_results_summary.txt
            cat test_results_summary.txt
        - name: Setup Python
          uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
          with:
            python-version: "3.13"
        - name: Install dependencies
          run: |
            pip install -r tools/test_report/requirements.txt
        - name: Generate Test Results Report
          run: |
            python3 tools/test_report/test_report.py all_test_cases.txt test_results_summary.txt all-tests