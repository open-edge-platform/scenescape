name: "[Code Analysis] License Check"
run-name: "[Code Analysis] License Check"

on:
  workflow_call: {}
  workflow_dispatch: {}

# Only run at most 1 workflow concurrently per PR or per branch to keep costs down.
# Hardcoded prefix so this group is stable when called via workflow_call
# (github.workflow evaluates to the caller's workflow name in reusable workflows).
concurrency:
  group: license-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # needed for actions/checkout

jobs:
  license-compliance-check:
    name: "Run REUSE License Compliance Check"
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout code"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: "REUSE Compliance Check"
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0
