name: "[Tests] Basic Acceptance Tests"
run-name: "[Tests] Basic Acceptance Tests"

on:
  workflow_call: {}
  workflow_dispatch:
    inputs:
      cleanup:
        description: "Cleanup before running BAT tests"
        required: false
        default: false
        type: boolean
      timeout:
        description: "Timeout for the job in minutes"
        required: false
        type: number
        default: 80

# Only run at most 1 workflow concurrently per PR or per branch to keep costs down
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOCKER_BUILDKIT: 1
  SUPASS: test

permissions:
  contents: read

jobs:
  check-pr-state:
    name: "Check PR State"
    runs-on: ubuntu-latest
    outputs:
      pr_state: ${{ steps.check_pr.outputs.pr_state }}
    steps:
      - name: "Return success if triggered manually"
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          echo "Triggered manually."
          exit 0

      - name: Checkout code
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: "Set up GitHub CLI"
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          sudo apt-get update && sudo apt-get install gh

      - name: "Check PR state"
        id: check_pr
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=${{ github.event.number }}
          PR_STATE=$(gh pr view $PR_NUMBER --json isDraft --jq '.isDraft')
          echo "pr_state=$PR_STATE" >> $GITHUB_OUTPUT
          echo "PR State \"isDraft\": $PR_STATE"

  filter:
    name: "Filter Changed Code Paths"
    needs: check-pr-state
    runs-on: ubuntu-latest
    if: ${{ needs.check-pr-state.outputs.pr_state != 'true' || github.event_name == 'workflow_dispatch' }}
    outputs:
      code_changed: ${{ steps.filter.outputs.code }}
      bat_workflow_changed: ${{ steps.filter.outputs.bat_workflow }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set paths filter
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          predicate-quantifier: "every"
          filters: |
            code:
              - '!**/*.md'
              - '!**/*.rst'
              - '!**/*.html'
              - '!**/*.license'
              - '!**/*.svg'
              - '!**/*.png'
              - '!**/*.jpeg'
              - '!**/*.jpg'
              - '!**/*.JPG'
              - '!**/*.ico'
              - '!**/*.pdf'
              - '!LICENSES/**'
              - '!docs/**'
              - '!.github/**'
            bat_workflow:
              - '.github/workflows/tests-bat.yml'

  run-basic-acceptance-tests:
    name: "Run Basic Acceptance Tests"
    runs-on: [bat]
    permissions:
      packages: write # For using GHCR as cache registry
    timeout-minutes: ${{ fromJSON(inputs.timeout || '80') }}
    needs: [filter, check-pr-state]
    if: ${{ (needs.filter.outputs.code_changed == 'true' || needs.filter.outputs.bat_workflow_changed == 'true') && (needs.check-pr-state.outputs.pr_state != 'true' || github.event_name == 'workflow_dispatch') }}
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: "Remove all Docker images"
        if: ${{ github.event.inputs.cleanup == 'true' }}
        uses: ./.github/actions/cleanup
        with:
          system-prune: "true"

      - name: Setup Tests Environment
        id: setup-test-env
        uses: ./.github/actions/setup-tests
        with:
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Run Basic Acceptance Tests (BAT)"
        if: always() && steps.setup-test-env.outcome == 'success'
        run: |
          source tests/.venv/bin/activate
          mkdir -p reports
          pytest tests -m basic_acceptance --junitxml=reports/bat_results.xml --log-level=ERROR

      - name: "Run Unit Tests"
        if: always() && steps.setup-test-env.outcome == 'success'
        run: |
          source tests/.venv/bin/activate
          mkdir -p reports
          pytest tests/sscape_tests/ --junitxml=reports/unit_results.xml --log-level=ERROR

      - name: Run Pipeline Runner tests
        if: always() && steps.setup-test-env.outcome == 'success'
        env:
          GPU_DEVICE_COUNT: 0
          NPU_DEVICE_COUNT: 0
        run: |
          mkdir -p reports
          cd tests/pipeline_runner/
          python3 -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -q -r requirements-ppl-test.txt
          pytest . --junitxml=../../reports/pipeline_runner_results.xml --log-level=ERROR

      - name: Upload Test Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bat-report
          path: |
            **/reports/*.xml

      - name: Cleanup
        if: always()
        uses: ./.github/actions/cleanup

  chart-deployment-test:
    name: "Chart Deployment Test"
    runs-on: [bat]
    permissions:
      packages: write # For using GHCR as cache registry
    env:
      SECRETSDIR: ${{ github.workspace }}/.scenescape-secrets
    needs: [filter, check-pr-state]
    timeout-minutes: 90
    if: ${{ (needs.filter.outputs.code_changed == 'true' || needs.filter.outputs.bat_workflow_changed == 'true') && (needs.check-pr-state.outputs.pr_state != 'true' || github.event_name == 'workflow_dispatch') }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Setup Tests Environment
        id: setup-test-env
        uses: ./.github/actions/setup-tests
        with:
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Install github annotate plugin"
        run: |
          source tests/.venv/bin/activate
          pip install -r .github/resources/requirements-pytest.txt

      - name: "Run k8s tests"
        run: |
          source tests/.venv/bin/activate
          mkdir -p reports
          pytest tests/kubernetes --backend=kubernetes --junitxml=reports/k8s_results.xml --log-level=ERROR

      - name: Upload Test Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: k8s-report
          path: |
            **/reports/*.xml

      - name: Cleanup
        if: always()
        uses: ./.github/actions/cleanup
