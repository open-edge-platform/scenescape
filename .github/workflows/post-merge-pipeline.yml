name: "[CI] Post-merge"
run-name: "[CI] Post-merge"

on:
  push:
    branches:
      - main
      - release-*

# No workflow-level concurrency: it would queue auto-update behind the previous
# (potentially hours-long) post-merge run, leaving open PRs on a stale base.
# Each job is serialized per branch instead; auto-update uses its own
# cancel-in-progress group so it runs right away and the newest push wins.

permissions:
  contents: read

jobs:
  auto-update:
    name: "Auto-update PRs"
    uses: ./.github/workflows/auto-update.yml
    permissions:
      contents: read
      pull-requests: write
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}

  bandit:
    name: "Bandit"
    uses: ./.github/workflows/bandit.yml
    concurrency:
      group: post-merge-bandit-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read

  cache-update:
    name: "Cache Update"
    # Preserve original main-only push trigger
    if: ${{ github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/cache-update.yml
    concurrency:
      group: post-merge-cache-update-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write

  clamav:
    name: "ClamAV"
    uses: ./.github/workflows/clamav.yml
    concurrency:
      group: post-merge-clamav-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read

  codeql:
    name: "CodeQL"
    uses: ./.github/workflows/codeql.yml
    concurrency:
      group: post-merge-codeql-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      security-events: write
      actions: read
      contents: read
      packages: read

  docker-bench-security:
    name: "Docker Bench Security"
    uses: ./.github/workflows/docker-bench-security.yml
    concurrency:
      group: post-merge-docker-bench-security-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read

  gitleaks:
    name: "Gitleaks"
    uses: ./.github/workflows/gitleaks.yml
    concurrency:
      group: post-merge-gitleaks-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read

  license:
    name: "License"
    uses: ./.github/workflows/license.yml
    concurrency:
      group: post-merge-license-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read

  scorecard:
    name: "Scorecard"
    uses: ./.github/workflows/scorecard.yml
    concurrency:
      group: post-merge-scorecard-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      security-events: write
      id-token: write
    secrets:
      SYS_EMF_GH_TOKEN: ${{ secrets.SYS_EMF_GH_TOKEN }}

  tests-all:
    name: "All Tests"
    uses: ./.github/workflows/tests-all.yml
    concurrency:
      group: post-merge-tests-all-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  tracker-service:
    name: "Tracker Service"
    # Preserve original main-only push trigger
    if: ${{ github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/tracker-service.yml
    concurrency:
      group: post-merge-tracker-service-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read

  trivy:
    name: "Trivy"
    uses: ./.github/workflows/trivy.yml
    concurrency:
      group: post-merge-trivy-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read

  zizmor:
    name: "Zizmor"
    uses: ./.github/workflows/zizmor.yml
    concurrency:
      group: post-merge-zizmor-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      security-events: write

  lint:
    name: "Lint"
    uses: ./.github/workflows/lint.yml
    concurrency:
      group: post-merge-lint-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
