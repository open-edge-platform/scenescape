name: "[Updates] Renovate (Tracker Service)"
on:
  schedule:
    # daily
    - cron: "0 2 * * *"

  # allow to manually trigger this workflow
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run Renovate in dry-run mode (no PR)"
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  renovate:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: "Harden the runner (audit all outbound calls)"
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Get token"
        id: get-github-app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          # This secret must contain the GitHub App Client ID, not its numeric App ID.
          client-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PEM }}
          repositories: ${{ github.event.repository.name }}
          owner: ${{ github.repository_owner }}
          # These permissions must also be granted to the installed GitHub App.
          permission-administration: read
          permission-checks: write
          permission-statuses: write
          permission-contents: write
          permission-vulnerability-alerts: read
          permission-issues: write
          permission-metadata: read
          permission-pull-requests: write
          permission-workflows: write

      - name: "Self-hosted Renovate"
        uses: renovatebot/github-action@43b963bf5dd5e57f1f95c59765a018d782870211 # v46.3.11
        with:
          # renovate: datasource=github-releases depName=renovatebot/renovate
          renovate-version: 44.198.3
          configurationFile: .github/renovate.json5
          token: "${{ steps.get-github-app-token.outputs.token }}"
        env:
          LOG_LEVEL: ${{ github.event_name == 'workflow_dispatch' && 'debug' || 'info' }}
          # Dry run if the event is workflow_dispatch AND the dry-run input is true
          RENOVATE_DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.dry-run == 'true') && 'full' || null }}
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # Automerge is opt-in; set RENOVATE_AUTOMERGE_ENABLED to 'true' to enable it.
          RENOVATE_AUTOMERGE: ${{ vars.RENOVATE_AUTOMERGE_ENABLED == 'true' }}
