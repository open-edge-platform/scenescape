name: "Setup Cache Targets"
description: "Setup environment variables for caching image layers"
outputs:
  cache_registry:
    description: "The cache registry path"
    value: ${{ steps.cache.outputs.CACHE_REGISTRY }}
  ghcr_cache:
    description: "Whether GHCR cache is enabled"
    value: ${{ steps.cache.outputs.GHCR_CACHE }}
runs:
  using: "composite"
  steps:
    - name: Setup Docker with containerd storage backend
      shell: bash
      continue-on-error: true
      run: |
        # Merge into the existing config to keep host settings (data-root, log-opts, ...)
        # and restart Docker only when the config actually changes.
        set +e
        sudo python3 - /etc/docker/daemon.json <<'PY'
        import json, os, sys
        path = sys.argv[1]
        cfg = {}
        if os.path.exists(path):
            with open(path) as f:
                raw = f.read().strip()
            cfg = json.loads(raw) if raw else {}
        if cfg.get("features", {}).get("containerd-snapshotter") is True:
            sys.exit(3)
        cfg.setdefault("features", {})["containerd-snapshotter"] = True
        with open(path, "w") as f:
            json.dump(cfg, f, indent=2)
        PY
        rc=$?
        set -e
        case "$rc" in
          0) sudo systemctl restart docker ;;
          3) echo "containerd-snapshotter already enabled, skipping Docker restart" ;;
          *) echo "::warning title=Docker config::Could not update /etc/docker/daemon.json"; exit 1 ;;
        esac
    - name: Setup Cache Targets
      id: cache
      shell: bash
      env:
        TAG_BASE: ${{ github.head_ref || github.ref_name }}
      run: |
        echo "CACHE_REGISTRY=${{ github.repository }}" >> "$GITHUB_OUTPUT"
        echo "GHCR_CACHE=true" >> "$GITHUB_OUTPUT"
