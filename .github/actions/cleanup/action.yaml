name: "Cleanup Action"
description: "Clean runner environment after build/test"
inputs:
  system-prune:
    description: "Whether to run docker system prune"
    required: false
    default: "false"
runs:
  using: "composite"
  steps:
    - name: Remove test_data folder
      if: always()
      shell: bash
      run: |
        sudo rm -rf test_data || true

    - name: "Stop all running Docker containers"
      if: always()
      shell: bash
      run: |
        docker ps -aq | xargs docker rm -f  || true

    - name: "Remove all volumes used in test"
      if: always()
      shell: bash
      run: |
        docker volume ls -q | xargs docker volume rm -f  || true

    - name: "Run docker system prune"
      if: ${{ always() && inputs.system-prune == 'true' }}
      shell: bash
      run: |
        docker system prune --force --volumes --all || true

    - name: "Clean runner"
      if: always()
      shell: bash
      run: |
        sudo git clean -fxd || true

    - name: Reset Docker
      if: always()
      shell: bash
      run: |
        docker context use default
        # Remove all non-default contexts
        docker context ls -q | grep -v '^default$' | while read ctx; do
          echo "Removing context: $ctx"
          docker context rm -f "$ctx" || true
        done
        sudo systemctl daemon-reload
        sudo systemctl restart docker

    - name: Clean up corrupted Docker contexts
      shell: bash
      run: |
        set +e  # Don't fail on errors

        # Remove corrupted context metadata directory
        if [ -d "$HOME/.docker/contexts/meta" ]; then
          find "$HOME/.docker/contexts/meta" -type d -empty -delete 2>/dev/null || true
        fi
