name: "Cleanup Action"
description: "Clean runner environment after build/test"
inputs:
  system-prune:
    description: "Whether to run docker system prune"
    required: false
    default: "false"
runs:
  using: "composite"
  steps:
    - name: "Stop all running Docker containers"
      if: always()
      shell: bash
      run: |
        docker ps -aq | xargs docker rm -f  || true

    - name: "Remove all volumes used in test"
      if: always()
      shell: bash
      run: |
        docker volume ls -q | xargs docker volume rm -f  || true

    - name: "Run docker system prune"
      if: ${{ always() && inputs.system-prune == 'true' }}
      shell: bash
      run: |
        docker system prune --force --volumes --all || true

    - name: "Fix permissions for test_data directories"
      if: always()
      shell: bash
      run: |
        # Fix permissions for test_data directories that may have been created by Docker containers as root
        if [ -d "test_data" ]; then
          echo "Fixing permissions for test_data directories..."
          sudo chown -R $(whoami):$(whoami) test_data/ || true
          sudo chmod -R u+rwx test_data/ || true
        fi

    - name: "Force remove problematic test directories"
      if: always()
      shell: bash
      run: |
        # Force remove test_data directories that commonly cause permission issues
        if [ -d "test_data" ]; then
          echo "Force removing test_data directories..."
          sudo rm -rf test_data/db_add-orphaned-cameras || true
          sudo rm -rf test_data/db_* || true
          rm -rf test_data/ || true
        fi

    - name: "Clean runner"
      if: always()
      shell: bash
      run: |
        git clean -fxd || true
