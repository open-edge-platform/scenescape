name: "Setup Test Environment"
description: "Install Pytest and dependencies for testing, setup Docker, Python and Node.js"
inputs:
  dockerhub-token:
    description: "DockerHub token"
    required: true
  ghcr-token:
    description: "GHCR token"
    required: true
runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0

    - name: "Set up Node.js for Manager UI unit tests"
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "22"
        package-manager-cache: false

    - name: "Log in to DockerHub"
      uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
      continue-on-error: true
      with:
        username: scenescape
        password: ${{ inputs.dockerhub-token }}

    - name: "Log in to GHCR"
      uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
      continue-on-error: true
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.ghcr-token }}

    - name: "Setup Cache Targets"
      id: setup-cache
      uses: ./.github/actions/setup-cache

    - name: "Build common base"
      shell: bash
      env:
        CACHE_REGISTRY: ${{ steps.setup-cache.outputs.cache_registry }}
        GHCR_CACHE: ${{ steps.setup-cache.outputs.ghcr_cache }}
      run: |
        make build-common

    - name: "Build images"
      shell: bash
      env:
        CACHE_REGISTRY: ${{ steps.setup-cache.outputs.cache_registry }}
        GHCR_CACHE: ${{ steps.setup-cache.outputs.ghcr_cache }}
      run: |
        make build-all

    - name: "Download three.js for Manager UI unit tests"
      shell: bash
      run: |
        mkdir -p build/intel
        make -C manager src/manager/static/assets/three.module.js

    - name: "Setup Test Environment"
      shell: bash
      run: |
        make setup-tests

    - name: "Install github annotate plugin"
      shell: bash
      run: |
        source tests/.venv/bin/activate
        pip install -r .github/resources/requirements-pytest.txt
