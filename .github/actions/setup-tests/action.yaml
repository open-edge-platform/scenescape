name: "Setup Test Environment"
description: "Install Pytest and dependencies for testing, setup Docker and Python"
inputs:
  dockerhub-token:
    description: 'DockerHub token'
    required: true
  docker-context:
    description: 'Docker context used in tests'
    required: true
  ghcr-token:
    description: 'GitHub Container Registry token'
    required: true
runs:
  using: "composite"
  steps:
    - name: Ensure Docker daemon config is writable
      shell: bash
      run: |
        sudo mkdir -p /etc/docker
        sudo touch /etc/docker/daemon.json
        sudo chmod 644 /etc/docker/daemon.json

    - name: Set up Docker # Turn on containerd backend during setup
      uses: docker/setup-docker-action@b2189fbf2a6592b51fee7cdd93ee2bfaeba733db # v5
      with:
        context: setup-context
        set-host: true
        daemon-config: |
          {
            "features": {
              "containerd-snapshotter": true
            }
          }

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: "3.12"
        check-latest: true

    - name: "Log in to DockerHub"
      uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
      with:
        username: scenescape
        password: ${{ inputs.dockerhub-token }}

    - name: "Log in to GHCR"
      uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.ghcr-token }}

    - name: Install firefox
      shell: bash
      run: |
        sudo snap remove --purge firefox
        sudo apt purge -y firefox
        sudo apt update
        sudo apt install -y --no-install-recommends \
          wget libpci-dev libnss3-tools xvfb
        sudo install -d -m 0755 /etc/apt/keyrings
        wget -q https://packages.mozilla.org/apt/repo-signing-key.gpg -O- \
          | sudo tee /etc/apt/keyrings/packages.mozilla.org.asc > /dev/null
        echo "deb [signed-by=/etc/apt/keyrings/packages.mozilla.org.asc] https://packages.mozilla.org/apt mozilla main" \
          | sudo tee /etc/apt/sources.list.d/mozilla.list > /dev/null
        echo -e 'Package: *\nPin: origin packages.mozilla.org\nPin-Priority: 1000' \
          | sudo tee /etc/apt/preferences.d/mozilla > /dev/null
        sudo apt update
        sudo apt install -y --no-install-recommends firefox-esr

    - name: Print Firefox version
      shell: bash
      run: |
        which firefox
        firefox --version

    - name: Set Firefox profile
      shell: bash
      run: |
        mkdir -p $HOME/.mozilla/
        cp manager/test/firefox-profile.tar $HOME/.mozilla/
        chmod -R a+rwx $HOME/.mozilla/

    - name: Set up geckodriver
      shell: bash
      run: |
        GECKODRIVER_VERSION=$(curl -sSL --retry 5 --retry-delay 3 https://api.github.com/repos/mozilla/geckodriver/releases/latest | grep '"tag_name":' | sed -E 's/.*"v([^"]+)".*/\1/')
        curl -sSL --retry 5 --retry-delay 3 -o geckodriver.tar.gz \
          "https://github.com/mozilla/geckodriver/releases/download/v${GECKODRIVER_VERSION}/geckodriver-v${GECKODRIVER_VERSION}-linux64.tar.gz"
        tar -xzf geckodriver.tar.gz
        sudo mv geckodriver /usr/local/bin/

    - name: "Setup Cache Targets"
      id: setup-cache
      uses: ./.github/actions/setup-cache

    - name: "Setup Test Environment"
      shell: bash
      env:
        CACHE_REGISTRY: ${{ steps.setup-cache.outputs.cache_registry }}
        CACHE_TAG: ${{ steps.setup-cache.outputs.cache_tag }}
        GITHUB_ACTIONS_CACHE: ${{ steps.setup-cache.outputs.github_actions_cache }}
      run: |
        make && make setup-tests

    - name: "Install github annotate plugin"
      shell: bash
      run: |
        source tests/.venv/bin/activate
        pip install -r .github/resources/requirements-pytest.txt

    - name: Add SceneScape host aliases
      shell: bash
      run: |
        HOST_IP="$(hostname -I | awk '{print $1}')"
        for h in broker.scenescape.intel.com web.scenescape.intel.com autocalibration.scenescape.intel.com vdms.scenescape.intel.com; do
          echo "$HOST_IP $h" | sudo tee -a /etc/hosts > /dev/null
        done
        grep -E 'scenescape.intel.com' /etc/hosts

    - name: Set up Docker # Turn off containerd backend during tests execution
      uses: docker/setup-docker-action@b2189fbf2a6592b51fee7cdd93ee2bfaeba733db # v5
      with:
        context: ${{ inputs.docker-context }}
        set-host: true
        daemon-config: |
          {
            "features": {
              "containerd-snapshotter": false
            }
          }
