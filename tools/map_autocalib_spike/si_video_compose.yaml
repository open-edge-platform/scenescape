# Optional RTSP publishers for Smart Intersection videos.
# UI snapshots do NOT use these — si_snapshot_bridge.py decodes the same
# 1122*_h264.ts files locally (like SI multifilesrc) to avoid mid-GOP
# corruption from joining RTSP.
#
# Uses its own compose project name so `down` cannot tear down the main demo.
#
#   SCENESCAPE_NETWORK=scenescape_scenescape SI_VIDEO_DIR=/path/to/frames \
#     docker compose -p si-video --project-directory . \
#     -f tools/map_autocalib_spike/si_video_compose.yaml up -d

name: si-video

networks:
  scenescape:
    external: true
    name: ${SCENESCAPE_NETWORK:-scenescape_scenescape}

services:
  # Private mediamtx so we do not depend on Retail/Queuing mediaserver.
  si-mediaserver:
    image: bluenviron/mediamtx:1.18.1
    networks:
      scenescape:
        aliases:
          - si-mediaserver
    restart: always
    pids_limit: 100

  si-cam-south:
    image: linuxserver/ffmpeg:version-8.1-cli
    command:
      - -nostdin
      - -hide_banner
      - -loglevel
      - warning
      - -stream_loop
      - "-1"
      - -re
      - -i
      - /workspace/media/1122south_h264.ts
      - -c
      - copy
      - -f
      - rtsp
      - -rtsp_transport
      - tcp
      - rtsp://si-mediaserver:8554/si-camera1
    volumes:
      - ${SI_VIDEO_DIR:-/tmp/smart-intersection-v0/frames}:/workspace/media:ro
    networks:
      scenescape:
    depends_on:
      - si-mediaserver
    restart: always
    pids_limit: 100

  si-cam-west:
    image: linuxserver/ffmpeg:version-8.1-cli
    command:
      - -nostdin
      - -hide_banner
      - -loglevel
      - warning
      - -stream_loop
      - "-1"
      - -re
      - -i
      - /workspace/media/1122west_h264.ts
      - -c
      - copy
      - -f
      - rtsp
      - -rtsp_transport
      - tcp
      - rtsp://si-mediaserver:8554/si-camera2
    volumes:
      - ${SI_VIDEO_DIR:-/tmp/smart-intersection-v0/frames}:/workspace/media:ro
    networks:
      scenescape:
    depends_on:
      - si-mediaserver
    restart: always
    pids_limit: 100

  si-cam-north:
    image: linuxserver/ffmpeg:version-8.1-cli
    command:
      - -nostdin
      - -hide_banner
      - -loglevel
      - warning
      - -stream_loop
      - "-1"
      - -re
      - -i
      - /workspace/media/1122north_h264.ts
      - -c
      - copy
      - -f
      - rtsp
      - -rtsp_transport
      - tcp
      - rtsp://si-mediaserver:8554/si-camera3
    volumes:
      - ${SI_VIDEO_DIR:-/tmp/smart-intersection-v0/frames}:/workspace/media:ro
    networks:
      scenescape:
    depends_on:
      - si-mediaserver
    restart: always
    pids_limit: 100

  si-cam-east:
    image: linuxserver/ffmpeg:version-8.1-cli
    command:
      - -nostdin
      - -hide_banner
      - -loglevel
      - warning
      - -stream_loop
      - "-1"
      - -re
      - -i
      - /workspace/media/1122east_h264.ts
      - -c
      - copy
      - -f
      - rtsp
      - -rtsp_transport
      - tcp
      - rtsp://si-mediaserver:8554/si-camera4
    volumes:
      - ${SI_VIDEO_DIR:-/tmp/smart-intersection-v0/frames}:/workspace/media:ro
    networks:
      scenescape:
    depends_on:
      - si-mediaserver
    restart: always
    pids_limit: 100
