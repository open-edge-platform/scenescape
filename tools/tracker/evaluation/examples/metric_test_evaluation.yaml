# Example configuration for tracker evaluation pipeline
# This configuration chains MetricTestDataset, SceneControllerHarness, and TrackEvalEvaluator

# Dataset configuration
dataset:
  class: datasets.metric_test_dataset.MetricTestDataset
  config:
    # Path to test dataset (relative to evaluation directory)
    data_path: ../../../tests/system/metric/test_data
    # Camera selection (optional, defaults to all cameras)
    cameras: [x1, x2]
    # Camera FPS (optional, defaults to 30)
    camera_fps: 30

# Tracker harness configuration
harness:
  class: harnesses.scene_controller_harness.SceneControllerHarness
  config:
    # Docker container image for scene controller
    container_image: scenescape-controller:2026.0.0-dev
    # Path to tracker configuration file
    tracker_config_path: ../../../tests/system/metric/test_data/tracker-config-time-chunking.json

# Evaluators configuration (currently a single evaluator is supported)
evaluators:
  - class: evaluators.trackeval_evaluator.TrackEvalEvaluator
    config:
      # Metrics to compute
      metrics: [HOTA, MOTA, IDF1]
      # Result folder for metrics output
      result_folder: /tmp/tracker_evaluation_results
