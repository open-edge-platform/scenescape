pipeline:
  run_name: Tracker-Service
  output:
    path: ./output/black-box-evaluation

dataset:
  class: datasets.rolling_terrain_dataset.RollingTerrainDataset
  config:
    data_path: ../../../tests/system/metric/rolling_terrain_dataset
    cameras: [cam_front_left, cam_back_right]
    camera_fps: 20

harness:
  class: harnesses.black_box_harness.BlackBoxHarness
  config:
    broker_image: eclipse-mosquitto:2.1-alpine
    container_type: tracker
    container_image: intel/scenescape-tracker:latest
    tracker_config_path: pipeline_configs/black_box_rolling_terrain/config/tracker_service.json
    # startup_wait_s: 5.0
    # drain_timeout: 5.0
    # Optional observability: capture OTLP metrics via an OTEL Collector sidecar
    enable_metrics: true
    metrics_collector_image: otel/opentelemetry-collector-contrib:0.155.0
    metrics_export_interval_s: 2
    observation_processor:
      enabled: true
      image: intel/scenescape-observation-processor:latest
      mode: full # auto | full | frustum_only (full uses the scene mesh)
      timeout_ms: 40 # 1-100, keep below the chunk interval (50 ms)
      # ready_timeout_s: 60

evaluators:
  - class: evaluators.trackeval_evaluator.TrackEvalEvaluator
    config:
      metrics: [HOTA, MOTA, IDF1]
  - class: evaluators.diagnostic_evaluator.DiagnosticEvaluator
    config:
      metrics: [LOC_T_X, LOC_T_Y, DIST_T]
  - class: evaluators.jitter_evaluator.JitterEvaluator
    config:
      metrics:
        [
          rms_jerk,
          rms_jerk_gt,
          rms_jerk_ratio,
          acceleration_variance,
          acceleration_variance_gt,
          acceleration_variance_ratio,
        ]
