# LLM Query Service with Ollama
# Connects to existing Node-RED and InfluxDB from docker-compose-bussiness-logic.yml
# Run alongside docker-compose-bussiness-logic.yml:
#   docker compose -f docker-compose-bussiness-logic.yml -f docker-compose-llm.yml up

name: scenescape

networks:
  scenescape:
    external: false

services:
  ollama:
    image: ollama/ollama:latest
    container_name: scenescape-ollama
    networks:
      - scenescape
    ports:
      - "11434:11434"
    volumes:
      - vol-ollama-models:/root/.ollama
      - ./sample_data/ollama-models:/models:ro
    environment:
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_NUM_THREADS=4
      - http_proxy=${http_proxy}
      - https_proxy=${https_proxy}
      - no_proxy=${no_proxy},influxdb2,node-red,llm-query-service,localhost,127.0.0.1,.scenescape.intel.com
      - HTTP_PROXY=${HTTP_PROXY}
      - HTTPS_PROXY=${HTTPS_PROXY}
      - NO_PROXY=${NO_PROXY},influxdb2,node-red,llm-query-service,localhost,127.0.0.1,.scenescape.intel.com
    entrypoint: ["/bin/sh", "-c", "if [ -d /models/manifests ] && [ ! -f /root/.ollama/models/.copied ]; then mkdir -p /root/.ollama/models/blobs /root/.ollama/models/manifests && cp -r /models/blobs/* /root/.ollama/models/blobs/ 2>/dev/null || true && cp -r /models/manifests/* /root/.ollama/models/manifests/ 2>/dev/null || true && touch /root/.ollama/models/.copied; fi && ollama serve"]
    restart: unless-stopped

  llm-query-service:
    build:
      context: ./llm-query-service
      args:
        - http_proxy=${http_proxy}
        - https_proxy=${https_proxy}
        - no_proxy=${no_proxy}
        - HTTP_PROXY=${HTTP_PROXY}
        - HTTPS_PROXY=${HTTPS_PROXY}
        - NO_PROXY=${NO_PROXY}
    image: llm-query-service:latest
    container_name: scenescape-llm-query-service
    networks:
      - scenescape
    ports:
      - "5000:5000"
    environment:
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=mistral
      - INFLUX_BUCKET=SS-Anthem
      - SERVICE_TIMEOUT=60
      - http_proxy=${http_proxy}
      - https_proxy=${https_proxy}
      - no_proxy=${no_proxy},influxdb2,node-red,ollama,localhost,127.0.0.1,.scenescape.intel.com
      - HTTP_PROXY=${HTTP_PROXY}
      - HTTPS_PROXY=${HTTPS_PROXY}
      - NO_PROXY=${NO_PROXY},influxdb2,node-red,ollama,localhost,127.0.0.1,.scenescape.intel.com
    depends_on:
      - ollama
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  vol-ollama-models:
    driver: local
