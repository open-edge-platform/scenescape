{% extends 'sscape/base.html' %}
{% block content %}
  <div class="page-header">
    <h2 class="form-title">Scenes</h2>
    <div class="page-header-actions">
      <a class="btn btn-primary" href="{% url 'scene_create' %}">+ New Scene</a>
    </div>
  </div>

  <div class="ss-table-card">
    {% if object_list %}
      <table class="table table-fluid">
        <thead>
          <tr>
            <th>Scene</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          {% for Scene in object_list %}
            <tr>
              <td>{{ Scene }}</td>
              <td>
                <div class="ss-table-actions">
                  <a
                    class="ss-table-action"
                    href="{% url 'scene_detail' Scene.id %}"
                    >View</a
                  >
                  <a
                    class="ss-table-action"
                    href="/{{ Scene.id }}/?ss=scene-manage"
                    >Edit</a
                  >
                  <a
                    class="ss-table-action is-danger"
                    href="{% url 'scene_delete' Scene.id %}"
                    >Delete</a
                  >
                </div>
              </td>
            </tr>
          {% endfor %}
        </tbody>
      </table>
    {% else %}
      <p class="ss-table-empty">No scenes are available.</p>
    {% endif %}
  </div>
{% endblock %}
