{% extends 'sscape/base.html' %}

{% block content %}
  <nav aria-label="breadcrumb">
    <ol class="breadcrumb">
      <li class="breadcrumb-item">
        <a href="/">Scenes</a>
      </li>
      <li class="breadcrumb-item active" aria-current="page">New Scene</li>
    </ol>
  </nav>

  <div class="page-header">
    <h2 class="form-title">Import Scene</h2>
  </div>

  <div id="importSceneForm" class="ss-form-card">
    <div class="ss-form-body">
      <div
        id="top-error-list"
        class="alert alert-danger"
        style="display: none;"
      >
        <ul class="errorlist" id="global-error-list">
          <!-- Errors will be populated here -->
        </ul>
      </div>
      <div
        id="top-warning-list"
        class="alert alert-warning"
        style="display: none;"
      >
        <ul class="warninglist" id="global-warning-list">
          <!-- Warnings will be populated here -->
        </ul>
      </div>
      <form enctype="multipart/form-data" method="post">
        {% csrf_token %}
        {% for field in form %}
          <div class="form-group row" id="{{ field.name }}_wrapper">
            <label
              class="col-sm-2 col-form-label"
              id="label_{{ field.name }}"
              for="id_{{ field.name }}"
              >{{ field.label }}</label
            >
            <div class="col-sm-10">
              {{ field.errors }}
              {{ field }}
            </div>
          </div>
        {% endfor %}

        <div class="form-group row ss-form-actions" id="save_scene_create">
          <div class="col-sm-2"></div>
          <div class="col-sm-10">
            <div class="ss-form-actions-inner">
              <input
                class="btn btn-primary"
                id="scene-import"
                type="submit"
                value="Import"
              />
              <div
                id="import-spinner"
                class="text-center"
                style="display: none;"
              >
                <div
                  class="spinner-border text-primary"
                  role="status"
                  aria-hidden="true"
                ></div>
                <div>Importing please wait...</div>
              </div>
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>

  <input
    type="hidden"
    name="auth-token"
    id="auth-token"
    value="{{ user.auth_token }}"
  />
{% endblock %}
