{% extends 'sscape/base.html' %}
{% block content %}
  <nav aria-label="breadcrumb">
    <ol class="breadcrumb">
      <li class="breadcrumb-item">
        <a href="{% url 'radar_list' %}">Radars</a>
      </li>
      <li class="breadcrumb-item active" aria-current="page">New Radar</li>
    </ol>
  </nav>

  <div class="card width-100">
    <h5 class="noselect card-header">New Radar</h5>
    <div class="card-body">
      <form method="post">
        {% csrf_token %}
        {% for field in form %}
          <div class="form-group row">
            <label
              class="col-sm-2 col-form-label"
              for="id_{{ field.name }}"
              >{{ field.label }}</label
            >
            <div class="col-sm-10">{{ field.errors }} {{ field }}</div>
          </div>
        {% endfor %}
        <div class="form-group row">
          <div class="col-sm-2"></div>
          <div class="col-sm-10">
            <input class="btn btn-primary" type="submit" value="Add New Radar" />
            <p class="text-muted mt-2 mb-0">
              Set scene pose (translation / rotation) via the REST API after create.
              See the radar how-to guide.
            </p>
          </div>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
