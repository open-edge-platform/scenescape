{% extends 'sscape/base.html' %}

{% block content %}
  <nav aria-label="breadcrumb">
    <ol class="breadcrumb">
      <li class="breadcrumb-item">
        <a href="{% url 'asset_list' %}">Object Library</a>
      </li>
      <li class="breadcrumb-item active" aria-current="page">
        {{ object.name }}
      </li>
    </ol>
  </nav>

  <div class="page-header">
    <h2 class="form-title">Update Object</h2>
    <div class="page-header-actions">
      <a
        class="ss-table-action is-danger"
        href="{% url 'asset_delete' object.id %}"
        title="Delete"
        ><i class="bi bi-trash"></i><span>Delete</span></a
      >
    </div>
  </div>

  <div id="assetUpdateForm" class="ss-form-card">
    <div class="ss-form-body">
      <form enctype="multipart/form-data" method="post" id="asset_update_form">
        {% csrf_token %}
        {% for field in form %}
          <div class="form-group row" id="{{ field.name }}_wrapper">
            <label
              class="col-sm-2 col-form-label"
              id="label_{{ field.name }}"
              for="id_{{ field.name }}"
              >{{ field.label }}</label
            >
            <div class="col-sm-10">
              {{ field.errors }}
              {{ field }}
            </div>
          </div>
        {% endfor %}
        <div class="form-group row ss-form-actions" id="save_asset">
          <div class="col-sm-2"></div>
          <div class="col-sm-10">
            <div class="ss-form-actions-inner">
              <input
                class="btn btn-primary"
                type="submit"
                value="Update Object"
              />
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
