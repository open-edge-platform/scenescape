{% extends 'sscape/base.html' %}

{% block content %}
  <nav aria-label="breadcrumb">
    <ol class="breadcrumb">
      <li class="breadcrumb-item">
        <a href="{% url 'asset_list' %}">Object Library</a>
      </li>
      <li class="breadcrumb-item active" aria-current="page">Delete</li>
    </ol>
  </nav>

  <div class="page-header">
    <h2 class="form-title">Delete Object</h2>
  </div>

  <div class="ss-form-card">
    <div class="ss-form-body">
      <form enctype="multipart/form-data" method="post">
        {% csrf_token %}
        <div class="form-group row">
          <div class="col-sm-2"></div>
          <div class="col-sm-10">
            <p class="ss-form-confirm">
          Are you sure you want to delete the "{{ object }}" object?
        </p>
          </div>
        </div>
        <div class="form-group row ss-form-actions">
          <div class="col-sm-2"></div>
          <div class="col-sm-10">
            <div class="ss-form-actions-inner">
              <input
                class="btn btn-outline-danger"
                type="submit"
                value="Yes, Delete the Object!"
              />
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
