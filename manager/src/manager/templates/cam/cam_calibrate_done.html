<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Calibration saved</title>
  </head>
  <body>
    <p>Calibration saved.</p>
    <script>
      if (window.parent && window.parent !== window) {
        window.parent.postMessage(
          { type: "ss-calibrate-done", reload: {{ reload|yesno:"true,false" }} },
          window.location.origin,
        );
      } else {
        window.location.href = "/";
      }
    </script>
  </body>
</html>
