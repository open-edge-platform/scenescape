<div
  class="modal fade"
  id="scene-qr-modal"
  tabindex="-1"
  role="dialog"
  aria-labelledby="scene-qr-title"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="scene-qr-title">Scene QR Code</h5>
        <button
          type="button"
          class="close"
          data-dismiss="modal"
          aria-label="Close"
        >
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body text-center">
        <div id="scene-qr-image" class="scene-qr-image"></div>
        <p class="text-muted small mt-3 mb-1">
          Scan with the Scenescape app.
        </p>
        <code id="scene-qr-uri" class="d-block text-break small"></code>
      </div>
    </div>
  </div>
</div>
