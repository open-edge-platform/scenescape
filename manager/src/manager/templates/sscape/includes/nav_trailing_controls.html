{% load static %}
<div class="ss-theme-toggle-host">
  <div
    class="ss-theme-toggle"
    id="ss-theme-toggle"
    role="group"
    aria-label="Color theme"
  >
    <button
      type="button"
      class="ss-theme-toggle__btn"
      data-ss-theme="light"
      aria-pressed="true"
    >
      Light
    </button>
    <button
      type="button"
      class="ss-theme-toggle__btn"
      data-ss-theme="dark"
      aria-pressed="false"
    >
      Dark
    </button>
  </div>
</div>

<a
  class="navbar-powered-by"
  href="https://www.intel.com/"
  target="_blank"
  rel="noopener noreferrer"
  title="Powered by Intel"
>
  <span class="powered-by-label">Powered by</span>
  <img
    class="intel-logo"
    src="{% static 'images/intel-logo.svg' %}"
    alt="Intel"
  />
</a>
