<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Calibration saved</title>
  </head>
  <body data-ss-reload="{{ reload|yesno:'true,false' }}">
    <p>Calibration saved.</p>
    <script>
      if (window.parent && window.parent !== window) {
        window.parent.postMessage(
          {
            type: "ss-calibrate-done",
            reload: document.body.dataset.ssReload === "true",
          },
          window.location.origin,
        );
      } else {
        window.location.href = "/";
      }
    </script>
  </body>
</html>
