networks:
  scenescape:

secrets:
  influxdb2-admin-username:
    file: ${SECRETSDIR}/influxdb2/influxdb2-admin-username
  influxdb2-admin-password:
    file: ${SECRETSDIR}/influxdb2/influxdb2-admin-password
  influxdb2-admin-token:
    file: ${SECRETSDIR}/influxdb2/influxdb2-admin-token
  root-cert:
    file: ${SECRETSDIR}/certs/scenescape-ca.pem
  broker-cert:
    file: ${SECRETSDIR}/certs/scenescape-broker.crt
  broker-key:
    file: ${SECRETSDIR}/certs/scenescape-broker.key

volumes:
  influxdb2-data:
  influxdb2-config:
  grafana-storage:
