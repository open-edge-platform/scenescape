          name: camera
          schema:
            type: string
          description: Camera ID
          required: true
        - in: query
          name: timestamp
          schema:
            type: string
          description: ISO timestamp (required for frame)
        - in: query
          name: type
          schema:
            type: string
          description: Frame type filter
      tags:
      - frame
      security:
        - tokenAuth: []
      responses:
        "200":
          description: Frame data or video file
        "404":
          description: Not found
        "503":
