  /database-ready:
    get:
      tags:
        - auth
      operationId: database_ready_retrieve
      summary: Check if the database is ready
      description: >-
        **Internal use only.** Used by services during startup to poll for
        database readiness before making API requests.
      x-internal: true
      security: []
      responses:
        "200":
          description: Database is ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  databaseReady:
                    type: boolean
        "503":
          description: Database not ready or unreachable
          content:
            application/json:
              schema:
                type: object
                properties:
                  databaseReady:
                    type: boolean
        "404":
          description: Not found
        "401":
          description: Unauthorized
  /calculateintrinsics:
    post:
      tags:
        - camera
      operationId: calculate_intrinsics_create
      summary: Calculate camera intrinsics from point correspondences
      description: >-
        **Internal use only.** Called during manual camera
        calibration to compute intrinsic parameters from point correspondences.
      x-internal: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mapPoints:
                  type: array
                  items:
                    type: array
                    items:
                      type: number
                      format: float
                  description: 3D world points (minimum 4)
                camPoints:
                  type: array
                  items:
                    type: array
                    items:
                      type: number
                      format: float
                  description: Corresponding 2D image points (must match mapPoints count)
                intrinsics:
                  type: array
                  items:
                    type: array
                    items:
                      type: number
                      format: double
                  description: Initial 3x3 camera intrinsics matrix
                distortion:
                  type: array
                  items:
                    type: number
                    format: double
                  description: Initial distortion coefficients
                imageSize:
                  type: array
                  items:
                    type: integer
                  description: Image dimensions [width, height]
                fixIntrinsics:
                  type: object
                  description: Map of intrinsic parameter names to fix during calibration (e.g. fx, fy, cx, cy, k1, k2, k3, p1, p2)
                  additionalProperties:
                    type: boolean
              required:
                - mapPoints
                - camPoints
                - intrinsics
                - distortion
                - imageSize
      security:
        - tokenAuth: []
      responses:
        "200":
          description: Intrinsics calculated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  euler:
                    type: array
                    items:
                      type: number
                      format: double
                    description: Camera rotation as Euler angles [X, Y, Z] in radians
                  position:
                    type: array
                    items:
                      type: number
                      format: double
                    description: Camera position [x, y, z]
                  mtx:
                    type: array
                    items:
                      type: array
                      items:
                        type: number
                        format: double
                    description: Calibrated 3x3 camera matrix
                  dist:
                    type: array
                    items:
                      type: array
                      items:
                        type: number
                        format: double
                    description: Calibrated distortion coefficients
        "400":
          description: Invalid input (mismatched point counts, fewer than 4 points, or calculation error)
        "401":
          description: Unauthorized
  /aclcheck:
    post:
      tags:
        - auth
      operationId: acl_check_create
      summary: Check MQTT ACL permissions for a user and topic
      description: >-
        **Internal use only.** Called by the Mosquitto MQTT broker to enforce
        per-topic access control. Not intended for direct use by API consumers.
      x-internal: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: Username to check ACL for
                topic:
                  type: string
                  description: MQTT topic to check access against
                acc:
                  type: integer
                  description: Requested access level (1=read, 2=write, 3=read+write, 4=subscribe)
              required:
                - username
                - topic
                - acc
      security: []
      responses:
        "200":
          description: Access allowed
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    enum:
                      - allow
                  acc:
                    type: integer
        "400":
          description: Missing required parameters
        "403":
          description: Access denied
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    enum:
                      - deny
        "401":
          description: Unauthorized
  /import-scene:
    post:
      tags:
        - scene
      operationId: import_scene_create
      summary: Import a scene from a ZIP archive
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                zipFile:
                  type: string
                  format: binary
              required:
                - zipFile
        required: true
      security:
        - tokenAuth: []
      responses:
        "201":
          description: Scene imported successfully
        "400":
          description: Missing or invalid zip file
        "401":
          description: Unauthorized
        "405":
          description: Method not allowed
        "500":
          description: Internal server error
  /save-geospatial-snapshot:
    post:
      tags:
        - scene
      operationId: save_geospatial_snapshot_create
      summary: Save a geospatial map snapshot as PNG
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                image_data:
                  type: string
                  description: Base64-encoded PNG image (data URL or raw base64)
              required:
                - image_data
        required: true
      security:
        - tokenAuth: []
      responses:
        "200":
          description: Snapshot saved successfully
          content:
            text/html:
              schema:
                type: string
        "400":
          description: Missing or invalid image data
        "405":
          description: Method not allowed
        "500":
          description: Internal server error
        "401":
          description: Unauthorized
components:
  schemas:
    AccessEnum:
      enum:
        - 0
        - 1
        - 2
        - 3
      type: integer
      description: |-
        * `0` - No access
        * `1` - Read only
        * `2` - Write only
        * `3` - Read and Write
    AreaEnum:
      enum:
        - scene
        - circle
        - poly
      type: string
      description: |-
        * `scene` - scene
        * `circle` - circle
        * `poly` - poly
    Asset3D:
      type: object
      properties:
        uid:
          type: string
          readOnly: true
        name:
          type: string
          maxLength: 150
        x_size:
          type: number
          format: double
          minimum: 0.0
          default: 1.0
          title: Object size in x-axis
        y_size:
          type: number
          format: double
          minimum: 0.0
          default: 1.0
          title: Object size in y-axis
        z_size:
          type: number
          format: double
          minimum: 0.0
          default: 1.0
          title: Object size in z-axis
        tracking_radius:
          type: number
          format: double
          default: 2.0
          title: Tracking radius (meters)
        shift_type:
          oneOf:
            - $ref: "#/components/schemas/ShiftTypeEnum"
            - $ref: "#/components/schemas/NullEnum"
          default: 1
        mark_color:
          type: string
          maxLength: 20
          default: "#888888"
        model_3d:
          type: string
          format: uri
          nullable: true
          pattern: (?:glb)$
        scale:
          type: number
          format: double
          nullable: true
          default: 1.0
        project_to_map:
          oneOf:
            - $ref: "#/components/schemas/OutputLlaEnum"
            - $ref: "#/components/schemas/NullEnum"
          default: false
        rotation_from_velocity:
          oneOf:
            - $ref: "#/components/schemas/OutputLlaEnum"
            - $ref: "#/components/schemas/NullEnum"
          default: false
        rotation_x:
          type: number
          format: double
          nullable: true
          default: 0.0
          title: X Rotation (degrees)
        rotation_y:
          type: number
          format: double
          nullable: true
          default: 0.0
          title: Y Rotation (degrees)
        rotation_z:
          type: number
          format: double
          nullable: true
          default: 0.0
          title: Z Rotation (degrees)
        translation_x:
          type: number
          format: double
          nullable: true
          default: 0.0
          title: X Translation (meters)
        translation_y:
          type: number
          format: double
          nullable: true
          default: 0.0
          title: Y Translation (meters)
        translation_z:
          type: number
          format: double
          nullable: true
          default: 0.0
          title: Z Translation (meters)
        x_buffer_size:
          type: number
          format: double
          default: 0.0
          title: Object buffer size in x-axis
        y_buffer_size:
          type: number
          format: double
          default: 0.0
          title: Object buffer size in y-axis
        z_buffer_size:
          type: number
          format: double
          default: 0.0
          title: Object buffer size in z-axis
        geometric_center:
          type: array
          items:
            type: number
            format: double
          nullable: true
          default: [0.0, 0.0, 0.0]
          description: Geometric center offset [x, y, z] in meters from bottom center
        mass:
          type: number
          format: double
          minimum: 0.0
          nullable: true
          default: 1.0
          title: Mass (kg)
        center_of_mass:
          type: array
          items:
            type: number
            format: double
          nullable: true
          default: [0.0, 0.0, 0.0]
          description: Center of mass offset [x, y, z] in meters from geometric center
        is_static:
          description: |-
            Whether object can move on its own

            * `True` - Yes
            * `False` - No
          oneOf:
            - $ref: "#/components/schemas/OutputLlaEnum"
            - $ref: "#/components/schemas/NullEnum"
          default: false
        ttl:
          type: number
          format: double
          minimum: 0.0
          nullable: true
          default: 0.0
          title: Time to Live (seconds)
          description: Time to live for track expiration (0 = infinite)
        linear_damping:
          type: number
          format: double
          maximum: 1.0
          minimum: 0.0
          nullable: true
          default: 0.05
          description: Resistance to linear motion (0.0 - 1.0)
        angular_damping:
          type: number
          format: double
          maximum: 1.0
          minimum: 0.0
          nullable: true
          default: 0.05
          description: Resistance to angular motion (0.0 - 1.0)
        coefficient_of_restitution:
          type: number
          format: double
          maximum: 1.0
          minimum: 0.0
          nullable: true
          default: 0.5
          description: Bounciness for collisions (0.0 - 1.0)
        friction_coefficients:
          type: array
          items:
            type: number
            format: double
          nullable: true
          default: [0.5, 0.4]
          description: Friction coefficients [static, dynamic]
      required:
        - name
    AuthTokenResponse:
      type: object
      properties:
        token:
          type: string
      required:
        - token
    BlankEnum:
      enum:
        - ""
    CalibrationMarker:
      type: object
      properties:
        marker_id:
          type: string
          maxLength: 50
        apriltag_id:
          type: string
          maxLength: 10
