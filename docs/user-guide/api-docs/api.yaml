      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: "#/components/schemas/Region"
    PaginatedSceneList:
      type: object
      required:
        - count
        - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: "#/components/schemas/Scene"
    PaginatedSingletonList:
      type: object
      required:
        - count
        - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: "#/components/schemas/Singleton"
    PaginatedTripwireList:
      type: object
      required:
        - count
        - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: "#/components/schemas/Tripwire"
    PaginatedUserList:
      type: object
      required:
        - count
        - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: "#/components/schemas/User"
    PubSubACL:
      type: object
      properties:
        topic:
          $ref: "#/components/schemas/TopicEnum"
        access:
          allOf:
            - $ref: "#/components/schemas/AccessEnum"
          default: 0
      required:
        - topic
    Region:
      type: object
      properties:
        uid:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 150
        points:
          type: array
          items:
            type: number
            format: double
        scene:
          type: string
          format: uuid
        buffer_size:
          type: number
          format: double
          minimum: 0
          default: 0.0
        height:
          type: number
          format: double
          minimum: 0.001
          default: 1.0
        volumetric:
          oneOf:
            - $ref: "#/components/schemas/OutputLlaEnum"
            - $ref: "#/components/schemas/NullEnum"
          default: false
        color_ranges:
          $ref: "#/components/schemas/RegionOccupancyThreshold"
      required:
        - name
        - points
        - scene
    RegionOccupancyThreshold:
      type: object
      properties:
        sectors: {}
        range_max:
          type: integer
      required:
        - range_max
        - sectors
    Scene:
      type: object
      properties:
        uid:
          type: string
          nullable: true
          readOnly: true
        name:
          type: string
          maxLength: 150
        map_type:
          oneOf:
            - $ref: "#/components/schemas/MapTypeEnum"
            - $ref: "#/components/schemas/NullEnum"
          default: map_upload
        use_tracker:
          $ref: "#/components/schemas/OutputLlaEnum"
          default: true
        output_lla:
          title: Output geospatial coordinates
          oneOf:
            - $ref: "#/components/schemas/OutputLlaEnum"
            - $ref: "#/components/schemas/NullEnum"
          default: false
        trs_matrix:
          type: array
          nullable: true
          items:
            type: array
            items:
              type: number
              format: double
          readOnly: true
        map_corners_lla:
          type: array
          nullable: true
          title: Geospatial coordinates of the four map corners in JSON format
          description: |-
            Provide the array of four map corners geospatial coordinates (lat, long, alt).
            Required only if 'Output geospatial coordinates' is set to `Yes`.
            Expected order: starting from the bottom-left corner counterclockwise.
            Expected JSON format: '[ [lat1, lon1, alt1], [lat2, lon2, alt2], [lat3, lon3, alt3], [lat4, lon4, alt4] ]'
        map:
          type: string
          format: uri
          nullable: true
          title: Scene map as .glb or .ply or image or .zip or video
          pattern: (?:glb|png|jpeg|jpg|zip|ply|mp4|mov|mkv|webm|avi)$
        thumbnail:
          type: string
          format: uri
          readOnly: true
          nullable: true
        cameras:
          type: array
          items:
            $ref: "#/components/schemas/Cam"
          readOnly: true
        sensors:
          type: array
          items:
            $ref: "#/components/schemas/Singleton"
          readOnly: true
        regions:
          type: array
          items:
            $ref: "#/components/schemas/Region"
        tripwires:
          type: array
          items:
            $ref: "#/components/schemas/Tripwire"
        parent:
          type: string
          format: uuid
        transform:
          type: object
          additionalProperties: {}
        mesh_translation:
          type: array
          items:
            type: number
            format: double
          readOnly: true
        mesh_rotation:
          type: array
          items:
            type: number
            format: double
          readOnly: true
        mesh_scale:
          type: array
          items:
            type: number
            format: double
          readOnly: true
        scale:
          type: number
          format: double
          minimum: 4.9e-324
          nullable: true
          title: Pixels per meter
        children:
          type: array
          items:
            $ref: "#/components/schemas/ChildScene"
          readOnly: true
        regulated_rate:
          type: number
          format: double
          minimum: 0.001
          default: 30
          title: Regulate Rate (Hz)
        external_update_rate:
          type: number
          format: double
          minimum: 0.001
          default: 30
          title: Max External Update Rate (Hz)
        camera_calibration:
          allOf:
            - $ref: "#/components/schemas/CameraCalibrationEnum"
          default: Manual
          title: Calibration Type
        apriltag_size:
          type: number
          format: double
          nullable: true
          default: 0.162
          title: AprilTag Size (meters)
        map_processed:
          type: string
          format: date-time
          nullable: true
        polycam_data:
          type: string
          format: uri
          nullable: true
          pattern: (?:zip)$
        number_of_localizations:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
          default: 50
        global_feature:
          type: string
          default: netvlad
          title: Global Feature Matching Algorithm
          maxLength: 200
        local_feature:
          type: string
          nullable: true
          default: '{"sift": {}}'
        matcher:
          type: string
          nullable: true
          default: '{"NN-ratio": {}}'
        minimum_number_of_matches:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
          default: 20
        inlier_threshold:
          type: number
          format: double
          minimum: 0.0
          default: 0.5
          title: Feature Match Confidence Threshold
        geospatial_provider:
          title: Geospatial Map Provider
          description: |-
            The map provider used for geospatial maps (google or mapbox)

            * `google` - Google Maps
            * `mapbox` - Mapbox
          oneOf:
            - $ref: "#/components/schemas/GeospatialProviderEnum"
            - $ref: "#/components/schemas/BlankEnum"
            - $ref: "#/components/schemas/NullEnum"
          default: google
        map_zoom:
          type: number
          format: double
          minimum: 0.0
          nullable: true
          default: 15.0
          title: Map Zoom Level
          description: Zoom level for the geospatial map view
        map_center_lat:
          type: number
          format: double
          nullable: true
          title: Map Center Latitude
          description: Center latitude for the geospatial map view
        map_center_lng:
          type: number
          format: double
          nullable: true
          title: Map Center Longitude
          description: Center longitude for the geospatial map view
        map_bearing:
          type: number
          format: double
          nullable: true
          default: 0.0
          title: Map Bearing/Rotation (degrees)
          description: Rotation angle for the geospatial map view in degrees
      required:
        - name
    ShiftTypeEnum:
      enum:
        - 1
        - 2
      type: integer
      description: |-
        * `1` - Type 1 (default)
        * `2` - Type 2 (may work better for wide and short objects)
    Singleton:
      type: object
      properties:
        uid:
          type: string
          readOnly: true
        scene:
          type: string
          format: uuid
          nullable: true
        sensor_id:
          type: string
          maxLength: 20
        name:
          type: string
          maxLength: 150
        area:
          $ref: "#/components/schemas/AreaEnum"
          default: scene
        points:
          type: array
          items:
            type: number
            format: double
        radius:
          type: number
          format: double
          nullable: true
        center:
          type: array
          items:
            type: number
            format: double
          nullable: true
        translation:
          type: array
          items:
            type: number
            format: double
          readOnly: true
        singleton_type:
          allOf:
            - $ref: "#/components/schemas/SingletonTypeEnum"
          default: environmental
          title: Type of Sensor
        color_ranges:
          $ref: "#/components/schemas/SingletonScalarThreshold"
      required:
        - name
    SingletonScalarThreshold:
      type: object
      properties:
        sectors: {}
        range_max:
          type: integer
      required:
        - range_max
        - sectors
    SingletonTypeEnum:
      enum:
        - environmental
        - attribute
      type: string
      description: |-
        * `environmental` - environmental
        * `attribute` - attribute
    TopicEnum:
      enum:
        - CHANNEL
        - CMD_CAMERA
        - CMD_DATABASE
        - CMD_KUBECLIENT
        - CMD_SCENE_UPDATE
        - DATA_AUTOCALIB_CAM_POSE
        - DATA_CAMERA
        - DATA_EXTERNAL
        - DATA_REGION
        - DATA_REGULATED
        - DATA_SCENE
        - DATA_SENSOR
        - EVENT
        - IMAGE_CALIBRATE
        - IMAGE_CAMERA
        - SYS_CHILDSCENE_STATUS
        - ANALYTICS_CLUSTERS
      type: string
      description: |-
        * `CHANNEL` - CHANNEL
        * `CMD_CAMERA` - CMD_CAMERA
        * `CMD_DATABASE` - CMD_DATABASE
        * `CMD_KUBECLIENT` - CMD_KUBECLIENT
        * `CMD_SCENE_UPDATE` - CMD_SCENE_UPDATE
        * `DATA_AUTOCALIB_CAM_POSE` - DATA_AUTOCALIB_CAM_POSE
        * `DATA_CAMERA` - DATA_CAMERA
        * `DATA_EXTERNAL` - DATA_EXTERNAL
        * `DATA_REGION` - DATA_REGION
        * `DATA_REGULATED` - DATA_REGULATED
        * `DATA_SCENE` - DATA_SCENE
        * `DATA_SENSOR` - DATA_SENSOR
        * `EVENT` - EVENT
        * `IMAGE_CALIBRATE` - IMAGE_CALIBRATE
        * `IMAGE_CAMERA` - IMAGE_CAMERA
        * `SYS_CHILDSCENE_STATUS` - SYS_CHILDSCENE_STATUS
        * `ANALYTICS_CLUSTERS` - ANALYTICS_CLUSTERS
    TransformTypeEnum:
      enum:
        - matrix
        - euler
        - quaternion
      type: string
      description: |-
        * `matrix` - Matrix
        * `euler` - Euler Angles
        * `quaternion` - Quaternion
    Tripwire:
      type: object
      properties:
        uid:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 150
        points:
          type: array
          items:
            type: number
            format: double
        height:
          type: number
          format: double
          default: 1.0
        scene:
          type: string
          format: uuid
      required:
        - name
        - points
        - scene
    User:
      type: object
      properties:
        uid:
          type: string
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_ only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        password:
          type: string
          writeOnly: true
          maxLength: 128
        is_active:
          type: boolean
          default: true
          title: Active
          description: Designates whether this user should be treated as active. Unselect this instead of deleting accounts.
        is_staff:
          type: boolean
          default: false
          title: Staff status
          description: Designates whether the user can log into this admin site.
        is_superuser:
          type: boolean
          default: false
          title: Superuser status
          description: Designates that this user has all permissions without explicitly assigning them.
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        acls:
          type: array
          items:
            $ref: "#/components/schemas/PubSubACL"
      required:
        - password
        - username
  securitySchemes:
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
