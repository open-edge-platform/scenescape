        rotation_y:
          type: number
          format: double
          nullable: true
          title: Y Rotation (degrees)
        rotation_z:
          type: number
          format: double
          nullable: true
          title: Z Rotation (degrees)
        translation_x:
          type: number
          format: double
          nullable: true
          title: X Translation (meters)
        translation_y:
          type: number
          format: double
          nullable: true
          title: Y Translation (meters)
        translation_z:
          type: number
          format: double
          nullable: true
          title: Z Translation (meters)
        x_buffer_size:
          type: number
          format: double
          title: Object buffer size in x-axis
        y_buffer_size:
          type: number
          format: double
          title: Object buffer size in y-axis
        z_buffer_size:
          type: number
          format: double
          title: Object buffer size in z-axis
        geometric_center:
          type: array
