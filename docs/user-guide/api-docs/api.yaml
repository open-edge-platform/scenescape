              $ref: "#/components/schemas/CustomAuthToken"
          application/json:
            schema:
              $ref: "#/components/schemas/CustomAuthToken"
        required: true
      security: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
          description: ""
        "400":
          description: Invalid credentials
