components:
  schemas:
    AccessEnum:
      enum:
      - 0
      - 1
      - 2
      - 3
      type: integer
      description: |-
        * `0` - No access
        * `1` - Read only
        * `2` - Write only
        * `3` - Read and Write
    AreaEnum:
      enum:
      - scene
      - circle
      - poly
      type: string
      description: |-
        * `scene` - scene
        * `circle` - circle
        * `poly` - poly
    Asset3D:
      type: object
      properties:
        uid:
          type: string
        name:
          type: string
          maxLength: 150
        x_size:
          type: number
          format: double
          minimum: 0.0
          title: Object size in x-axis
        y_size:
          type: number
          format: double
          minimum: 0.0
          title: Object size in y-axis
        z_size:
          type: number
          format: double
          minimum: 0.0
          title: Object size in z-axis
        tracking_radius:
          type: number
          format: double
          title: Tracking radius (meters)
        shift_type:
          nullable: true
          minimum: -2147483648
          maximum: 2147483647
          oneOf:
          - $ref: '#/components/schemas/ShiftTypeEnum'
          - $ref: '#/components/schemas/NullEnum'
        mark_color:
          type: string
          maxLength: 20
        model_3d:
          type: string
          format: uri
          nullable: true
          pattern: (?:glb)$
        scale:
          type: number
          format: double
          nullable: true
        project_to_map:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/OutputLlaEnum'
          - $ref: '#/components/schemas/NullEnum'
        rotation_from_velocity:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/OutputLlaEnum'
          - $ref: '#/components/schemas/NullEnum'
        rotation_x:
          type: number
          format: double
          nullable: true
          title: X Rotation (degrees)
        rotation_y:
          type: number
          format: double
          nullable: true
          title: Y Rotation (degrees)
        rotation_z:
          type: number
          format: double
          nullable: true
          title: Z Rotation (degrees)
        translation_x:
          type: number
          format: double
          nullable: true
          title: X Translation (meters)
        translation_y:
          type: number
          format: double
          nullable: true
          title: Y Translation (meters)
        translation_z:
          type: number
          format: double
          nullable: true
          title: Z Translation (meters)
        x_buffer_size:
          type: number
          format: double
          title: Object buffer size in x-axis
        y_buffer_size:
          type: number
          format: double
          title: Object buffer size in y-axis
        z_buffer_size:
          type: number
          format: double
          title: Object buffer size in z-axis
        geometric_center:
          type: array
          items:
            type: number
            format: double
          nullable: true
          description: Geometric center offset [x, y, z] in meters from bottom center
        mass:
          type: number
          format: double
          minimum: 0.0
          nullable: true
          title: Mass (kg)
        center_of_mass:
          type: array
          items:
            type: number
            format: double
          nullable: true
          description: Center of mass offset [x, y, z] in meters from geometric center
        is_static:
          nullable: true
          description: |-
            Whether object can move on its own

            * `True` - Yes
            * `False` - No
          oneOf:
          - $ref: '#/components/schemas/OutputLlaEnum'
          - $ref: '#/components/schemas/NullEnum'
        ttl:
          type: number
          format: double
          minimum: 0.0
          nullable: true
          title: Time to Live (seconds)
          description: Time to live for track expiration (0 = infinite)
        linear_damping:
          type: number
