          format: double
          minimum: 0.0
          nullable: true
          title: Mass (kg)
        center_of_mass:
          type: array
          items:
            type: number
            format: double
          nullable: true
          description: Center of mass offset [x, y, z] in meters from geometric center
        is_static:
          nullable: true
