        uid:
          type: string
          readOnly: true
        name:
          type: string
          maxLength: 150
        sensor_id:
          type: string
          writeOnly: true
          maxLength: 20
        intrinsics:
          type: object
          properties:
            fx:
              type: number
              format: double
            fy:
              type: number
              format: double
            cx:
              type: number
              format: double
            cy:
              type: number
              format: double
          readOnly: true
        transform_type:
          type: string
          readOnly: true
        transforms:
          type: array
          items:
            type: number
            format: double
          readOnly: true
        distortion:
          type: object
          properties:
            k1:
              type: number
              format: double
            k2:
              type: number
              format: double
            p1:
              type: number
              format: double
            p2:
              type: number
              format: double
            k3:
              type: number
              format: double
          nullable: true
          readOnly: true
        translation:
          type: array
          items:
            type: number
            format: double
          readOnly: true
        rotation:
          type: array
          items:
            type: number
            format: double
          readOnly: true
        scale:
          type: array
          items:
            type: number
            format: double
          readOnly: true
        resolution:
          type: object
          additionalProperties: {}
        scene:
          type: string
          format: uuid
          nullable: true
        threshold:
          type: number
          format: double
          nullable: true
        aspect:
          type: string
          nullable: true
          maxLength: 64
        cv_subsystem:
          title: Decode Device
          oneOf:
            - $ref: "#/components/schemas/CvSubsystemEnum"
            - $ref: "#/components/schemas/NullEnum"
          default: AUTO
        undistort:
          type: boolean
          default: false
        modelconfig:
          type: string
          nullable: true
          title: Model Config
          maxLength: 512
          default: model_config.json
        use_camera_pipeline:
          type: boolean
          nullable: true
