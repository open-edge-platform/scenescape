openapi: 3.0.3
info:
  title: Scenescape API
  version: 1.0.0
  description: |
    API for managing and interacting with the Scenescape Manager system, including cameras, scenes, assets and more.
  contact:
    name: Scenescape Manager Support
    url: https://github.com/open-edge-platform/scenescape
  license:
    name: License
    url: "https://github.com/open-edge-platform/scenescape/blob/main/LICENSES/Apache-2.0.txt"

servers:
  - url: "https://localhost/api/v1"

tags:
  - name: "asset"
    description: "Operations related to assets"
  - name: "auth"
    description: "Operations related to authentication"
  - name: "calibrationmarker"
    description: "Operations related to calibration markers"
  - name: "camera"
    description: "Operations related to cameras"
  - name: "child"
    description: "Operations related to children"
  - name: "frame"
    description: "Operations related to camera frames"
  - name: "region"
    description: "Operations related to regions"
  - name: "scene"
    description: "Operations related to scenes"
  - name: "sensor"
    description: "Operations related to sensors"
  - name: "tripwire"
    description: "Operations related to tripwires"
  - name: "user"
    description: "Operations related to users"
  - name: "video"
    description: "Operations related to camera videos"

paths:
  /asset:
    post:
      tags:
        - asset
      operationId: asset_create
      summary: Create a new asset
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Asset3D"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/Asset3D"
        required: true
      security:
        - tokenAuth: []
      responses:
        "201":
          description: Created
        "400":
          description: Validation error
        "401":
          description: Unauthorized
  /asset/{uid}:
    get:
      tags:
        - asset
      operationId: asset_detail_retrieve
      summary: Get an asset by UID
      parameters:
        - in: path
          name: uid
          schema:
            type: string
          required: true
      security:
        - tokenAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset3D"
        "400":
          description: Bad request - UID required or invalid format
        "404":
          description: Not found
        "401":
          description: Unauthorized
    put:
      tags:
        - asset
      operationId: asset_detail_update
      summary: Update an asset by UID
      parameters:
        - in: path
          name: uid
          schema:
            type: string
          required: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Asset3D"
          multipart/form-data:
            schema:
