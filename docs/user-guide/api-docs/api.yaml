        y_size:
          type: number
          format: double
          minimum: 0.0
          title: Object size in y-axis
        z_size:
          type: number
          format: double
          minimum: 0.0
          title: Object size in z-axis
        tracking_radius:
          type: number
          format: double
          title: Tracking radius (meters)
        shift_type:
          nullable: true
          minimum: -2147483648
          maximum: 2147483647
