            type: number
            format: double
          nullable: true
        translation:
          type: array
          items:
            type: number
            format: double
          readOnly: true
        singleton_type:
          allOf:
            - $ref: "#/components/schemas/SingletonTypeEnum"
          title: Type of Sensor
        color_ranges:
          $ref: "#/components/schemas/SingletonScalarThreshold"
      required:
        - center
        - color_ranges
        - name
        - points
        - scene
        - translation
        - uid
    SingletonScalarThreshold:
      type: object
      properties:
        sectors: {}
        range_max:
          type: integer
      required:
        - range_max
        - sectors
    SingletonTypeEnum:
      enum:
        - environmental
        - attribute
      type: string
      description: |-
        * `environmental` - environmental
        * `attribute` - attribute
    TopicEnum:
      enum:
        - CHANNEL
        - CMD_CAMERA
        - CMD_DATABASE
        - CMD_KUBECLIENT
        - CMD_SCENE_UPDATE
        - DATA_AUTOCALIB_CAM_POSE
        - DATA_CAMERA
        - DATA_EXTERNAL
        - DATA_REGION
        - DATA_REGULATED
        - DATA_SCENE
        - DATA_SENSOR
        - EVENT
        - IMAGE_CALIBRATE
        - IMAGE_CAMERA
        - SYS_CHILDSCENE_STATUS
        - ANALYTICS_CLUSTERS
      type: string
      description: |-
        * `CHANNEL` - CHANNEL
        * `CMD_CAMERA` - CMD_CAMERA
        * `CMD_DATABASE` - CMD_DATABASE
        * `CMD_KUBECLIENT` - CMD_KUBECLIENT
        * `CMD_SCENE_UPDATE` - CMD_SCENE_UPDATE
        * `DATA_AUTOCALIB_CAM_POSE` - DATA_AUTOCALIB_CAM_POSE
        * `DATA_CAMERA` - DATA_CAMERA
        * `DATA_EXTERNAL` - DATA_EXTERNAL
        * `DATA_REGION` - DATA_REGION
        * `DATA_REGULATED` - DATA_REGULATED
        * `DATA_SCENE` - DATA_SCENE
        * `DATA_SENSOR` - DATA_SENSOR
        * `EVENT` - EVENT
        * `IMAGE_CALIBRATE` - IMAGE_CALIBRATE
        * `IMAGE_CAMERA` - IMAGE_CAMERA
        * `SYS_CHILDSCENE_STATUS` - SYS_CHILDSCENE_STATUS
        * `ANALYTICS_CLUSTERS` - ANALYTICS_CLUSTERS
    TransformTypeEnum:
      enum:
        - matrix
        - euler
        - quaternion
      type: string
      description: |-
        * `matrix` - Matrix
        * `euler` - Euler Angles
        * `quaternion` - Quaternion
    Tripwire:
      type: object
      properties:
        uid:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 150
        points:
          type: array
          items:
            type: number
            format: double
        height:
          type: number
          format: double
        scene:
          type: string
      required:
        - name
        - points
        - scene
        - uid
    User:
      type: object
      properties:
        uid:
          type: string
          readOnly: true
        username:
          type: string
          description:
            Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        password:
          type: string
          writeOnly: true
          maxLength: 128
        is_active:
          type: boolean
          title: Active
          description:
            Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        is_staff:
          type: boolean
          title: Staff status
          description: Designates whether the user can log into this admin site.
        is_superuser:
          type: boolean
          title: Superuser status
          description:
            Designates that this user has all permissions without explicitly
            assigning them.
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        acls:
          type: array
          items:
            $ref: "#/components/schemas/PubSubACL"
      required:
        - password
        - uid
        - username
  securitySchemes:
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
