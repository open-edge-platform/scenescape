        required: true
      security:
        - tokenAuth: []
      responses:
        "200":
          description: Updated
        "400":
          description: Validation error or UID required
        "404":
          description: Not found
        "401":
          description: Unauthorized
    delete:
      tags:
        - asset
      operationId: asset_detail_destroy
      summary: Delete an asset by UID
      parameters:
        - in: path
          name: uid
          schema:
            type: string
          required: true
      security:
        - tokenAuth: []
      responses:
        "200":
          description: Deleted
        "400":
          description: UID required or invalid format
        "404":
          description: Not found
        "401":
          description: Unauthorized
  /assets:
    get:
      tags:
        - asset
      operationId: assets_retrieve
      summary: List all assets
      parameters:
        - name: page
          required: false
          in: query
          description: A page number within the paginated result set.
          schema:
            type: integer
        - name: name
          required: false
          in: query
          description: Filter by asset name.
          schema:
            type: string
        - name: id
          required: false
          in: query
          description: Filter by asset ID.
          schema:
