              $ref: "#/components/schemas/User"
        required: true
      security:
        - tokenAuth: []
      responses:
        "200":
          description: Updated
        "400":
          description: Validation error or UID required
        "404":
          description: Not found
    delete:
      operationId: user_detail_destroy
      summary: Delete a thing by UID
      parameters:
        - in: path
          name: uid
          schema:
            type: string
          required: true
      tags:
      - user
      security:
        - tokenAuth: []
      responses:
        "200":
          description: Deleted
        "400":
          description: UID required or invalid format
        "404":
          description: Not found
  /users:
    get:
      operationId: users_retrieve
      parameters:
        - name: page
          required: false
          in: query
          description: A page number within the paginated result set.
          schema:
            type: integer
      tags:
      - user
      security:
        - tokenAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedUserList"
          description: ""
  /video:
    get:
      operationId: v1_video_retrieve
      summary: Get camera frame or video
      parameters:
        - in: query
          name: camera
          schema:
            type: string
          description: Camera ID
          required: true
        - in: query
          name: timestamp
          schema:
            type: string
          description: ISO timestamp (required for frame)
        - in: query
          name: type
          schema:
            type: string
          description: Frame type filter
      tags:
      - video
      security:
        - tokenAuth: []
      responses:
        "200":
          description: Frame data or video file
        "404":
          description: Not found
        "503":
          description: Broker unavailable
components:
  schemas:
    AccessEnum:
      enum:
        - 0
        - 1
        - 2
        - 3
