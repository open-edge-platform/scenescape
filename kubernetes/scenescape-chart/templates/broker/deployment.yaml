---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-broker
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-broker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-broker
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-broker
    spec:
      containers:
        - name: broker
          image: {{ .Values.broker.image }}:{{ .Values.broker.tag }}
          env:
            {{ include "proxy_envs" . | indent 12 }}
          ports:
            - containerPort: 1883
            - containerPort: 1884
          volumeMounts:
            - name: config-volume
              mountPath: /mosquitto/config
            - name: secrets-volume
              mountPath: /mosquitto/secrets/certs
          command: ["/usr/sbin/mosquitto", "-c", "/mosquitto/config/mosquitto-secure.conf"]
          securityContext:
            runAsUser: {{ .Values.broker.uid }}
            runAsGroup: {{ .Values.broker.gid }}
      volumes:
        - name: config-volume
          configMap:
            name: {{ .Release.Name }}-broker
            items:
              - key: mosquitto-secure.conf
                path: mosquitto-secure.conf
        - name: secrets-volume
          projected:
            sources:
            - secret:
                name: {{ .Release.Name }}-broker-tls
                items:
                - key: tls.crt
                  path: scenescape-broker.crt
                - key: tls.key
                  path: scenescape-broker.key
            - secret:
                name: {{ .Release.Name }}-scenescape-ca.pem
                items:
                - key: tls.crt
                  path: scenescape-ca.pem
