{{- if .Values.modelDownload.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "modelDownload.jobName" . }}
  labels:
    app: {{ .Release.Name }}-model-download
    {{ include "releaseLabels" . | indent 4 }}
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-model-download
        {{ include "releaseLabels" . | indent 8 }}
    spec:
      securityContext:
        fsGroup: 1000
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: {{ .Release.Name }}-web
            topologyKey: kubernetes.io/hostname
      containers:
      - name: {{ .Release.Name }}-model-download
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          marker=/workspace/models-storage/.model-download-config-hash
          if [ -f "$marker" ] && [ "$(cat "$marker")" = "$MODEL_DOWNLOAD_CONFIG_HASH" ]; then
            echo "Model download configuration is unchanged; skipping download."
            exit 0
          fi
          /bin/bash /workspace/model-download/entrypoint-k8s.sh
          printf '%s\n' "$MODEL_DOWNLOAD_CONFIG_HASH" > "$marker"
        image: {{ .Values.modelDownload.image.repository }}/{{ .Values.modelDownload.image.name }}:{{ .Values.modelDownload.image.tag }}
        imagePullPolicy: {{ .Values.modelDownload.image.pullPolicy }}
        env:
          - name: HF_HUB_ENABLE_HF_TRANSFER
            value: "1"
          - name: MODEL_DOWNLOADER_ARGS
            value: {{ .Values.modelDownload.commandArgs | quote }}
          - name: MODEL_DOWNLOADER_URL
            value: "http://127.0.0.1:8000"
          - name: MODEL_DIR
            value: "/workspace/models-storage/models"
          - name: MODEL_CONFIG_FILE
            value: "/workspace/model-download/models.json"
          - name: MODEL_DOWNLOAD_CONFIG_HASH
            value: {{ include "modelDownload.configHash" . | quote }}
          - name: PARALLEL_DOWNLOADS
            value: {{ .Values.modelDownload.parallelDownloads | quote }}
          - name: MODEL_DOWNLOADER_INITIAL_WAIT_TIMEOUT
            value: {{ .Values.modelDownload.initialWaitTimeout | quote }}
          - name: MODEL_DOWNLOADER_WAIT_TIMEOUT
            value: {{ .Values.modelDownload.waitTimeout | quote }}
          {{ include "proxy_envs" . | indent 10 }}
        resources:
          {{- toYaml .Values.modelDownload.resources | nindent 10 }}
        volumeMounts:
        - mountPath: /workspace/models-storage
          name: models-storage
        - mountPath: /workspace/model-download
          name: model-download-code
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
      - name: models-storage
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-models-pvc
      - name: model-download-code
        configMap:
          name: {{ .Release.Name }}-model-download
{{- end }}
