{{/* Preserve existing random secret values across `helm upgrade`; only generate on first install. */}}
{{- $ns := .Release.Namespace }}
{{- $ctrlName := printf "%s-controller.auth" .Release.Name }}
{{- $ctrlExisting := lookup "v1" "Secret" $ns $ctrlName }}
{{- $ctrlValue := ternary (index (default (dict "data" (dict)) $ctrlExisting).data "controller.auth" | default "") (printf "{\"user\": \"scenectrl\", \"password\": \"%s\"}" (randAlphaNum 16) | b64enc) (hasKey (default (dict "data" (dict)) $ctrlExisting).data "controller.auth") }}
{{- $brwName := printf "%s-browser.auth" .Release.Name }}
{{- $brwExisting := lookup "v1" "Secret" $ns $brwName }}
{{- $brwValue := ternary (index (default (dict "data" (dict)) $brwExisting).data "browser.auth" | default "") (printf "{\"user\": \"webuser\", \"password\": \"%s\"}" (randAlphaNum 16) | b64enc) (hasKey (default (dict "data" (dict)) $brwExisting).data "browser.auth") }}
{{- $calName := printf "%s-calibration.auth" .Release.Name }}
{{- $calExisting := lookup "v1" "Secret" $ns $calName }}
{{- $calValue := ternary (index (default (dict "data" (dict)) $calExisting).data "calibration.auth" | default "") (printf "{\"user\": \"calibration\", \"password\": \"%s\"}" (randAlphaNum 16) | b64enc) (hasKey (default (dict "data" (dict)) $calExisting).data "calibration.auth") }}
{{- $secPyName := printf "%s-secrets-py" .Release.Name }}
{{- $secPyExisting := lookup "v1" "Secret" $ns $secPyName }}
{{- $secPyValue := ternary (index (default (dict "data" (dict)) $secPyExisting).data "secrets.py" | default "") (include "secrets-py" . | b64enc) (hasKey (default (dict "data" (dict)) $secPyExisting).data "secrets.py") }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $ctrlName }}
type: Opaque
data:
  controller.auth: {{ $ctrlValue }}

---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $brwName }}
type: Opaque
data:
  browser.auth: {{ $brwValue }}

---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $calName }}
type: Opaque
data:
  calibration.auth: {{ $calValue }}

---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-supass
type: Opaque
data:
  supass: {{ include "supass" . | b64enc }}

---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-db
type: Opaque
data:
  DATABASE_PASSWORD: {{ include "db-password" . | b64enc }}

---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secPyName }}
type: Opaque
data:
  secrets.py: |-
    {{ $secPyValue }}
