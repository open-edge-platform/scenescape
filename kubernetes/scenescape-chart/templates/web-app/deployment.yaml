{{- if .Values.modelDownload.enabled }}
{{- if not (kindIs "bool" .Values.modelDownload.parallelDownloads) }}
{{- fail "modelDownload.parallelDownloads must be a boolean (true or false)" }}
{{- end }}
{{- if not .Values.modelDownload.commandArgs }}
{{- fail "modelDownload.commandArgs cannot be empty" }}
{{- end }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-web-dep
  labels:
    app: {{ .Release.Name }}-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-web
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-web
        {{ include "releaseLabels" . | indent 8 }}
      {{ if .Values.modelDownload.enabled }}
      annotations:
        checksum/model-download: {{ include (print $.Template.BasePath "/model-download/configmap.yaml") . | sha256sum }}
      {{ end }}
    spec:
      shareProcessNamespace: true
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 1000
      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.pgserver.repository }}/{{ .Values.pgserver.image }}:{{ .Values.pgserver.tag}}
          imagePullPolicy: {{ .Values.pgserver.pullPolicy }}
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-db
                  key: DATABASE_PASSWORD
          command:
            - sh
            - -c
            - |
              echo "Waiting for Postgres to be ready..."
              until pg_isready -h pgserver.{{ .Release.Namespace }}.svc.cluster.local -U scenescape -d scenescape; do
                sleep 2
              done
              echo "Postgres is ready!"
          securityContext:
            {{ include "defaultContainerSecurityContext" . | indent 12 }}
        {{- if .Values.modelDownload.enabled }}
        - name: model-download
          command: ["/bin/bash", "-c"]
          args:
          - |
            if [ -f /workspace/models-storage/.model-download-config-hash ] && [ "$(cat /workspace/models-storage/.model-download-config-hash)" = "$MODEL_DOWNLOAD_CONFIG_HASH" ]; then
              echo "Model download configuration is unchanged; skipping download."
            else
{{ .Files.Get "files/model-download/entrypoint-k8s.sh" | nindent 14 }}
              printf '%s\n' "$MODEL_DOWNLOAD_CONFIG_HASH" > /workspace/models-storage/.model-download-config-hash
            fi
          image: {{ .Values.modelDownload.image.repository }}/{{ .Values.modelDownload.image.name }}:{{ .Values.modelDownload.image.tag }}
          imagePullPolicy: {{ .Values.modelDownload.image.pullPolicy }}
          env:
            - name: HF_HUB_ENABLE_HF_TRANSFER
              value: "1"
            - name: MODEL_DOWNLOADER_ARGS
              value: {{ .Values.modelDownload.commandArgs | quote }}
            - name: MODEL_DOWNLOADER_URL
              value: "http://127.0.0.1:8000"
            - name: MODEL_DIR
              value: "/workspace/models-storage/models"
            - name: MODEL_CONFIG_FILE
              value: "/workspace/model-download/models.json"
            - name: MODEL_DOWNLOAD_CONFIG_HASH
              value: {{ dict "models" (.Files.Get "files/model-download/models.json") "entrypoint" (.Files.Get "files/model-download/entrypoint-k8s.sh") "image" .Values.modelDownload.image "commandArgs" .Values.modelDownload.commandArgs "parallelDownloads" .Values.modelDownload.parallelDownloads "initialWaitTimeout" .Values.modelDownload.initialWaitTimeout "waitTimeout" .Values.modelDownload.waitTimeout | toJson | sha256sum | quote }}
            - name: PARALLEL_DOWNLOADS
              value: {{ .Values.modelDownload.parallelDownloads | quote }}
            - name: MODEL_DOWNLOADER_INITIAL_WAIT_TIMEOUT
              value: {{ .Values.modelDownload.initialWaitTimeout | quote }}
            - name: MODEL_DOWNLOADER_WAIT_TIMEOUT
              value: {{ .Values.modelDownload.waitTimeout | quote }}
            {{ include "proxy_envs" . | indent 12 }}
          resources:
            {{- toYaml .Values.modelDownload.resources | nindent 12 }}
          volumeMounts:
          - mountPath: /workspace/models-storage
            name: models-storage
          - mountPath: /workspace/model-download
            name: model-download-code
        {{- end }}
      containers:
        - name: {{ .Release.Name }}-web
          image: {{ .Values.repository }}/{{ .Values.web.image }}:{{ .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.web.pullPolicy }}
          args:
            - webserver
            - --dbtype
            - postgres
            - --broker
            - broker.{{ .Release.Namespace }}.svc.cluster.local
            - --brokerauth
            - /run/secrets/browser.auth
            - --brokerrootcert
            - /run/secrets/certs/scenescape-ca.pem
            - --autocalibration
            - autocalibration.{{ .Release.Namespace }}.svc.cluster.local:8443
            - --overwrite-user-auth
          env:
          {{- if .Values.mapping.enabled }}
          - name: MAPPING_SERVICE_URL
            value: https://mapping.{{ .Release.Namespace }}.svc.cluster.local:8444
          {{- end }}
          - name: WEBSERVER_URL
            value: https://web.scenescape.svc.cluster.local
          - name: MODEL_CONFIGS_FOLDER
            value: /home/scenescape/Scenescape/models/models/model_configs
          - name: DBHOST
            value: pgserver
          - name: DBPORT
            value: "5432"
          {{- if .Values.web.allowedHosts }}
          - name: SCENESCAPE_ALLOWED_HOSTS
            value: "{{ .Values.web.allowedHosts }}"
          {{- end }}
          - name: SUPASS
            valueFrom:
              secretKeyRef:
                name: {{ .Release.Name }}-supass
                key: supass
{{- if ne (default .Values.dbroot "") "" }}
          - name: DBROOT
            value: {{ .Values.dbroot }}
{{- end }}
            {{ include "proxy_envs" . | indent 10 }}
          ports:
          - containerPort: 443
          readinessProbe:
            exec:
              command:
              - sh
              - -c
              - >
                curl --insecure -s -H 'Host: localhost' https://127.0.0.1:443/api/v1/health |
                python3 -c 'import json,sys; data=json.load(sys.stdin); raise SystemExit(0 if data.get("ready") is True else 1)'
            periodSeconds: 10
            timeoutSeconds: 60
            failureThreshold: 5
            initialDelaySeconds: 10
          livenessProbe:
            exec:
              command:
              - sh
              - -c
              - >
                curl --insecure -fsS -H 'Host: localhost'
                https://127.0.0.1:443/api/v1/health >/dev/null
            periodSeconds: 10
            timeoutSeconds: 60
            failureThreshold: 5
            initialDelaySeconds: 20
          resources: {}
          volumeMounts:
          - mountPath: /run/secrets/certs/scenescape-ca.pem
            subPath: scenescape-ca.pem
            name: certs
            readOnly: true
          - mountPath: /run/secrets/certs/scenescape-web.crt
            subPath: scenescape-web.crt
            name: certs
            readOnly: true
          - mountPath: /run/secrets/certs/scenescape-web.key
            subPath: scenescape-web.key
            name: certs
            readOnly: true
          - mountPath: /run/secrets/supass
            name: supass
          - mountPath: /run/secrets/django/secrets.py
            subPath: secrets.py
            name: secrets-py
            readOnly: true
          - mountPath: /run/secrets/browser.auth
            name: browser-auth
            subPath: browser.auth
            readOnly: true
          - mountPath: /run/secrets/controller.auth
            name: controller-auth
            subPath: controller.auth
            readOnly: true
          - mountPath: /run/secrets/calibration.auth
            name: calibration-auth
            subPath: calibration.auth
            readOnly: true
          - mountPath: /home/scenescape/Scenescape/media
            name: media-storage
          - mountPath: /workspace/media
            name: media-storage
          - mountPath: /home/scenescape/Scenescape/models
            name: models-storage
          - mountPath: /workspace/migrations
            name: migrations-storage
      restartPolicy: Always
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
      {{ include "certs_volume" . | indent 6 }}
      - name: supass
        secret:
          secretName: {{ .Release.Name }}-supass
      - name: secrets-py
        secret:
          secretName: {{ .Release.Name }}-secrets-py
      - name: browser-auth
        secret:
          secretName: {{ .Release.Name }}-browser.auth
      - name: controller-auth
        secret:
          secretName: {{ .Release.Name }}-controller.auth
      - name: calibration-auth
        secret:
          secretName: {{ .Release.Name }}-calibration.auth
      - name: media-storage
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-media-pvc
      - name: models-storage
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-models-pvc
      - name: migrations-storage
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-migrations-pvc
      {{- if .Values.modelDownload.enabled }}
      - name: model-download-code
        configMap:
          name: {{ .Release.Name }}-model-download
      {{- end }}
status: {}
