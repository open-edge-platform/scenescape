{{- if .Values.modelDownload.enabled }}
{{- if not (kindIs "bool" .Values.modelDownload.parallelDownloads) }}
{{- fail "modelDownload.parallelDownloads must be a boolean (true or false)" }}
{{- end }}
{{- if not .Values.modelDownload.commandArgs }}
{{- fail "modelDownload.commandArgs cannot be empty" }}
{{- end }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-web-dep
  labels:
    app: {{ .Release.Name }}-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-web
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-web
        {{ include "releaseLabels" . | indent 8 }}
      {{ if .Values.modelDownload.enabled }}
      annotations:
        checksum/model-download: {{ include "modelDownload.configHash" . }}
      {{ end }}
    spec:
      shareProcessNamespace: true
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.pgserver.repository }}/{{ .Values.pgserver.image }}:{{ .Values.pgserver.tag}}
          imagePullPolicy: {{ .Values.pgserver.pullPolicy }}
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-db
                  key: DATABASE_PASSWORD
          command:
            - sh
            - -c
            - |
              echo "Waiting for Postgres to be ready..."
              until pg_isready -h pgserver.{{ .Release.Namespace }}.svc.cluster.local -U scenescape -d scenescape; do
                sleep 2
              done
              echo "Postgres is ready!"
          securityContext:
            {{ include "defaultContainerSecurityContext" . | indent 12 }}
        {{- if .Values.modelDownload.enabled }}
        - name: wait-for-model-download
          image: {{ .Values.busyboxImage.repository }}/{{ .Values.busyboxImage.name }}:{{ .Values.busyboxImage.tag }}
          imagePullPolicy: {{ .Values.busyboxImage.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
          - |
            marker=/workspace/models-storage/.model-download-config-hash
            echo "Waiting for model download Job to complete..."
            until [ -f "$marker" ] && [ "$(cat "$marker")" = "$MODEL_DOWNLOAD_CONFIG_HASH" ]; do
              sleep 2
            done
            echo "Model download Job completed."
          env:
            - name: MODEL_DOWNLOAD_CONFIG_HASH
              value: {{ include "modelDownload.configHash" . | quote }}
          volumeMounts:
          - mountPath: /workspace/models-storage
            name: models-storage
          securityContext:
            {{ include "defaultContainerSecurityContext" . | indent 12 }}
        {{- end }}
      containers:
        - name: {{ .Release.Name }}-web
          image: {{ .Values.repository }}/{{ .Values.web.image }}:{{ .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.web.pullPolicy }}
          args:
            - webserver
            - --dbtype
            - postgres
            - --broker
            - broker.{{ .Release.Namespace }}.svc.cluster.local
            - --brokerauth
            - /run/secrets/browser.auth
            - --brokerrootcert
            - /run/secrets/certs/scenescape-ca.pem
            - --autocalibration
            - autocalibration.{{ .Release.Namespace }}.svc.cluster.local:8443
            - --overwrite-user-auth
          env:
          {{- if .Values.mapping.enabled }}
          - name: MAPPING_SERVICE_URL
            value: https://mapping.{{ .Release.Namespace }}.svc.cluster.local:8444
          {{- end }}
          - name: WEBSERVER_URL
            value: https://web.scenescape.svc.cluster.local
          - name: MODEL_CONFIGS_FOLDER
            value: /home/scenescape/Scenescape/models/models/model_configs
          - name: DBHOST
            value: pgserver
          - name: DBPORT
            value: "5432"
          {{- if .Values.positioning.enabled }}
          - name: POSITIONING_RESOLVER_ID
            value: {{ .Values.positioning.resolverId | quote }}
          {{- end }}
          {{- if .Values.web.allowedHosts }}
          - name: SCENESCAPE_ALLOWED_HOSTS
            value: "{{ .Values.web.allowedHosts }}"
          {{- end }}
          {{- if .Values.web.ptzCalibrationResidualThresholdPx }}
          - name: PTZ_CALIBRATION_RESIDUAL_THRESHOLD_PX
            value: {{ .Values.web.ptzCalibrationResidualThresholdPx | quote }}
          {{- end }}
          - name: SUPASS
            valueFrom:
              secretKeyRef:
                name: {{ .Release.Name }}-supass
                key: supass
{{- if ne (default .Values.dbroot "") "" }}
          - name: DBROOT
            value: {{ .Values.dbroot }}
{{- end }}
            {{ include "proxy_envs" . | indent 10 }}
          ports:
          - containerPort: 443
          readinessProbe:
            exec:
              command:
              - sh
              - -c
              - >
                curl --insecure -s -H 'Host: localhost' https://127.0.0.1:443/api/v1/health |
                python3 -c 'import json,sys; data=json.load(sys.stdin); raise SystemExit(0 if data.get("ready") is True else 1)'
            periodSeconds: 10
            timeoutSeconds: 60
            failureThreshold: 5
            initialDelaySeconds: 10
          livenessProbe:
            exec:
              command:
              - sh
              - -c
              - >
                curl --insecure -fsS -H 'Host: localhost'
                https://127.0.0.1:443/api/v1/health >/dev/null
            periodSeconds: 10
            timeoutSeconds: 60
            failureThreshold: 5
            initialDelaySeconds: 20
          resources: {}
          volumeMounts:
          - mountPath: /run/secrets/certs/scenescape-ca.pem
            subPath: scenescape-ca.pem
            name: certs
            readOnly: true
          - mountPath: /run/secrets/certs/scenescape-web.crt
            subPath: scenescape-web.crt
            name: certs
            readOnly: true
          - mountPath: /run/secrets/certs/scenescape-web.key
            subPath: scenescape-web.key
            name: certs
            readOnly: true
          - mountPath: /run/secrets/supass
            name: supass
          - mountPath: /run/secrets/django/secrets.py
            subPath: secrets.py
            name: secrets-py
            readOnly: true
          - mountPath: /run/secrets/browser.auth
            name: browser-auth
            subPath: browser.auth
            readOnly: true
          - mountPath: /run/secrets/controller.auth
            name: controller-auth
            subPath: controller.auth
            readOnly: true
          - mountPath: /run/secrets/calibration.auth
            name: calibration-auth
            subPath: calibration.auth
            readOnly: true
          {{- if .Values.positioning.enabled }}
          - mountPath: /run/secrets/positioning.auth
            name: positioning-auth
            subPath: positioning.auth
            readOnly: true
          {{- end }}
          - mountPath: /home/scenescape/Scenescape/media
            name: media-storage
          - mountPath: /workspace/media
            name: media-storage
          - mountPath: /home/scenescape/Scenescape/models
            name: models-storage
          - mountPath: /workspace/migrations
            name: migrations-storage
      restartPolicy: Always
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
      {{ include "certs_volume" . | indent 6 }}
      - name: supass
        secret:
          secretName: {{ .Release.Name }}-supass
      - name: secrets-py
        secret:
          secretName: {{ .Release.Name }}-secrets-py
      - name: browser-auth
        secret:
          secretName: {{ .Release.Name }}-browser.auth
      - name: controller-auth
        secret:
          secretName: {{ .Release.Name }}-controller.auth
      - name: calibration-auth
        secret:
          secretName: {{ .Release.Name }}-calibration.auth
      {{- if .Values.positioning.enabled }}
      - name: positioning-auth
        secret:
          secretName: {{ .Release.Name }}-positioning.auth
      {{- end }}
      - name: media-storage
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-media-pvc
      - name: models-storage
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-models-pvc
      - name: migrations-storage
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-migrations-pvc
status: {}
