{{- if .Values.hooks.enabled }}
{{- if not (has .Values.initModels.modelType (list "default" "ocr" "all")) }}
{{- fail "initModels.modelType must be one of: default, ocr, all" }}
{{- end }}
{{- if not (kindIs "bool" .Values.initModels.modelProc) }}
{{- fail "initModels.modelProc must be a boolean (true or false)" }}
{{- end }}
{{- if not .Values.initModels.modelPrecisions }}
{{- fail "initModels.modelPrecisions cannot be empty" }}
{{- end }}
# Validate precisions format (comma-separated list of valid precisions)
{{- $validPrecisions := list "FP32" "FP16" "INT8" }}
{{- $precisions := splitList "," .Values.initModels.modelPrecisions }}
{{- range $precision := $precisions }}
{{- $trimmedPrecision := trim $precision }}
{{- if not (has $trimmedPrecision $validPrecisions) }}
{{- fail (printf "Invalid precision '%s' in modelPrecisions. Valid precisions are: FP32, FP16, INT8" $trimmedPrecision) }}
{{- end }}
{{- end }}

apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-models-installer
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- if .Values.hooks.enabled }}
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "1"
    {{- if not .Values.chartdebug }}
    "helm.sh/hook-delete-policy": hook-succeeded
    {{- end }}
    {{- end }}
spec:
  template:
    spec:
      containers:
      - command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          set -x
          echo "Starting model download and installation..."

          # Install dependencies
          apt-get update && apt-get install -y --no-install-recommends wget && rm -rf /var/lib/apt/lists/*
          pip install --no-cache-dir -r /workspace/requirements-runtime.txt

          # Run the entrypoint script to download models
          echo "Starting model installation with MODEL_TYPE=${MODEL_TYPE}, PRECISIONS=${MODEL_PRECISIONS}, MODEL_PROC=${MODEL_PROC}"
          # Build arguments for install-omz-models
          ARGS=""
          case "${MODEL_TYPE}" in
            "default")
              ARGS="--default"
              ;;
            "ocr")
              ARGS="--ocr"
              ;;
            "all")
              ARGS="--all"
              ;;
            *)
              echo "Unknown MODEL_TYPE: ${MODEL_TYPE}. Using default."
              ARGS="--default"
              ;;
          esac
          ARGS="${ARGS} --precisions ${MODEL_PRECISIONS}"
          # Add model_proc flag if enabled
          if [ "${MODEL_PROC}" = "true" ]; then
            ARGS="${ARGS} --model_proc"
          fi
          echo "Running: python install-omz-models ${ARGS}"
          mkdir -p /workspace/models-storage/models
          python /workspace/install-omz-models ${ARGS}
          echo "Copying config files..."
          python /workspace/copy-config-files /workspace ${MODEL_DIR}
          echo "Model installation completed successfully"
          echo "Models installed in: ${MODEL_DIR}"
          ls -la "${MODEL_DIR}" || true``

          if [ -d "/workspace/models-storage/models/" ]; then
            echo "Models downloaded successfully"
          else
            echo "Error: No models directory found after download"
            exit 1
          fi

          # Set proper ownership for shared storage
          chown -R 1000:1000 /workspace/models-storage

          echo "Model installation and copying completed successfully"
        image: python:3.13-slim@sha256:4c2cf9917bd1cbacc5e9b07320025bdb7cdf2df7b0ceaccb55e9dd7e30987419
        name: {{ .Release.Name }}-{{ .Values.initModels.image }}-container
        imagePullPolicy: Always
        env:
          - name: MODEL_TYPE
            value: "{{ .Values.initModels.modelType }}"
          - name: MODEL_PRECISIONS
            value: "{{ .Values.initModels.modelPrecisions }}"
          - name: MODEL_PROC
            value: "{{ .Values.initModels.modelProc }}"
          - name: MODEL_DIR
            value: "/workspace/models-storage/models/"
          {{ include "proxy_envs" . | indent 10 }}
        resources:
          {{- toYaml .Values.initModels.resources | nindent 10 }}
        volumeMounts:
        - mountPath: /workspace/models-storage
          name: models-storage
        - mountPath: /workspace/dlstreamer-pipeline-server
          name: model-installer-storage
        - mountPath: /workspace
          name: model-installer-code
        - name: model-installer-code
          mountPath: /workspace/dlstreamer-pipeline-server/model-proc-files/person-detection-retail-0013.json
          subPath: person-detection-retail-0013.json
        - name: model-installer-code
          mountPath: /workspace/dlstreamer-pipeline-server/model_config.json
          subPath: model_config.json
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
      - name: model-installer-storage
        emptyDir: {}
      - name: models-storage
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-models-pvc
      - name: model-installer-code
        configMap:
          name: {{ .Release.Name }}-model-installer
  backoffLimit: 3
{{- end }}
