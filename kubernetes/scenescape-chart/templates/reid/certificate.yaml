{{- if .Values.reid.enabled }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Release.Name }}-reid-cert-s
spec:
  secretName: {{ .Release.Name }}-reid-s-tls
  issuerRef:
    name: {{ .Release.Name }}-ca-issuer
    kind: Issuer
  commonName: "reid.scenescape.intel.com"
  dnsNames:
  - "reid.scenescape.intel.com"
  - "reid"
  - "reid.{{ .Release.Namespace }}"
  - "reid.{{ .Release.Namespace }}.svc.cluster.local"
  duration: 8760h
  renewBefore: 720h
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Release.Name }}-reid-c-cert
spec:
  secretName: {{ .Release.Name }}-reid-c-tls
  issuerRef:
    name: {{ .Release.Name }}-ca-issuer
    kind: Issuer
  commonName: "reid.scenescape.intel.com"
  dnsNames:
  - "reid.scenescape.intel.com"
  - "reid"
  - "reid.{{ .Release.Namespace }}"
  - "reid.{{ .Release.Namespace }}.svc.cluster.local"
  duration: 8760h
  renewBefore: 720h
{{- end }}
