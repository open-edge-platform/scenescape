apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-pgserver-dep
  labels:
    app: {{ .Release.Name }}-pgserver
  annotations:
    container.apparmor.security.beta.kubernetes.io/pgserver: unconfined
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-pgserver
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-pgserver
    spec:
      shareProcessNamespace: true
      initContainers:
      - name: chown-initcontainer
        image: busybox
        volumeMounts:
        - mountPath: /workspace
          name: pgserver-storage
          subPath: workspace
      containers:
        - image: {{ if .Values.pgserver.repository }}{{ .Values.pgserver.repository }}/{{ end }}{{ .Values.pgserver.image }}
          name: {{ .Release.Name }}-pgserver
          env:
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ .Release.Name }}-db
                key: DATABASE_PASSWORD
{{- if .Values.proxy.enabled }}
          - name: HTTP_PROXY
            value: {{ .Values.proxy.httpProxy }}
          - name: HTTPS_PROXY
            value: {{ .Values.proxy.httpsProxy }}
          - name: NO_PROXY
            value: {{ .Values.proxy.noProxy }}
          - name: http_proxy
            value: {{ .Values.proxy.httpProxy }}
          - name: https_proxy
            value: {{ .Values.proxy.httpsProxy }}
          - name: no_proxy
            value: {{ .Values.proxy.noProxy }}
{{- end }}
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
            capabilities:
              add: ["SYS_ADMIN"]
          ports:
          - containerPort: 5432
          readinessProbe:
            exec:
              command:
              - cat
              - /tmp/healthy
            periodSeconds: 1
          resources: {}
          volumeMounts:
          - mountPath: /dev/fuse
            name: dev-fuse
          - mountPath: /workspace
            name: pgserver-storage
            subPath: workspace
          - mountPath: /workspace/media
            name: media-storage
          {{- if .Values.tests.enabled }}
          - mountPath: /workspace/tests
            name: tests-storage
            subPath: tests
          {{- end }}
      restartPolicy: Always
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
      - name: dev-fuse
        hostPath:
          path: /dev/fuse
      - name: pgserver-storage
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-pgserver-pvc
      - name: media-storage
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-media-pvc
      {{- if .Values.tests.enabled }}
      - name: tests-storage
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-tests-pvc
      {{- end }}
status: {}
---
apiVersion: v1
kind: Service
metadata:
  name: pgserver
spec:
  selector:
    app: {{ .Release.Name }}-pgserver
  ports:
  - protocol: TCP
    port: 5432
    targetPort: 5432
