{{- if .Values.positioning.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-positioning
data:
  positioning.json: {{ include "positioning.configJson" . | quote }}
  positioning-assignments.json: {{ .Values.positioning.assignments | default dict | toJson | quote }}
{{- end }}