{{- if and .Values.positioning.enabled (not .Values.positioning.onvifCredentials.existingSecret) .Values.positioning.onvifCredentials.sources }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "positioning.onvifCredentialsSecretName" . }}
type: Opaque
data:
  {{- range $sourceId, $credentials := .Values.positioning.onvifCredentials.sources }}
  {{- if not (and (kindIs "map" $credentials) $credentials.username (not (kindIs "invalid" $credentials.password))) }}
  {{- fail (printf "positioning.onvifCredentials.sources.%s requires username and password" $sourceId) }}
  {{- end }}
  {{ $sourceId }}.json: {{ dict "username" (toString $credentials.username) "password" (toString $credentials.password) | toJson | b64enc }}
  {{- end }}
{{- end }}
