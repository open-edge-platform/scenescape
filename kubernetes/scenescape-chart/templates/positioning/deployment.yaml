{{- if .Values.positioning.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-positioning
  labels:
    app: {{ .Release.Name }}-positioning
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-positioning
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-positioning
        {{ include "releaseLabels" . | indent 8 }}
    spec:
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
      containers:
        - name: positioning
          image: {{ .Values.repository }}/{{ .Values.positioning.image }}:{{ .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.positioning.pullPolicy }}
          args:
            - "--broker"
            - "broker.{{ .Release.Namespace }}.svc.cluster.local"
            - "--brokerauth"
            - "/run/secrets/positioning.auth"
            - "--cert"
            - "/run/secrets/certs/scenescape-positioning.crt"
            - "--keyfile"
            - "/run/secrets/certs/scenescape-positioning.key"
            - "--rootcert"
            - "/run/secrets/certs/scenescape-ca.pem"
            - "--manager-url"
            - "https://web.{{ .Release.Namespace }}.svc.cluster.local/api/v1"
            - "--config"
            - "/app/config/positioning.json"
          env:
            - name: POSITIONING_NTP_SERVER
              value: "ntpserv.{{ .Release.Namespace }}.svc.cluster.local"
          securityContext:
            {{ include "defaultContainerSecurityContext" . | indent 12 }}
            runAsUser: 1001
            runAsGroup: 1001
          readinessProbe:
            exec:
              command:
                - python3
                - -c
                - "import os,sys; sys.exit(0 if os.path.exists('/tmp/positioning-ready') else 1)"
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - name: positioning-config
              mountPath: /app/config/positioning.json
              subPath: positioning.json
              readOnly: true
            - name: positioning-auth
              mountPath: /run/secrets/positioning.auth
              subPath: positioning.auth
              readOnly: true
            - name: certs
              mountPath: /run/secrets/certs/scenescape-ca.pem
              subPath: scenescape-ca.pem
              readOnly: true
            - name: positioning-tls
              mountPath: /run/secrets/certs/scenescape-positioning.crt
              subPath: scenescape-positioning.crt
              readOnly: true
            - name: positioning-tls
              mountPath: /run/secrets/certs/scenescape-positioning.key
              subPath: scenescape-positioning.key
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: positioning-config
          configMap:
            name: {{ .Release.Name }}-positioning
        - name: positioning-auth
          secret:
            secretName: {{ .Release.Name }}-positioning.auth
        - name: positioning-tls
          secret:
            secretName: {{ .Release.Name }}-positioning-tls
            items:
              - key: tls.crt
                path: scenescape-positioning.crt
              - key: tls.key
                path: scenescape-positioning.key
        - name: tmp
          emptyDir: {}
        - name: certs
          projected:
            sources:
              - secret:
                  name: {{ .Release.Name }}-scenescape-ca.pem
                  items:
                    - key: tls.crt
                      path: scenescape-ca.pem
{{- end }}