---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-autocalibration-dep
  labels:
    app: {{ .Release.Name }}-autocalibration
    {{ include "releaseLabels" . | indent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-autocalibration
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-autocalibration
        {{ include "releaseLabels" . | indent 8 }}
    spec:
      shareProcessNamespace: true
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      initContainers:
        - name: wait-for-web-initcontainer
          image: {{ .Values.busyboxImage.repository }}/{{ .Values.busyboxImage.name }}:{{ .Values.busyboxImage.tag }}
          imagePullPolicy: {{ .Values.busyboxImage.pullPolicy }}
          command: ["/bin/sh", "-c", "until wget -q --spider http://web.{{ .Release.Namespace }}.svc.cluster.local; do sleep 1; done"]
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            {{ include "defaultContainerSecurityContext" . | indent 12 }}
        - name: fix-permissions-initcontainer
          image: {{ .Values.busyboxImage.repository }}/{{ .Values.busyboxImage.name }}:{{ .Values.busyboxImage.tag }}
          imagePullPolicy: {{ .Values.busyboxImage.pullPolicy }}
          command: ["/bin/sh", "-c", "chown -R 1000:1000 /data/media /data/datasets /data/netvlad_models"]
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
          - mountPath: /data/media
            name: media-storage
          - mountPath: /data/datasets
            name: datasets-storage
          - mountPath: /data/netvlad_models
            name: netvlad-models
        {{- if not .Values.autocalibration.skipModelDownload }}
        # Native sidecar (restartPolicy: Always): starts alongside the app instead of
        # blocking it, so AprilTag calibration works immediately; markerless calibration
        # becomes available once this loop finishes downloading the NetVLAD model.
        - name: download-netvlad-sidecar
          restartPolicy: Always
          image: {{ .Values.repository }}/{{ .Values.autocalibration.image }}:{{ .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.autocalibration.pullPolicy }}
          command:
          - sh
          - -c
          - |
            while true; do
              if python3 /usr/local/bin/download_models.py; then
                sleep 3600
              else
                echo "NetVLAD model download failed, retrying in 60s" >&2
                sleep 60
              fi
            done
          env:
          - name: NETVLAD_MODEL_DIR
            value: /usr/local/lib/python3.11/site-packages/third_party/netvlad
          {{ include "proxy_envs" . | indent 10 }}
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
          volumeMounts:
          - mountPath: /usr/local/lib/python3.11/site-packages/third_party/netvlad
            name: netvlad-models
        {{- end }}
      containers:
        - args:
          - --restauth
          - /run/secrets/calibration.auth
          - --resturl
          - https://web.{{ .Release.Namespace }}.svc.cluster.local:443/api/v1
          - --restport
          - "8443"
          - --ssl-certfile
          - /run/secrets/certs/scenescape-autocalibration.crt
          - --ssl-keyfile
          - /run/secrets/certs/scenescape-autocalibration.key
          image: {{ .Values.repository }}/{{ .Values.autocalibration.image }}:{{ .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.autocalibration.pullPolicy }}
          name: {{ .Release.Name }}-autocalibration
          env:
          - name: EGL_PLATFORM
            value: surfaceless
          - name: NETVLAD_MODEL_DIR
            value: /usr/local/lib/python3.11/site-packages/third_party/netvlad
          {{ include "proxy_envs" . | indent 10 }}
          ports:
            - containerPort: 8443
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
          startupProbe:
            exec:
              command:
              - sh
              - -c
              - curl -k -fsS https://localhost:8443/v1/status >/dev/null
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
            initialDelaySeconds: 30
          readinessProbe:
            exec:
              command:
              - sh
              - -c
              - >
                curl -k -s https://localhost:8443/v1/status |
                python3 -c 'import json,sys; data=json.load(sys.stdin); raise SystemExit(0 if data.get("status") == "running" else 1)'
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
            initialDelaySeconds: 10
          livenessProbe:
            exec:
              command:
              - sh
              - -c
              - curl -k -fsS https://localhost:8443/v1/status >/dev/null
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
            initialDelaySeconds: 20
          resources: {}
          volumeMounts:
          - mountPath: /run/secrets/certs/scenescape-ca.pem
            subPath: scenescape-ca.pem
            name: certs
            readOnly: true
          - mountPath: /run/secrets/certs/scenescape-autocalibration.crt
            subPath: scenescape-autocalibration.crt
            name: certs
            readOnly: true
          - mountPath: /run/secrets/certs/scenescape-autocalibration.key
            subPath: scenescape-autocalibration.key
            name: certs
            readOnly: true
          - mountPath: /run/secrets/django/secrets.py
            subPath: secrets.py
            name: secrets-py
            readOnly: true
          - mountPath: /run/secrets/calibration.auth
            name: calibration-auth
            readOnly: true
            subPath: calibration.auth
          - mountPath: /home/scenescape/Scenescape/media
            name: media-storage
          - mountPath: /home/scenescape/Scenescape/datasets
            name: datasets-storage
          - mountPath: /usr/local/lib/python3.11/site-packages/third_party/netvlad
            name: netvlad-models
      restartPolicy: Always
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
     {{ include "certs_volume" . | nindent 6 }}
      - name: secrets-py
        secret:
          secretName: {{ .Release.Name }}-secrets-py
      - name: calibration-auth
        secret:
          secretName: {{ .Release.Name }}-calibration.auth
      - name: media-storage
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-media-pvc
      - name: datasets-storage
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-datasets-pvc
      - name: netvlad-models
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-netvlad-pvc
status: {}
