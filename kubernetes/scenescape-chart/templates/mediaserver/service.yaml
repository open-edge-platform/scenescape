# The video source (mediamtx + per-scene ffmpeg loopers) runs outside the
# cluster as a standalone compose stack (sample_data/demo_scenes/docker-compose.yml).
# This points the "mediaserver" hostname, hardcoded in the dlsps pipeline
# configs, at that external endpoint. Set videoSource.host (DNS name) or
# videoSource.ip (bare IP) in values.yaml; nothing is rendered if neither is set.
{{- if .Values.videoSource.host }}
---
apiVersion: v1
kind: Service
metadata:
  name: mediaserver
spec:
  type: ExternalName
  externalName: {{ .Values.videoSource.host }}
{{- else if .Values.videoSource.ip }}
---
apiVersion: v1
kind: Service
metadata:
  name: mediaserver
spec:
  ports:
  - port: {{ .Values.videoSource.port }}
    protocol: TCP
    name: rtsp
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: mediaserver
  labels:
    kubernetes.io/service-name: mediaserver
addressType: IPv4
ports:
- name: rtsp
  protocol: TCP
  port: {{ .Values.videoSource.port }}
endpoints:
- addresses:
  - {{ .Values.videoSource.ip }}
{{- end }}
