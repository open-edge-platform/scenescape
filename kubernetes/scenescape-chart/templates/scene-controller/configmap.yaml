{{- if not .Values.tracker.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-tracker-config
data:
  tracker-config.json: |-
{{ .Files.Get "files/scene-controller/tracker-config.json" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-reid-config
data:
  reid-config.json: |-
{{ .Files.Get "files/scene-controller/reid-config.json" | indent 4 }}
{{- if include "scene.ptzActive" . }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-scene-ptz
data:
  ptz-consumer-config.json: {{ .Values.scene.ptz.config | toJson | quote }}
  positioning-assignments.json: {{ .Values.positioning.assignments | default dict | toJson | quote }}
{{- end }}
{{- end }}
