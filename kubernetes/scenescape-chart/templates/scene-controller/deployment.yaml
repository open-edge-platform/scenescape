---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-scene-dep
  labels:
    app: {{ .Release.Name }}-scene
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-scene
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-scene
        {{ include "releaseLabels" . | indent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
      shareProcessNamespace: true
      # The "reid" Service would otherwise inject REID_PORT=tcp://<ip>:<port>,
      # colliding with the controller's own REID_* settings. All dependencies
      # are addressed by DNS, so the service-link variables are not needed.
      enableServiceLinks: false
      initContainers:
      - name: wait-for-web-initcontainer
        image: {{ .Values.busyboxImage.repository }}/{{ .Values.busyboxImage.name }}:{{ .Values.busyboxImage.tag }}
        imagePullPolicy: {{ .Values.busyboxImage.pullPolicy }}
        command: ["/bin/sh", "-c", "until wget -q --spider http://web.{{ .Release.Namespace }}.svc.cluster.local; do sleep 1; done"]
        securityContext:
          readOnlyRootFilesystem: true
          runAsUser: 1000
      containers:
        - args:
          - --restauth=/run/secrets/controller.auth
          - --brokerauth=/run/secrets/controller.auth
          - --broker
          - broker.{{ .Release.Namespace }}.svc.cluster.local
          - --resturl
          - https://web.{{ .Release.Namespace }}.svc.cluster.local/api/v1
          - --ntp
          - ntpserv.{{ .Release.Namespace }}.svc.cluster.local
          - --healthcheck_port=8080
          image: {{ .Values.repository }}/{{ .Values.scene.image }}:{{ .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.scene.pullPolicy }}
          name: {{ .Release.Name }}-scene
          env:
          - name: CONTROLLER_ENABLE_ANALYTICS_ONLY
            value: {{ .Values.scene.analyticsOnly | quote }}
          - name: REID_HOSTNAME
            value: reid.{{ .Release.Namespace }}.svc.cluster.local
          {{- if .Values.reid.enabled }}
          - name: REID_DATABASE
            value: {{ include "reid.backend" . | upper | quote }}
          # `default` is not used here: it would turn an explicit 0 (retention
          # disabled) back into the chart default.
          - name: REID_DESCRIPTOR_TTL_SECS
            value: {{ .Values.reid.descriptorTtlSecs | quote }}
          - name: REID_PURGE_INTERVAL_SECS
            value: {{ .Values.reid.purgeIntervalSecs | quote }}
          {{- end }}
            {{ include "proxy_envs" . | indent 10 }}
          ports:
          - containerPort: 8080
            name: health
            protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          securityContext:
            readOnlyRootFilesystem: true
          resources: {}
          volumeMounts:
          - mountPath: /run/secrets/certs/scenescape-ca.pem
            subPath: scenescape-ca.pem
            name: certs
            readOnly: true
          {{- if .Values.reid.enabled }}
          - mountPath: /run/secrets/certs/scenescape-reid.key
            subPath: scenescape-reid.key
            name: certs
            readOnly: true
          - mountPath: /run/secrets/certs/scenescape-reid.crt
            subPath: scenescape-reid.crt
            name: certs
            readOnly: true
          {{- end }}
          - mountPath: /run/secrets/django/secrets.py
            subPath: secrets.py
            name: secrets-py
            readOnly: true
          - mountPath: /run/secrets/controller.auth
            name: controller-auth
            readOnly: true
            subPath: controller.auth
          - mountPath: /home/scenescape/Scenescape/media
            name: media-storage
          - mountPath: /home/scenescape/Scenescape/tracker-config.json
            name: tracker-config
            subPath: tracker-config.json
          - mountPath: /home/scenescape/Scenescape/reid-config.json
            name: reid-config
            subPath: reid-config.json
      restartPolicy: Always
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
      {{ include "certs_volume" . | indent 6 }}
      - name: secrets-py
        secret:
          secretName: {{ .Release.Name }}-secrets-py
      - name: controller-auth
        secret:
          secretName: {{ .Release.Name }}-controller.auth
      - name: media-storage
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-media-pvc
      - name: tracker-config
        configMap:
          name: {{ .Release.Name }}-tracker-config
      - name: reid-config
        configMap:
          name: {{ .Release.Name }}-reid-config
status: {}
