---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-init-sample-data
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- if .Values.hooks.enabled }}
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "1"
    {{- if not .Values.chartdebug }}
    "helm.sh/hook-delete-policy": hook-succeeded
    {{- end }}
    {{- end }}
spec:
  template:
    spec:
      initContainers:
      - name: download-sample-data
        command: ["/bin/bash", "-c"]
        image: ubuntu:22.04
        env:
        {{- include "proxy_envs" . | indent 8 }}
        args:
        - |
          set -euo pipefail
          set -x
          apt update && apt install -y wget
          if [ -f /workspace/sample-data-storage/sample_data/.done ]; then
              echo ".done file exists in /workspace/sample-data-storage/sample_data/"
          else
              echo ".done file does NOT exist in /workspace/sample-data-storage/sample_data/"
              echo "Downloading videos from GitHub..."
              mkdir -p /workspace/sample-data-storage/sample_data/
              SAMPLE_DATA_URL="{{ .Values.sampleData.source }}/{{ .Values.sampleData.sourceVersion }}/{{ .Values.sampleData.sourceDir }}"
              FILES="{{ join " " .Values.sampleData.files }}"
              for file in $FILES; do
                  echo "Downloading $file..."
                  wget -O "/workspace/sample-data-storage/sample_data/$file" "$SAMPLE_DATA_URL/$file"
              done
              echo "Sample data downloaded successfully"
          fi
        volumeMounts:
        - mountPath: /workspace/sample-data-storage
          name: sample-data-storage
      - name: convert-videos
        image: linuxserver/ffmpeg:version-8.0-cli
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -eu
          set -x
          echo "Converting .mp4 files to .ts..."
          if [ -f /workspace/sample-data-storage/sample_data/.done ]; then
            echo ".done file exists in /workspace/sample-data-storage/sample_data/"
          else
            for mp4_file in /workspace/sample-data-storage/sample_data/*.mp4; do
                ts_file="${mp4_file%.mp4}.ts"
                echo "Converting $mp4_file to $ts_file..."
                /ffmpegwrapper.sh -i "$mp4_file" -c copy "$ts_file"
            done
          fi
        volumeMounts:
        - mountPath: /workspace/sample-data-storage
          name: sample-data-storage
      containers:
      - name: {{ .Release.Name }}-init-complete
        image: busybox
        command: ["/bin/sh", "-c"]
        args:
        - |
          touch /workspace/sample-data-storage/.done
        volumeMounts:
        - mountPath: /workspace/sample-data-storage
          name: sample-data-storage
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
      - name: sample-data-storage
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-sample-data-pvc
      - name: videos-storage
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-videos-pvc
  backoffLimit: 3
