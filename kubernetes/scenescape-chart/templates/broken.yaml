apiVersion: apps/v1
kind: Deployment
metadata:
  name: broken-pod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: broken-pod
  template:
    metadata:
      labels:
        app: broken-pod
    spec:
      containers:
        - name: busybox
          image: busybox
          command: ["sh", "-c", "sleep 10; exit 1"]