{{- if and .Values.tracker.enabled .Values.reid.enabled }}
{{- fail "tracker.enabled=true is incompatible with reid.enabled=true; ReID requires the Scene Controller, which Tracker replaces." }}
{{- end }}
{{- if .Values.tracker.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-tracker
  labels:
    app: {{ .Release.Name }}-tracker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-tracker
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-tracker
        {{ include "releaseLabels" . | indent 8 }}
      {{- if include "tracker.ptzActive" . }}
      annotations:
        checksum/ptz-config: {{ dict "config" .Values.tracker.ptz.config "assignments" .Values.positioning.assignments | toJson | sha256sum }}
      {{- end }}
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      initContainers:
      - name: wait-for-broker-initcontainer
        image: {{ .Values.busyboxImage.repository }}/{{ .Values.busyboxImage.name }}:{{ .Values.busyboxImage.tag }}
        imagePullPolicy: {{ .Values.busyboxImage.pullPolicy }}
        command: ["/bin/sh", "-c", "until nc -vz broker.{{ .Release.Namespace }}.svc.cluster.local 1883; do sleep 1; done"]
        securityContext:
          {{ include "defaultContainerSecurityContext" . | indent 10 }}
      - name: wait-for-web-initcontainer
        image: {{ .Values.busyboxImage.repository }}/{{ .Values.busyboxImage.name }}:{{ .Values.busyboxImage.tag }}
        imagePullPolicy: {{ .Values.busyboxImage.pullPolicy }}
        command: ["/bin/sh", "-c", "until wget -q --spider http://web.{{ .Release.Namespace }}.svc.cluster.local; do sleep 1; done"]
        securityContext:
          {{ include "defaultContainerSecurityContext" . | indent 10 }}
      containers:
      - name: {{ .Release.Name }}-tracker
        image: {{ .Values.repository }}/{{ .Values.tracker.image }}:{{ .Chart.AppVersion }}
        imagePullPolicy: {{ .Values.tracker.pullPolicy }}
        env:
        - name: TRACKER_LOG_LEVEL
          value: {{ .Values.tracker.logLevel | quote }}
        - name: TRACKER_MQTT_HOST
          value: broker.{{ .Release.Namespace }}.svc.cluster.local
        - name: TRACKER_MQTT_PORT
          value: "1883"
        - name: TRACKER_MQTT_INSECURE
          value: "false"
        - name: TRACKER_MQTT_TLS_CA_CERT
          value: /run/secrets/certs/scenescape-ca.pem
        - name: TRACKER_MQTT_TLS_VERIFY_SERVER
          value: "true"
        - name: TRACKER_MANAGER_URL
          value: https://web.{{ .Release.Namespace }}.svc.cluster.local
        - name: TRACKER_MANAGER_AUTH_PATH
          value: /run/secrets/controller.auth
        - name: TRACKER_MANAGER_CA_CERT_PATH
          value: /run/secrets/certs/scenescape-ca.pem
        - name: TRACKER_SCENES_SOURCE
          value: api
        {{- if include "tracker.ptzActive" . }}
        {{- $ptz := .Values.tracker.ptz }}
        {{- $shadow := $ptz.config.shadow | default dict }}
        - name: TRACKER_PTZ_ENABLED
          value: {{ $ptz.enabled | default false | quote }}
        - name: TRACKER_PTZ_SHADOW_MODE
          value: {{ $ptz.shadowMode | default false | quote }}
        - name: TRACKER_PTZ_MAX_POSE_AGE_S
          value: {{ $ptz.config.max_pose_age_s | quote }}
        - name: TRACKER_PTZ_MAX_CLOCK_OFFSET_S
          value: {{ $ptz.config.max_clock_offset_s | quote }}
        - name: TRACKER_PTZ_MAX_DETECTION_PIPELINE_LATENCY_S
          value: {{ $ptz.config.max_detection_pipeline_latency_s | quote }}
        - name: TRACKER_PTZ_MAX_DETECTION_TIMESTAMP_UNCERTAINTY_S
          value: {{ $ptz.config.max_detection_timestamp_uncertainty_s | quote }}
        {{- if hasKey $shadow "run_id" }}
        - name: TRACKER_PTZ_SHADOW_RUN_ID
          value: {{ $shadow.run_id | quote }}
        {{- end }}
        {{- if hasKey $shadow "sample_every_n" }}
        - name: TRACKER_PTZ_SHADOW_SAMPLE_EVERY_N
          value: {{ $shadow.sample_every_n | quote }}
        {{- end }}
        {{- if hasKey $shadow "per_decision" }}
        - name: TRACKER_PTZ_SHADOW_PER_DECISION
          value: {{ $shadow.per_decision | quote }}
        {{- end }}
        - name: TRACKER_PTZ_ASSIGNMENTS_PATH
          value: /scenescape/config/positioning-assignments.json
        # PTZ admission requires a synchronized clock
        - name: TRACKER_NTP_SERVER
          value: ntpserv.{{ .Release.Namespace }}.svc.cluster.local
        {{- end }}
        # Paho MQTT ignores no_proxy; tracker unsets these empty vars at startup (proxy_utils.cpp)
        - name: http_proxy
          value: ""
        - name: https_proxy
          value: ""
        - name: HTTP_PROXY
          value: ""
        - name: HTTPS_PROXY
          value: ""
        ports:
        - containerPort: 8080
          name: health
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        securityContext:
          {{ include "defaultContainerSecurityContext" . | indent 10 }}
        resources:
          {{- toYaml .Values.tracker.resources | nindent 10 }}
        volumeMounts:
        - mountPath: /run/secrets/certs/scenescape-ca.pem
          name: certs
          readOnly: true
          subPath: scenescape-ca.pem
        - mountPath: /run/secrets/controller.auth
          name: controller-auth
          readOnly: true
          subPath: controller.auth
        {{- if include "tracker.ptzActive" . }}
        - mountPath: /scenescape/config/positioning-assignments.json
          name: tracker-ptz
          readOnly: true
          subPath: positioning-assignments.json
        {{- end }}
      restartPolicy: Always
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
      {{ include "certs_volume" . | indent 6 }}
      - name: controller-auth
        secret:
          secretName: {{ .Release.Name }}-controller.auth
      {{- if include "tracker.ptzActive" . }}
      - name: tracker-ptz
        configMap:
          name: {{ .Release.Name }}-tracker-ptz
      {{- end }}
{{- end }}