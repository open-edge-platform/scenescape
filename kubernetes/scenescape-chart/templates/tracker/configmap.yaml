{{- if and .Values.tracker.enabled (include "tracker.ptzActive" .) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-tracker-ptz
data:
  positioning-assignments.json: {{ .Values.positioning.assignments | default dict | toJson | quote }}
{{- end }}
