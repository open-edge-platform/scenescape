# Authentication and ACL options apply to the listener they follow, so the
# Positioning ACL below does not restrict the existing listeners. Mosquitto 2.1
# deprecates per_listener_settings (removal planned for 3.0) but still requires
# it to scope an ACL to a single listener.
per_listener_settings true

listener 1883
listener_allow_anonymous true
keyfile /mosquitto/secrets/certs/scenescape-broker.key
certfile /mosquitto/secrets/certs/scenescape-broker.crt
tls_version tlsv1.3

listener 1884
listener_allow_anonymous true
cafile /mosquitto/secrets/certs/scenescape-ca.pem
keyfile /mosquitto/secrets/certs/scenescape-broker.key
certfile /mosquitto/secrets/certs/scenescape-broker.crt
tls_version tlsv1.3
protocol websockets

# Dedicated Positioning listener. Client certificate identity is the MQTT ACL
# principal; its generated ACL grants only this Resolver's assigned topics.
listener 8883
cafile /mosquitto/secrets/certs/scenescape-ca.pem
keyfile /mosquitto/secrets/certs/scenescape-broker.key
certfile /mosquitto/secrets/certs/scenescape-broker.crt
tls_version tlsv1.3
require_certificate true
use_identity_as_username true
listener_allow_anonymous false
acl_file /mosquitto/acl/positioning.acl
