version: "3.8"

# Test compose file to verify mqtt_client_bridge functionality
# Usage: docker compose -f docker-compose-dl-streamer-mqtt-nav2.yml -f mqtt_client_bridge/docker-compose.test.yml --profile mqtt_client up

services:
  # Turtlebot3 simulator with Nav2
  # This provides a ROS 2 navigation stack to test against
  nav2_simulator:
    build:
      context: ./mqtt_client_bridge
      dockerfile: nav2_simulator.Dockerfile
      args:
        http_proxy: http://proxy-dmz.intel.com:911
        https_proxy: http://proxy-dmz.intel.com:912
    image: nav2_simulator:latest
    container_name: nav2_simulator
    network_mode: host
    environment:
      - ROS_DOMAIN_ID=0
      - ROS_LOCALHOST_ONLY=0
      - RMW_IMPLEMENTATION=rmw_zenoh_cpp
      - http_proxy=http://proxy-dmz.intel.com:911
      - https_proxy=http://proxy-dmz.intel.com:912
      - HTTP_PROXY=http://proxy-dmz.intel.com:911
      - HTTPS_PROXY=http://proxy-dmz.intel.com:912
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./mqtt_client_bridge/mqtt_to_ros_bridge.py:/mqtt_to_ros_bridge.py:ro
    stdin_open: true
    tty: true
    command: >
      bash -c "
        source /opt/ros/jazzy/setup.bash &&
        python3 /mqtt_to_ros_bridge.py &
        ros2 launch turtlebot3_gazebo turtlebot3_world.launch.py &
        sleep 10 &&
        ros2 launch nav2_bringup navigation_launch.py use_sim_time:=True
      "
    restart: unless-stopped
    pids_limit: 1000
    depends_on:
      - zenoh_router
      - mqtt_client_bridge

  # Test runner - publishes MQTT messages and listens for ROS topics
  mqtt_bridge_test:
    image: osrf/ros:jazzy-desktop
    container_name: mqtt_bridge_test
    network_mode: host
    environment:
      - ROS_DOMAIN_ID=0
      - ROS_LOCALHOST_ONLY=0
      - http_proxy=http://proxy-dmz.intel.com:911
      - https_proxy=http://proxy-dmz.intel.com:912
      - HTTP_PROXY=http://proxy-dmz.intel.com:911
      - HTTPS_PROXY=http://proxy-dmz.intel.com:912
      - NO_PROXY=localhost,127.0.0.1,.intel.com,broker.scenescape.intel.com
    volumes:
      - ./mqtt_client_bridge/tests:/test:ro
    stdin_open: true
    tty: true
    command: >
      bash -c "
        apt-get update &&
        apt-get install -y mosquitto-clients python3-paho-mqtt &&
        source /opt/ros/jazzy/setup.bash &&
        sleep 5 &&
        python3 /test/test_mqtt_bridge.py
      "
    restart: "no"
    pids_limit: 1000
    depends_on:
      - mqtt_client_bridge
      - nav2_simulator
